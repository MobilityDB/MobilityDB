# B-tree comparison sub-family (SQL, per-family region-in-file). The six comparison
# functions lt/le/eq/ne/ge/gt + cmp (backing Temporal_lt/.../_cmp), the six B-tree
# operators `< <= = <> >= >` and the `<temp>_btree_ops` USING btree opclass. Built
# from ONE skeleton (templates/comparisons.sql.tmpl) for the uniform CREATE FUNCTION
# set; the operators/opclass/banner/dividers carry per-family whitespace + per-op
# selectivity drift so they are reproduced BYTE-EXACT as `lit` blocks (as the
# constructor surface does for its headers + family-extras). `--validate` extracts
# the committed hand block by banner header (begin) + B-tree/hash-tail divider (end)
# anchors so the deployed .in.sql is untouched while the template is proven. The
# tpcpoint/tpcpatch families (B-tree interleaved with hash, no divider, reordered
# functions) and the base set/span/spanset/tbox/temporal families (grouped multi-
# basetype functions, Span_*/Tbox_* symbols) do not token-swap the shared skeleton
# and are classified out by omission from the data below, never by a code skip.
comparison_families:
- family: geo
  file: mobilitydb/sql/geo/052_tgeo.in.sql
  reference: true
  begin: "\n * Comparison functions and B-tree indexing\n"
  end: "CREATE FUNCTION hash("
  blocks:
  - lit: "/******************************************************************************\n * Comparison functions and B-tree indexing\n ******************************************************************************/\n\n"
  - funcs: tgeometry
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = tgeometry, RIGHTARG = tgeometry,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tgeometry, RIGHTARG = tgeometry,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = tgeometry, RIGHTARG = tgeometry,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = tgeometry, RIGHTARG = tgeometry,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tgeometry, RIGHTARG = tgeometry,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tgeometry, RIGHTARG = tgeometry,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\n\nCREATE OPERATOR CLASS tgeometry_btree_ops\n  DEFAULT FOR TYPE tgeometry USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tgeometry, tgeometry);\n\n/******************************************************************************/\n\n"
  - funcs: tgeography
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = tgeography, RIGHTARG = tgeography,\n  PROCEDURE = lt,\n  COMMUTATOR = >,  NEGATOR = >=,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tgeography, RIGHTARG = tgeography,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = tgeography, RIGHTARG = tgeography,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = tgeography, RIGHTARG = tgeography,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tgeography, RIGHTARG = tgeography,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tgeography, RIGHTARG = tgeography,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = tspatial_sel, JOIN = tspatial_joinsel\n);\n\nCREATE OPERATOR CLASS tgeography_btree_ops\n  DEFAULT FOR TYPE tgeography USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tgeography, tgeography);\n\n"
- family: tpoint
