 lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR < (\n  LEFTARG = bigintset, RIGHTARG = bigintset,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR < (\n  LEFTARG = floatset, RIGHTARG = floatset,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR < (\n  LEFTARG = textset, RIGHTARG = textset,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR < (\n  LEFTARG = dateset, RIGHTARG = dateset,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR < (\n  LEFTARG = tstzset, RIGHTARG = tstzset,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\n\nCREATE OPERATOR <= (\n  LEFTARG = intset, RIGHTARG = intset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = bigintset, RIGHTARG = bigintset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = floatset, RIGHTARG = floatset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = textset, RIGHTARG = textset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = dateset, RIGHTARG = dateset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tstzset, RIGHTARG = tstzset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\n\nCREATE OPERATOR >= (\n  LEFTARG = intset, RIGHTARG = intset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = bigintset, RIGHTARG = bigintset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = floatset, RIGHTARG = floatset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = textset, RIGHTARG = textset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = dateset, RIGHTARG = dateset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tstzset, RIGHTARG = tstzset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\n\nCREATE OPERATOR > (\n  LEFTARG = intset, RIGHTARG = intset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = bigintset, RIGHTARG = bigintset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = floatset, RIGHTARG = floatset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = textset, RIGHTARG = textset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = dateset, RIGHTARG = dateset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tstzset, RIGHTARG = tstzset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\n\nCREATE OPERATOR CLASS intset_btree_ops\n  DEFAULT FOR TYPE intset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(intset, intset);\nCREATE OPERATOR CLASS bigintset_btree_ops\n  DEFAULT FOR TYPE bigintset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(bigintset, bigintset);\nCREATE OPERATOR CLASS floatset_btree_ops\n  DEFAULT FOR TYPE floatset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(floatset, floatset);\nCREATE OPERATOR CLASS textset_btree_ops\n  DEFAULT FOR TYPE textset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(textset, textset);\nCREATE OPERATOR CLASS dateset_btree_ops\n  DEFAULT FOR TYPE dateset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(dateset, dateset);\nCREATE OPERATOR CLASS tstzset_btree_ops\n  DEFAULT FOR TYPE tstzset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tstzset, tstzset);\n\n"
