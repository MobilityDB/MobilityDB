;\n\nCREATE AGGREGATE appendInstantAgg(tgeography, text, float, interval) (\n  SFUNC = temporal_app_tinst_transfn,\n  STYPE = tgeography,\n  FINALFUNC = temporal_append_finalfn,\n  PARALLEL = safe\n);\n\n/*****************************************************************************/\n\n"
