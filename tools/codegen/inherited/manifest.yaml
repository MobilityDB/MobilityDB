  - lit: "\nCREATE OPERATOR = (\n  LEFTARG = npointset, RIGHTARG = npointset,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = eqsel, JOIN = eqjoinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = npointset, RIGHTARG = npointset,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = neqsel, JOIN = neqjoinsel\n);\nCREATE OPERATOR < (\n  LEFTARG = npointset, RIGHTARG = npointset,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = npointset, RIGHTARG = npointset,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = npointset, RIGHTARG = npointset,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = npointset, RIGHTARG = npointset,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = span_sel, JOIN = span_joinsel\n);\n\nCREATE OPERATOR CLASS npointset_btree_ops\n  DEFAULT FOR TYPE npointset USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(npointset, npointset);\n\n"
