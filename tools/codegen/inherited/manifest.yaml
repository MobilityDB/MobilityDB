  - lit: "\nCREATE AGGREGATE extent(tgeometry) (\n  SFUNC = tspatial_extent_transfn,\n  STYPE = stbox,\n  COMBINEFUNC = stbox_extent_combinefn,\n  PARALLEL = safe\n);\nCREATE AGGREGATE extent(tgeography) (\n  SFUNC = tspatial_extent_transfn,\n  STYPE = stbox,\n  COMBINEFUNC = stbox_extent_combinefn,\n  PARALLEL = safe\n);\n\n/*****************************************************************************/\n\n"
