mathfunc_families:
- family: tnumber
  file: mobilitydb/sql/temporal/026_tnumber_mathfuncs.in.sql
  reference: true
  begin: "@brief Temporal mathematic functions"
  whole_file: true
  blocks:
  - lit: "/**\n * @file\n * @brief Temporal mathematic functions and operators\n */\n\n/*****************************************************************************\n * Temporal addition\n *****************************************************************************/\n\n/* integer + <TYPE> */\n\n"
  - fns:
    - {sig: "tAdd(bigint, tbigint)", ret: "tbigint", sym: "Add_number_tnumber"}
    - {sig: "tAdd(integer, tint)", ret: "tint", sym: "Add_number_tnumber"}
  - lit: "\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = bigint, RIGHTARG = tbigint,\n  COMMUTATOR = +\n);\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = integer, RIGHTARG = tint,\n  COMMUTATOR = +\n);\n\n/*****************************************************************************/\n\n/* float + <TYPE> */\n\n"
  - fns:
    - {sig: "tAdd(float, tfloat)", ret: "tfloat", sym: "Add_number_tnumber"}
  - lit: "\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = float, RIGHTARG = tfloat,\n  COMMUTATOR = +\n);\n\n/*****************************************************************************/\n/* tint + <TYPE> */\n\n"
  - fns:
    - {sig: "tAdd(tbigint, bigint)", ret: "tbigint", sym: "Add_tnumber_number"}
    - {sig: "tAdd(tbigint, tbigint)", ret: "tbigint", sym: "Add_tnumber_tnumber"}
  - lit: "\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = tbigint, RIGHTARG = bigint,\n  COMMUTATOR = +\n);\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  COMMUTATOR = +\n);\n\n"
  - fns:
    - {sig: "tAdd(tint, integer)", ret: "tint", sym: "Add_tnumber_number"}
    - {sig: "tAdd(tint, tint)", ret: "tint", sym: "Add_tnumber_tnumber"}
  - lit: "\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = tint, RIGHTARG = integer,\n  COMMUTATOR = +\n);\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = tint, RIGHTARG = tint,\n  COMMUTATOR = +\n);\n\n/*****************************************************************************/\n/* tfloat + <TYPE> */\n\n"
  - fns:
    - {sig: "tAdd(tfloat, float)", ret: "tfloat", sym: "Add_tnumber_number"}
    - {sig: "tAdd(tfloat, tfloat)", ret: "tfloat", sym: "Add_tnumber_tnumber"}
  - lit: "\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = tfloat, RIGHTARG = float,\n  COMMUTATOR = +\n);\nCREATE OPERATOR + (\n  PROCEDURE = tAdd,\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  COMMUTATOR = +\n);\n\n/*****************************************************************************\n * Temporal subtraction\n *****************************************************************************/\n\n/* integer - <TYPE> */\n\n"
  - fns:
    - {sig: "tSub(bigint, tbigint)", ret: "tbigint", sym: "Sub_number_tnumber"}
    - {sig: "tSub(integer, tint)", ret: "tint", sym: "Sub_number_tnumber"}
  - lit: "\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = bigint, RIGHTARG = tbigint\n);\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = integer, RIGHTARG = tint\n);\n\n/*****************************************************************************/\n\n/* tint - <TYPE> */\n\n"
  - fns:
    - {sig: "tSub(tbigint, bigint)", ret: "tbigint", sym: "Sub_tnumber_number"}
    - {sig: "tSub(tbigint, tbigint)", ret: "tbigint", sym: "Sub_tnumber_tnumber"}
  - lit: "\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = tbigint, RIGHTARG = bigint\n);\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = tbigint, RIGHTARG = tbigint\n);\n\n"
  - fns:
    - {sig: "tSub(tint, integer)", ret: "tint", sym: "Sub_tnumber_number"}
    - {sig: "tSub(tint, tint)", ret: "tint", sym: "Sub_tnumber_tnumber"}
  - lit: "\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = tint, RIGHTARG = integer\n);\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = tint, RIGHTARG = tint\n);\n\n/*****************************************************************************/\n\n/* float - <TYPE> */\n\n"
  - fns:
    - {sig: "tSub(float, tfloat)", ret: "tfloat", sym: "Sub_number_tnumber"}
  - lit: "\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = float, RIGHTARG = tfloat\n);\n\n/*****************************************************************************/\n\n/* tfloat - <TYPE> */\n\n"
  - fns:
    - {sig: "tSub(tfloat, float)", ret: "tfloat", sym: "Sub_tnumber_number"}
    - {sig: "tSub(tfloat, tfloat)", ret: "tfloat", sym: "Sub_tnumber_tnumber"}
  - lit: "\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = tfloat, RIGHTARG = float\n);\nCREATE OPERATOR - (\n  PROCEDURE = tSub,\n  LEFTARG = tfloat, RIGHTARG = tfloat\n);\n\n/*****************************************************************************\n * Temporal multiplication\n *****************************************************************************/\n\n/* integer * <TYPE> */\n\n"
  - fns:
