    - {sig: "wcount_transfn(internal, tgeometry, interval)", ret: "internal", sym: "Temporal_wcount_transfn", strict: false, pre: "-- The function is not strict\n"}
    - {sig: "wcount_transfn(internal, tgeography, interval)", ret: "internal", sym: "Temporal_wcount_transfn", strict: false}
  - lit: "\nCREATE AGGREGATE wCount(tgeometry, interval) (\n  SFUNC = wcount_transfn,\n  STYPE = internal,\n  COMBINEFUNC = tint_tsum_combinefn,\n  FINALFUNC = tint_tagg_finalfn,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = SAFE\n);\nCREATE AGGREGATE wCount(tgeography, interval) (\n  SFUNC = wcount_transfn,\n  STYPE = internal,\n  COMBINEFUNC = tint_tsum_combinefn,\n  FINALFUNC = tint_tagg_finalfn,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = SAFE\n);\n\n/*****************************************************************************/\n\n"
  - fns:
    - {sig: "temporal_merge_transfn(internal, tgeometry)", ret: "internal", sym: "Temporal_merge_transfn", strict: false, pre: "-- The function is not strict\n"}
    - {sig: "temporal_merge_transfn(internal, tgeography)", ret: "internal", sym: "Temporal_merge_transfn", strict: false}
  - lit: "\n"
