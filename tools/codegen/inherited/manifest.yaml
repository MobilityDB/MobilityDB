  - fns:
    - {sig: "temporal_app_tinst_transfn(tgeometry, tgeometry,\n    interp text DEFAULT NULL)", ret: "tgeometry", sym: "Temporal_app_tinst_transfn", strict: false, pre: "-- The function is not STRICT\n"}
    - {sig: "temporal_app_tinst_transfn(tgeography, tgeography,\n    interp text DEFAULT NULL)", ret: "tgeography", sym: "Temporal_app_tinst_transfn", strict: false}
  - lit: "\n"
  - fns:
    - {sig: "temporal_app_tinst_transfn(tgeometry, tgeometry,\n    interp text DEFAULT NULL, maxdist float DEFAULT NULL,\n    maxt interval DEFAULT NULL)", ret: "tgeometry", sym: "Temporal_app_tinst_transfn", strict: false, pre: "-- The function is not STRICT\n"}
    - {sig: "temporal_app_tinst_transfn(tgeography, tgeography,\n    interp text DEFAULT NULL, maxdist float DEFAULT NULL, \n    maxt interval DEFAULT NULL)", ret: "tgeography", sym: "Temporal_app_tinst_transfn", strict: false}
