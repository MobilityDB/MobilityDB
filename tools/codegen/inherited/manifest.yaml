    - {sig: "tgeography_tagg_finalfn(internal)", ret: "tgeography", sym: "Temporal_tagg_finalfn"}
  - lit: "\nCREATE AGGREGATE merge(tgeometry) (\n  SFUNC = temporal_merge_transfn,\n  STYPE = internal,\n  COMBINEFUNC = temporal_merge_combinefn,\n  FINALFUNC = tgeometry_tagg_finalfn,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = safe\n);\n\nCREATE AGGREGATE mergeAgg(tgeometry) (\n  SFUNC = temporal_merge_transfn,\n  STYPE = internal,\n  COMBINEFUNC = temporal_merge_combinefn,\n  FINALFUNC = tgeometry_tagg_finalfn,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = safe\n);\nCREATE AGGREGATE merge(tgeography) (\n  SFUNC = temporal_merge_transfn,\n  STYPE = internal,\n  COMBINEFUNC = temporal_merge_combinefn,\n  FINALFUNC = tgeography_tagg_finalfn,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = safe\n);\n\nCREATE AGGREGATE mergeAgg(tgeography) (\n  SFUNC = temporal_merge_transfn,\n  STYPE = internal,\n  COMBINEFUNC = temporal_merge_combinefn,\n  FINALFUNC = tgeography_tagg_finalfn,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = safe\n);\n\n/*****************************************************************************\n * Append tinstant aggregate functions\n *****************************************************************************/\n\n"
