    - seq
  - ops:
    - seqset
  - ops:
    - seqsetgaps
- family: npoint
  file: mobilitydb/sql/npoint/302_tnpoint.in.sql
  reference: true
  begin: "\n * Constructors\n"
  end: "\n * Cast functions\n"
  interp: linear
  span_interp: true
  gaps_maxdist: true
  pairs:
  - base: npoint
