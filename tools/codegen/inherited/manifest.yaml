    - {sig: "minusTime(tpcpatch, tstzset)", ret: tpcpatch, sym: Temporal_minus_tstzset}
    - {sig: "minusTime(tpcpatch, tstzspan)", ret: tpcpatch, sym: Temporal_minus_tstzspan}
