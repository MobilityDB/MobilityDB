# Inherited-behaviour generator — source of truth for the SQL surface that every
# Temporal<T> subclass (TNumber<T> / TSpatial<T>) inherits via late binding +
# lifting (see memory temporal-oo-late-binding-architecture). These files are pure
# wiring to the generic Tspatial_* / Temporal_* wrappers — identical across families
# modulo the type tokens — so they MUST be generated, not hand-maintained per family
# (the per-family hand-drift, e.g. cbuffer 200-bin vs accumulate 150-bin, is the
# irregularity this eliminates).
#
# Canonical within-50-bin POSITION of each inherited file (anchored on the
# cbuffer/geo reference). The emitted filename number = subtype.bin + position, so a
# subtype in any 50-bin gets the same relative layout. (Reconciling the cross-branch
# bin drift fully is tracked separately; this at least emits NEW types correctly.)
positions:
  compops:         4
  spatialfuncs:    5
  topops:          8
  posops:          9
  distance:        10
  aggfuncs:        11
  spatialrels:     12
  tempspatialrels: 14
  indexes:         16
  # Cell-index families split the GiST and SP-GiST opclasses into separate files
  # (the canonical geo/h3 layout); the combined `indexes` above is the cbuffer form.
  gist:            22
  spgist:          23

# Temporal<T> subclasses. `files` lists the inherited behaviours the subtype has
# (a discrete cell-index has no continuous distance / tempspatialrels / spatialfuncs;
# those flags are how the family-reference "surface minus exceptions" is encoded).
subtypes:
  # ---- POC: the new type driving this generator ----
  - temp:  tquadbin
    base:  quadbin
    brief: "temporal QUADBIN cells"
    bin:   350
    category: tspatial
    # A cell-index inherits the scalar base::stbox cast like every spatial type,
    # backed by the quadbin_to_stbox / quadbin_{timestamptz,tstzspan}_to_stbox
    # exports (meos/src/quadbin/tquadbin_boxops.c).
    scalar_stbox_cast: true
    stboxes: false
    # quadbin is planar (Web Mercator), so its stbox bounds the whole cell and the
    # ever intersects/dwithin relationships get spatial index support: they are
    # emitted as C wrappers with SUPPORT tspatial_supportfn (tquadbin_spatialrels.c)
    # rather than SQL cast-wrappers. (h3 is geodetic and stays SQL — a geodetic bbox
    # vs a planar query box would error, so it does not set this flag.)
    index_support: true
    # compops/posops/topops are generic. spatialrels delegates to the geo spatial
    # relationships via the cell→boundary tgeometry conversion
    # (quadbin_cell_to_boundary), the cell-index
    # analogue of th3index 290. GiST/SP-GiST are split (322/323), the canonical
    # cell-index layout (th3index 272/273), not the combined cbuffer `indexes` form.
    files: [compops, posops, topops, spatialrels, tempspatialrels, gist, spgist]

  # ---- h3: convert the hand-written inherited surface to generated (mirror tquadbin) ----
  - temp:  th3index
    base:  h3index
    # The h3 family directory is `h3`, not the base type name `h3index`.
    fam:   h3
    brief: "temporal H3 cells"
    # pg-h3 cell fns temporalize as t+h3Xxx -> th3CellToBoundary (see memory).
    boundary_fn: th3CellToBoundary
    bin:   250
    category: tspatial
    # A cell-index inherits the scalar base::stbox cast — same as tquadbin —
    # backed by the h3index_to_stbox / h3index_{timestamptz,tstzspan}_to_stbox
    # exports (meos/src/h3/th3index_boxops.c).
    scalar_stbox_cast: true
    stboxes: false
    files: [compops, posops, topops, spatialrels, tempspatialrels, gist, spgist]

  # ---- reference families (validate self-regeneration == committed; not new) ----
  - temp:  tcbuffer
    base:  cbuffer
    brief: "temporal circular buffers"
    bin:   200
    category: tspatial
    reference: true
    files: [compops, posops, topops, indexes]

  # ---- converted families: the combined `indexes` opclass file is now generated ----
  # These reproduce the cbuffer reference byte-for-byte (npoint's non-canonical index
  # doc-comment header is normalised to the shared form). Their other inherited files
  # are still hand-maintained and will be migrated incrementally.
  - temp:  tnpoint
    base:  npoint
    brief: "temporal network points"
    bin:   300
    category: tspatial
    # npoint's scalar base::stbox conversions are npoint-specific (Npoint_to_stbox
    # + the extra nsegment/timestamptz/tstzspan variants), so they live in the base
    # file 300_npoint (Conversion between network and space), not the templated
    # cbuffer block; and tnpoint has no trajectory-tiling stboxes functions.
    scalar_stbox_cast: false
    stboxes: false
    files: [compops, posops, topops, indexes]

  - temp:  tpose
    base:  pose
    brief: "temporal poses"
    bin:   100
    category: tspatial
    # tpose is 3-D-capable, so its position operators include the front/back (Z)
    # direction on top of the shared left/right/below/above/before/after set.
    front_back: true
    # A temporal pose delegates its spatial relationships to tgeometry via the
    # tgeompoint cast chain (not a cell-boundary function), and it is not a cell
    # index, so it overrides the conversion expression and the file doc block.
    # Only the temporal (tXxx) relationships are generated here: the ever/always
    # spatial relationships are a hybrid (the ever intersects/dwithin are native C
    # with index support), so 112_tpose_spatialrels stays hand-written.
    convert: "@N@::@extschema@.tgeompoint::@extschema@.tgeometry"
    doc:
      tempspatialrels: |-
        /**
         * @file
         * @brief Temporal spatial relationships for temporal poses
         */
    files: [compops, topops, posops, indexes, tempspatialrels]

  - temp:  trgeometry
    # The base-value comparison is against a `geometry` (the resolved geometry at an
    # instant); the C wrapper stem is `geo`, not `geometry`, so basesym overrides it.
    base:  geometry
    basesym: geo
    fam:   rgeo
    stem:  trgeo
    brief: "temporal rigid geometries"
    bin:   150
    category: tspatial
    # trgeometry is 3-D-capable, so its position operators include the front/back
    # (Z) direction on top of the shared set (same as tpose).
    front_back: true
    # rgeo is the fully box-extraction-split family: its topops file holds ONLY the
    # topological operators, while the stbox casts / stboxes / expandSpace preamble
    # lives in the separate 160_trgeo_boxops extraction file. Drop that preamble.
    box_extraction: false
    # rgeo delegates its temporal spatial relationships to tgeometry via the single
    # tgeometry(trgeometry) cast (2D-only, so no geography branch), and is not a cell
    # index, so it overrides the conversion expression and the file doc block. Only
    # the temporal (tXxx) relationships are generated: the ever/always ones are
    # native C wrappers (170_trgeo_spatialrels) that stay hand-written.
    convert: "@N@::@extschema@.tgeometry"
    doc:
      tempspatialrels: |-
        /**
         * @file
         * @brief Temporal spatial relationships for temporal rigid geometries
         */
    # rgeo follows the tgeo-aligned layout, where the position files sit at their
    # tgeo offsets (topops +11 -> 161, posops +12 -> 162, tempspatialrels +22 -> 172,
    # the combined index file at the gist offset +23 -> 173) rather than the tight
    # scheme's +8 / +9 / +16.
    positions:
      topops:          11
      posops:          12
      tempspatialrels: 22
      indexes:         23
    files: [compops, topops, posops, indexes, tempspatialrels]

# ---------------------------------------------------------------------------
# Box-type axis (C boxops generator). The bounding-box topological operator
# wrappers (overlaps/contains/contained/same/adjacent) are per BOX TYPE, not
# per family: one stbox implementation serves every tspatial family, one tbox
# serves the tnumbers, tstzspan the temporal-only types, tpcbox the pointcloud.
# The generator emits the region between the GENERATED-BOXOPS markers in `file`.
# `reference: true` = self-regen must reproduce the committed region byte-for-byte.
boxtypes:
  - box:       stbox
    tside:     tspatial
    boxc:      STBox
    getarg:    PG_GETARG_STBOX_P
    dispbox:   boxop_tspatial_stbox
    disptt:    boxop_tspatial_tspatial
    ingroup:   mobilitydb_geo_bbox_topo
    boxdesc:   spatiotemporal box
    boxdescpl: spatiotemporal boxes
    valdesc:   spatiotemporal value
    file:      mobilitydb/src/geo/tgeo_boxops.c
    reference: true

  - box:       tpcbox
    tside:     tpointcloud
    boxc:      TPCBox
    getarg:    PG_GETARG_TPCBOX_P
    dispbox:   boxop_tpointcloud_tpcbox
    disptt:    boxop_tpointcloud_tpointcloud
    ingroup:   mobilitydb_pointcloud_temp
    boxdesc:   tpcbox
    boxdescpl: tpcboxes
    valdesc:   temporal pointcloud value
    file:      mobilitydb/src/pointcloud/tpc_boxops.c
    reference: true

  # tstzspan: the box IS a span<timestamptz>, so the primitives are the generic
  # span operators (overlaps_span_span, ...) via prim: span. Serves every
  # temporal-only type (the time-span bounding box).
  - box:       tstzspan
    tside:     temporal
    prim:      span
    boxc:      Span
    getarg:    PG_GETARG_SPAN_P
    dispbox:   boxop_temporal_tstzspan
    disptt:    boxop_temporal_temporal
    ingroup:   mobilitydb_temporal_bbox_topo
    boxdesc:   timestamptz span
    boxdescpl: timestamptz spans
    valdesc:   temporal value
    file:      mobilitydb/src/temporal/temporal_boxops.c
    reference: true

  # tbox: a COMPOSITE box (value span × time). Its own directions dispatch on the
  # tbox primitives (overlaps_tbox_tbox, ...); the `valspan` sub-block adds the
  # value-dimension directions (numspan_tnumber, tnumber_numspan) which dispatch on
  # the generic span primitives (overlaps_span_span, ...) via prim: span — the
  # span<T> value dimension of the tnumber. Shares temporal_boxops.c with tstzspan.
  - box:       tbox
    tside:     tnumber
    prim:      tbox
    boxc:      TBox
    getarg:    PG_GETARG_TBOX_P
    dispbox:   boxop_tnumber_tbox
    disptt:    boxop_tnumber_tnumber
    ingroup:   mobilitydb_temporal_bbox_topo
    boxdesc:   temporal box
    boxdescpl: temporal boxes
    valdesc:   temporal number
    file:      mobilitydb/src/temporal/temporal_boxops.c
    reference: true
    valspan:
      box:       numspan
      prim:      span
      boxc:      Span
      getarg:    PG_GETARG_SPAN_P
      dispbox:   boxop_tnumber_numspan
      boxdesc:   number span
      boxdescpl: number spans

# ---------------------------------------------------------------------------
# Spatial-relationship axis (C spatialrels generator, PG side). The ever/always
# PG wrapper surface (E<Rel>/A<Rel>_<dir> + @sqlfn) is 100% mechanical from
# (predicate, quantifier, direction): each wrapper just dispatches to the MEOS
# ea_<rel>_<dir> kernel with EVER/ALWAYS. The generator emits the region between
# the GENERATED-SPATIALRELS markers in `file`, per predicate, leaving the
# hand-written native kernels (in meos/src) and the irregular tail (touches
# geo/tpoint directions, dwithin_tgeo_tgeo, the array *Pairs surface) untouched.
# `reference: true` = self-regen must reproduce the committed region byte-for-byte.
# Each predicate carries its section banner + the tokens used to derive the
# wrapper name (Rel), the SQL name (sqlfn base) and the @brief verb (verb3).
spatialrel_families:
  - family:    geo_ea_contains_covers
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Ever/always contains"
        briefs:
          geo_tgeo:  "a geometry {word} contains a temporal geometry"
          tgeo_geo:  "a temporal geometry {word} contains a geometry"
          tgeo_tgeo: "a temporal geometry {word} contains another one"
      - rel: covers
        Rel: Covers
        banner: "Ever covers"
        briefs:
          geo_tgeo:  "a geometry {word} covers a temporal geometry"
          tgeo_geo:  "a temporal geometry {word} covers a geometry"
          tgeo_tgeo: "a temporal geometry {word} covers another one"

  - family:    geo_ea_disjoint_intersects
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    predicates:
      - rel: disjoint
        Rel: Disjoint
        banner: "Ever disjoint (for both geometry and geography)"
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geometry are {word} disjoint"
          tgeo_geo:  "a temporal geometry and a geometry/geography are {word} disjoint"
          tgeo_tgeo: "two temporal geometries are {word} disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Ever intersects (for both geometry and geography)"
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geometry {word} intersect"
          tgeo_geo:  "a temporal geometry and a geometry/geography {word} intersect"
          tgeo_tgeo: "two temporal geometries {word} intersect"

  # dwithin's geo/tgeo core: only the two mixed directions are mechanical (the
  # tgeo_tgeo direction has a bespoke distance-carrying dispatcher + a different
  # @ingroup, so it stays hand-written). Both directions share the single MEOS
  # kernel ea_dwithin_tgeo_geo (the dispatcher fixes the argument order), and the
  # dispatcher is the distance-aware EA_dwithin_* rather than EA_spatialrel_*.
  - family:    geo_ea_dwithin
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    predicates:
      - rel: dwithin
        Rel: Dwithin
        banner: "Ever/always dwithin (for both geometry and geography)\n * The function only accepts points and not arbitrary geometries/geographies"
        directions: [geo_tgeo, tgeo_geo]
        meos_fixed: ea_dwithin_tgeo_geo
        disp:
          geo_tgeo: EA_dwithin_geo_tspatial
          tgeo_geo: EA_dwithin_tspatial_geo
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geometry are {word} within a distance"
          tgeo_geo:  "a temporal geometry and a geometry/geography are {word} within a distance"

  # tcbuffer carries the fuller 5-direction shape (it adds the base-value cbuffer
  # directions on top of geo/temporal), its own @ingroup, and its own dispatcher
  # map. The base-value briefs are corrected here: the hand-written wrappers reused
  # the "a geometry" wording for the (cbuffer, tcbuffer) / (tcbuffer, cbuffer)
  # directions — the argument is a circular buffer, not a geometry.
  - family:    cbuffer_ea_contains_covers
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    ingroup:   mobilitydb_cbuffer_rel_ever
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    disp:
      geo_tcbuffer:      EA_spatialrel_geo_tspatial
      tcbuffer_geo:      EA_spatialrel_tspatial_geo
      cbuffer_tcbuffer:  EA_spatialrel_cbuffer_tcbuffer
      tcbuffer_cbuffer:  EA_spatialrel_tcbuffer_cbuffer
      tcbuffer_tcbuffer: EA_spatialrel_tspatial_tspatial
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Ever/always contains"
        briefs:
          geo_tcbuffer:      "a geometry {word} contains a temporal circular buffer"
          tcbuffer_geo:      "a temporal circular buffer {word} contains a geometry"
          cbuffer_tcbuffer:  "a circular buffer {word} contains a temporal circular buffer"
          tcbuffer_cbuffer:  "a temporal circular buffer {word} contains a circular buffer"
          tcbuffer_tcbuffer: "a temporal circular buffer {word} contains another one"
      - rel: covers
        Rel: Covers
        banner: "Ever/always covers"
        briefs:
          geo_tcbuffer:      "a geometry {word} covers a temporal circular buffer"
          tcbuffer_geo:      "a temporal circular buffer {word} covers a geometry"
          cbuffer_tcbuffer:  "a circular buffer {word} covers a temporal circular buffer"
          tcbuffer_cbuffer:  "a temporal circular buffer {word} covers a circular buffer"
          tcbuffer_tcbuffer: "a temporal circular buffer {word} covers another one"

  - family:    cbuffer_ea_disjoint_intersects
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    ingroup:   mobilitydb_cbuffer_rel_ever
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    disp:
      geo_tcbuffer:      EA_spatialrel_geo_tspatial
      tcbuffer_geo:      EA_spatialrel_tspatial_geo
      cbuffer_tcbuffer:  EA_spatialrel_cbuffer_tcbuffer
      tcbuffer_cbuffer:  EA_spatialrel_tcbuffer_cbuffer
      tcbuffer_tcbuffer: EA_spatialrel_tspatial_tspatial
    predicates:
      - rel: disjoint
        Rel: Disjoint
        banner: "Ever/always disjoint"
        briefs:
          geo_tcbuffer:      "a geometry and a temporal circular buffer are {word} disjoint"
          tcbuffer_geo:      "a temporal circular buffer and a geometry are {word} disjoint"
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer are {word} disjoint"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer are {word} disjoint"
          tcbuffer_tcbuffer: "two temporal circular buffers are {word} disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Ever/always intersects"
        briefs:
          geo_tcbuffer:      "a geometry and a temporal circular buffer {word} intersect"
          tcbuffer_geo:      "a temporal circular buffer and a geometry {word} intersect"
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer {word} intersect"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer {word} intersect"
          tcbuffer_tcbuffer: "two temporal circular buffers {word} intersect"

  # dwithin uses a distinct shape (a per-direction static dispatcher that reads
  # the operands + the distance and calls the e/a kernel directly, with two thin
  # public wrappers), so `dwithin: true` selects render_dwithin. Each direction
  # lists its two arguments (declared/freed in position order), the MEOS kernel
  # suffix and the kernel call arguments (temporal operand first).
  - family:    cbuffer_ea_dwithin
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    dwithin:   true
    ingroup:   mobilitydb_cbuffer_rel_ever
    banner:    "Ever/always dwithin\n * The function only accepts points and not arbitrary geometries"
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    directions:
      geo_tcbuffer:
        noun:   "a geometry and a temporal circular buffer"
        kernel: tcbuffer_geo
        kargs:  "temp, gs, dist"
        args:
          - {type: "GSERIALIZED *", var: gs,   pos: 0}
          - {type: "Temporal *",    var: temp, pos: 1}
      tcbuffer_geo:
        noun:   "a temporal circular buffer and a geometry"
        kernel: tcbuffer_geo
        kargs:  "temp, gs, dist"
        args:
          - {type: "Temporal *",    var: temp, pos: 0}
          - {type: "GSERIALIZED *", var: gs,   pos: 1}
      cbuffer_tcbuffer:
        noun:   "a circular buffer and a temporal circular buffer"
        kernel: tcbuffer_cbuffer
        kargs:  "temp, cb, dist"
        args:
          - {type: "Cbuffer *",  var: cb,   pos: 0}
          - {type: "Temporal *", var: temp, pos: 1}
      tcbuffer_cbuffer:
        noun:   "a temporal circular buffer and a circular buffer"
        kernel: tcbuffer_cbuffer
        kargs:  "temp, cb, dist"
        args:
          - {type: "Temporal *", var: temp, pos: 0}
          - {type: "Cbuffer *",  var: cb,   pos: 1}
      tcbuffer_tcbuffer:
        noun:   "two temporal circular buffers"
        kernel: tcbuffer_tcbuffer
        kargs:  "temp1, temp2, dist"
        args:
          - {type: "Temporal *", var: temp1, pos: 0}
          - {type: "Temporal *", var: temp2, pos: 1}

  # rgeo (temporal rigid geometry) has the reduced three-direction shape (geo⊗T,
  # T⊗geo, T⊗T; no base-value directions) and abbreviates its kernel type token
  # trgeometry -> trgeo, so it uses kernel_dir. It shares the geo ever/always doc
  # group.
  - family:    rgeo_ea_contains_covers
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    ingroup:   mobilitydb_geo_rel_ever
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    disp:
      geo_trgeometry:        EA_spatialrel_geo_tspatial
      trgeometry_geo:        EA_spatialrel_tspatial_geo
      trgeometry_trgeometry: EA_spatialrel_tspatial_tspatial
    kernel_dir:
      geo_trgeometry:        geo_trgeo
      trgeometry_geo:        trgeo_geo
      trgeometry_trgeometry: trgeo_trgeo
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Ever/always contains"
        briefs:
          geo_trgeometry:        "a geometry {word} contains a temporal rigid geometry"
          trgeometry_geo:        "a temporal rigid geometry {word} contains a geometry"
          trgeometry_trgeometry: "a temporal rigid geometry {word} contains another one"
      - rel: covers
        Rel: Covers
        banner: "Ever/always covers"
        briefs:
          geo_trgeometry:        "a geometry {word} covers a temporal rigid geometry"
          trgeometry_geo:        "a temporal rigid geometry {word} covers a geometry"
          trgeometry_trgeometry: "a temporal rigid geometry {word} covers another one"

  - family:    rgeo_ea_disjoint_intersects
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    ingroup:   mobilitydb_geo_rel_ever
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    disp:
      geo_trgeometry:        EA_spatialrel_geo_tspatial
      trgeometry_geo:        EA_spatialrel_tspatial_geo
      trgeometry_trgeometry: EA_spatialrel_tspatial_tspatial
    kernel_dir:
      geo_trgeometry:        geo_trgeo
      trgeometry_geo:        trgeo_geo
      trgeometry_trgeometry: trgeo_trgeo
    predicates:
      - rel: disjoint
        Rel: Disjoint
        banner: "Ever disjoint (for both geometry and geography)"
        briefs:
          geo_trgeometry:        "a geometry and a temporal rigid geometry are {word} disjoint"
          trgeometry_geo:        "a temporal rigid geometry and a geometry are {word} disjoint"
          trgeometry_trgeometry: "two temporal rigid geometries are {word} disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Ever intersects (for both geometry and geography)"
        briefs:
          geo_trgeometry:        "a geometry and a temporal rigid geometry {word} intersect"
          trgeometry_geo:        "a temporal rigid geometry and a geometry {word} intersect"
          trgeometry_trgeometry: "two temporal rigid geometries {word} intersect"

  # rgeo dwithin is a HYBRID (dwithin: true selects render_dwithin): the two mixed
  # directions reuse the family-wide EA_dwithin_* dispatchers with the single fixed
  # kernel ea_dwithin_trgeo_geo (the dispatcher fixes the argument order), so they
  # are `shape: shared` and emit only the two wrappers; the T⊗T direction keeps a
  # local static dispatcher that calls ea_dwithin_trgeo_trgeo(temp1, temp2, dist,
  # ever) — a single kernel taking `ever` as its last argument (ever_arg: true).
  - family:    rgeo_ea_dwithin
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    dwithin:   true
    ingroup:   mobilitydb_geo_rel_ever
    banner:    "Ever/always dwithin (for both geometry and geography)\n * The function only accepts points and not arbitrary geometries/geographies"
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    directions:
      geo_trgeometry:
        shape:  shared
        noun:   "a geometry and a temporal rigid geometry"
        disp:   EA_dwithin_geo_tspatial
        kernel: ea_dwithin_trgeo_geo
      trgeometry_geo:
        shape:  shared
        noun:   "a temporal rigid geometry and a geometry"
        disp:   EA_dwithin_tspatial_geo
        kernel: ea_dwithin_trgeo_geo
      trgeometry_trgeometry:
        noun:     "two temporal rigid geometries"
        ever_arg: true
        kernel:   trgeo_trgeo
        kargs:    "temp1, temp2, dist, ever"
        args:
          - {type: "Temporal *", var: temp1, pos: 0}
          - {type: "Temporal *", var: temp2, pos: 1}

# ---------------------------------------------------------------------------
# Native temporal spatial relationships (SQL, whole-file). A native family
# implements the temporal relationships (tXxx -> tbool) as C functions declared
# with AS 'MODULE_PATHNAME','<Symbol>' rather than SQL cast-wrappers. Each family
# lists its ordered directions (left/right argument type; `geometry` tokenizes to
# `geo` in the C symbol T<rel>_<left>_<right>) and its predicate set; the whole
# file is generated from templates/tempspatialrels_native.sql.tmpl.
native_tempspatialrel_families:
  - family:  cbuffer
    file:    mobilitydb/sql/cbuffer/214_tcbuffer_tempspatialrels.in.sql
    brief:   "temporal circular buffers"
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: cbuffer,  r: tcbuffer}
      - {l: tcbuffer, r: cbuffer}
      - {l: geometry, r: tcbuffer}
      - {l: tcbuffer, r: geometry}
      - {l: tcbuffer, r: tcbuffer}

# ---------------------------------------------------------------------------
# Accessor axis (SQL, per-family, region-in-file). The whole Temporal<T> accessor
# surface (tempSubtype..segments) lives INLINE in each family's type file and
# follows ONE canonical order for every temporal type — the order of the
# "Accessors" <sect1> in doc/temporal_types_p1.xml. A single generic template
# (templates/accessors.sql.tmpl) emits the whole block; the only per-family
# variation is the tokens `temp` ({TEMP}), `base` ({BASE}) and `baseset`
# ({BASESET}). The generator emits the region between the GENERATED-ACCESSORS
# markers in `file`. `reference: true` = self-regen must reproduce the committed
# region byte-for-byte.
accessor_families:
  # The base Temporal<T> file declares the accessor surface for EVERY base type;
  # `types:` (per-base-type tokens) selects the multi-base-type renderer, which also
  # emits the TNumber/orderable-only accessors (valueSet/minValue/maxValue/avgValue/
  # minInstant/maxInstant) gated by the `numeric`/`orderable` flags. baseset = the
  # getValues return (a spanset for numbers), valueset = the discrete valueSet return.
  - family:    temporal
    file:      mobilitydb/sql/temporal/022_temporal.in.sql
    reference: true
    types:
      - {temp: tbool,   base: boolean, baseset: "boolean[]"}
      - {temp: tint,    base: integer, baseset: intspanset,    valueset: intset,    gvsym: Tnumber_valuespans, numeric: true, orderable: true}
      - {temp: tbigint, base: bigint,  baseset: bigintspanset, valueset: bigintset, gvsym: Tnumber_valuespans, numeric: true, orderable: true}
      - {temp: tfloat,  base: float,   baseset: floatspanset,  valueset: floatset,  gvsym: Tnumber_valuespans, numeric: true, orderable: true}
      - {temp: ttext,   base: text,    baseset: textset,       orderable: true}

  - family:    cbuffer
    file:      mobilitydb/sql/cbuffer/202_tcbuffer.in.sql
    reference: true
    types:
      - {temp: tcbuffer, base: cbuffer, baseset: cbufferset}

  - family:    npoint
    file:      mobilitydb/sql/npoint/302_tnpoint.in.sql
    reference: true
    types:
      - {temp: tnpoint, base: npoint, baseset: npointset}

  - family:    pose
    file:      mobilitydb/sql/pose/102_tpose.in.sql
    reference: true
    types:
      - {temp: tpose, base: pose, baseset: poseset}

  # trgeometry stores temporal poses with the reference geometry appended to the
  # bytestream; getValue/getValues expose the raw pose (base pose / poseset), while
  # startValue/endValue/valueN/valueAtTimestamp materialize the geometry (valret) by
  # re-applying the pose to that reference geometry via the Trgeometry_* symbols (valsym).
  - family:    rgeo
    file:      mobilitydb/sql/rgeo/150_trgeo.in.sql
    reference: true
    types:
      - {temp: trgeometry, base: pose, baseset: poseset, valret: geometry, valsym: Trgeometry}

  - family:    json
    file:      mobilitydb/sql/json/452_tjsonb.in.sql
    reference: true
    types:
      - {temp: tjsonb, base: jsonb, baseset: jsonbset}

  - family:    quadbin
    file:      mobilitydb/sql/quadbin/353_tquadbin.in.sql
    reference: true
    types:
      - {temp: tquadbin, base: quadbin, baseset: quadbinset}
  - family:    h3
    file:      mobilitydb/sql/h3/253_th3index.in.sql
    reference: true
    types:
      - {temp: th3index, base: h3index, baseset: h3indexset}
  - family:    pointcloud
    file:      mobilitydb/sql/pointcloud/420_tpcpoint.in.sql
    reference: true
    types:
      - {temp: tpcpoint, base: pcpoint, baseset: pcpointset}
  - family:    pointcloud_patch
    file:      mobilitydb/sql/pointcloud/430_tpcpatch.in.sql
    reference: true
    types:
      - {temp: tpcpatch, base: pcpatch, baseset: pcpatchset}

# Input/Output — type-I/O sub-family (in/out/recv/send + shared typmod/analyze +
# CREATE TYPE). Pure {TEMP}-token; per-type symbol/name overrides carry the family
# variation (in_sym/out_sym/recv_sym/send_sym + out_name/send_name). Base temporal
# uses the generic Temporal_* symbols throughout. See INHERITANCE_MAP.md §4e and
# the temporal-io-symbol-reuse-matrix memory.
io_families:
  - family:    temporal
    file:      mobilitydb/sql/temporal/022_temporal.in.sql
    reference: true
    types:
      - {temp: tbool}
      - {temp: tint}
      - {temp: tbigint}
      - {temp: tfloat}
      - {temp: ttext}

# ---------------------------------------------------------------------------
# Representations sub-family B (SQL, per-family region / dedicated *_inout file).
# as<Fmt> outputs + <temp>From<Fmt> constructors, all pure wiring to the generic
# Temporal_*/Tspatial_*/Trgeometry_* representation kernels. Built from ONE skeleton
# (templates/representations.sql.tmpl); the per-family op sequence, section-header
# literals and per-op/per-type symbol + maxdecimaldigits overrides are data here.
# `--validate` extracts the committed hand block by section-header anchors
# (begin/end) so the deployed .in.sql is untouched while the template is proven.
representation_families:
- family: temporal
  file: mobilitydb/sql/temporal/023_temporal_inout.in.sql
  reference: true
  whole_file: true
  begin: "\n * Input\n"
  mfjson_named: true
  temps:
  - temp: tbool
  - temp: tint
  - temp: tbigint
  - temp: tfloat
    maxdd: true
  - temp: ttext
  syms:
    asText: Temporal_as_text
  arrsyms:
    asText: Temporalarr_as_text
  blocks:
  - lit: "/*****************************************************************************\n * Input\n *****************************************************************************/"
  - ops:
    - FromMFJSON
  - lit: /*****************************************************************************/
  - ops:
    - FromBinary
    - FromHexWKB
  - lit: "/*****************************************************************************\n * Output\n *****************************************************************************/"
  - ops:
    - asText
    - asMFJSON
  - lit: /*****************************************************************************/
  - ops:
    - asBinary
    - asHexWKB
  - lit: /*****************************************************************************/
- family: geo
  file: mobilitydb/sql/geo/053_tgeo_inout.in.sql
  reference: true
  whole_file: true
  begin: "\n * Input\n"
  temps:
  - temp: tgeometry
    maxdd: true
  - temp: tgeography
    maxdd: true
  syms:
    FromText: Tspatial_from_ewkt
    FromEWKT: Tspatial_from_ewkt
    asText: Tspatial_as_text
    asEWKT: Tspatial_as_ewkt
    asEWKB: Tspatial_as_ewkb
    asHexEWKB: Tspatial_as_hexewkb
  arrsyms:
    asText: Spatialarr_as_text
    asEWKT: Spatialarr_as_ewkt
  blocks:
  - lit: "/*****************************************************************************\n * Input\n *****************************************************************************/"
  - ops:
    - FromText
    - FromEWKT
    - FromMFJSON
    - FromBinary
    - FromEWKB
    - FromHexEWKB
  - lit: "/*****************************************************************************\n * Output\n *****************************************************************************/"
  - ops:
    - asText
    - asEWKT
    - asMFJSON
    - asBinary
    - asEWKB
    - asHexWKB
    - asHexEWKB
  - lit: /*****************************************************************************/
- family: cbuffer
  file: mobilitydb/sql/cbuffer/202_tcbuffer.in.sql
  reference: true
  begin: "\n * Input/output from (E)WKT, (E)WKB, and HexEWKB representation\n"
  end: "\n * Constructors\n"
  temps:
  - temp: tcbuffer
    maxdd: true
  syms:
    FromText: Tspatial_from_ewkt
    FromEWKT: Tspatial_from_ewkt
    asText: Tspatial_as_text
    asEWKT: Tspatial_as_ewkt
    asEWKB: Tspatial_as_ewkb
  arrsyms:
    asText: Spatialarr_as_text
    asEWKT: Spatialarr_as_ewkt
  blocks:
  - lit: "/*****************************************************************************\n * Input/output from (E)WKT, (E)WKB, and HexEWKB representation\n *****************************************************************************/"
  - ops:
    - FromText
    - FromEWKT
    - FromBinary
    - FromEWKB
    - FromHexEWKB
    - FromMFJSON
  - lit: /*****************************************************************************/
  - ops:
    - asText
    - asEWKT
    - asMFJSON
    - asBinary
    - asEWKB
    - asHexEWKB
- family: npoint
  file: mobilitydb/sql/npoint/302_tnpoint.in.sql
  reference: true
  begin: "\n * Input/output from (E)WKT, (E)WKB, and HexEWKB\n"
  end: "\n * Constructors\n"
  temps:
  - temp: tnpoint
    maxdd: true
  syms:
    asText: Tspatial_as_text
  arrsyms:
    asText: Spatialarr_as_text
  blocks:
  - lit: "/*****************************************************************************\n * Input/output from (E)WKT, (E)WKB, and HexEWKB\n *****************************************************************************/"
  - ops:
    - - FromBinary
      - FromHexWKB
    - FromMFJSON
  - lit: /*****************************************************************************/
  - ops:
    - asText
    - asBinary
    - asHexWKB
    - asMFJSON
- family: rgeo
  file: mobilitydb/sql/rgeo/150_trgeo.in.sql
  reference: true
  begin: "\n * Input/output from (E)WKT, (E)WKB, HexEWKB, and MFJSON representation\n"
  end: "\n * Constructors\n"
  temps:
  - temp: trgeometry
    maxdd: true
  syms:
    FromText: Trgeometry_from_ewkt
    FromEWKT: Trgeometry_from_ewkt
    asText: Trgeometry_as_text
    asEWKT: Trgeometry_as_ewkt
    asEWKB: Tspatial_as_ewkb
  arrsyms:
    asText: Spatialarr_as_text
    asEWKT: Spatialarr_as_ewkt
  blocks:
  - lit: "/*****************************************************************************\n * Input/output from (E)WKT, (E)WKB, HexEWKB, and MFJSON representation\n *****************************************************************************/"
  - ops:
    - FromText
    - FromEWKT
    - FromMFJSON
    - FromBinary
    - FromEWKB
    - FromHexEWKB
  - lit: /******************************************************************************/
  - ops:
    - asText
    - asEWKT
    - asMFJSON
    - asBinary
    - asEWKB
    - asHexEWKB
- family: h3
  file: mobilitydb/sql/h3/253_th3index.in.sql
  reference: true
  mfjson_named: true
  begin: "\n * Text and (Hex)WKB I/O (mirrors the tcbuffer / tnpoint / tpose plug-in types)\n"
  end: "\n * Typmod enforcer + self-cast (mirrors tbigint / tint / tfloat / ttext)\n"
  temps:
  - temp: th3index
    mfjson_maxdd: true
  syms:
    asText: Temporal_as_text
  blocks:
  - lit: "/******************************************************************************\n * Text and (Hex)WKB I/O (mirrors the tcbuffer / tnpoint / tpose plug-in types)\n ******************************************************************************/"
  - ops:
    - asText
    - asBinary
    - asHexWKB
    - asMFJSON
    - FromBinary
    - FromHexWKB
    - FromMFJSON
- family: quadbin
  file: mobilitydb/sql/quadbin/353_tquadbin.in.sql
  reference: true
  mfjson_named: true
  begin: "\n * Text and (Hex)WKB I/O (mirrors the tcbuffer / tnpoint / tpose plug-in types)\n"
  end: "\n * Typmod enforcer + self-cast (mirrors tbigint / tint / tfloat / ttext)\n"
  temps:
  - temp: tquadbin
    mfjson_maxdd: true
  syms:
    asText: Temporal_as_text
  blocks:
  - lit: "/******************************************************************************\n * Text and (Hex)WKB I/O (mirrors the tcbuffer / tnpoint / tpose plug-in types)\n ******************************************************************************/"
  - ops:
    - asText
    - asBinary
    - asHexWKB
    - asMFJSON
    - FromBinary
    - FromHexWKB
    - FromMFJSON

# ---------------------------------------------------------------------------
# Constructors sub-family (SQL, per-family region-in-file).
# <temp>(<base>, timestamptz|tstzset|tstzspan|tstzspanset) + the array constructors
# <temp>Seq/<temp>SeqSet/<temp>SeqSetGaps, all pure wiring to the generic
# Tinstant_constructor / Tsequence_from_base_* / Tsequenceset_from_base_* /
# Tsequence_constructor / Tsequenceset_constructor / Tsequenceset_constructor_gaps
# kernels. Built from ONE skeleton (templates/constructors.sql.tmpl); the per-family
# op sequence, interpolation default, base-span interp arg, SeqSetGaps arg list +
# strictness, section-header literals and per-op/per-type symbol + return overrides
# are data here. `--validate` extracts the committed hand block by section-header
# anchors (begin/end) so the deployed .in.sql is untouched while the template is
# proven.
constructor_families:
- family: geo
  file: mobilitydb/sql/geo/052_tgeo.in.sql
  reference: true
  begin: "\n * Constructors\n"
  end: "\n * Conversions\n"
  interp: step
  span_interp: true
  gaps_maxdist: true
  syms:
    instant: Tgeoinst_constructor
  pairs:
  - base: geometry
    temp: tgeometry
  - base: geography
    temp: tgeography
  blocks:
  - lit: "/******************************************************************************\n * Constructors\n ******************************************************************************/"
  - ops:
    - instant
  - ops:
    - from_tstzset
  - ops:
    - from_tstzspan
  - ops:
    - from_tstzspanset
  - lit: /******************************************************************************/
  - ops:
    - seq
  - ops:
    - seqset
  - ops:
    - seqsetgaps
- family: tpoint
  file: mobilitydb/sql/geo/052_tpoint.in.sql
  reference: true
  begin: "\n * Constructors\n"
  end: "\n * Conversions\n"
  interp: linear
  span_interp: true
  gaps_maxdist: true
  syms:
    instant: Tpointinst_constructor
  pairs:
  - base: geometry
    temp: tgeompoint
    ibase: geometry(Point)
  - base: geography
    temp: tgeogpoint
    ibase: geography(Point)
  blocks:
  - lit: "/******************************************************************************\n * Constructors\n ******************************************************************************/"
  - ops:
    - instant
  - ops:
    - from_tstzset
  - ops:
    - from_tstzspan
  - ops:
    - from_tstzspanset
  - lit: /******************************************************************************/
  - ops:
    - seq
  - ops:
    - seqset
  - ops:
    - seqsetgaps
- family: cbuffer
  file: mobilitydb/sql/cbuffer/202_tcbuffer.in.sql
  reference: true
  begin: "\n * Constructors\n"
  end: "\n * Conversions\n"
  interp: linear
  span_interp: true
  gaps_maxdist: true
  pairs:
  - base: cbuffer
    temp: tcbuffer
  blocks:
  - lit: "/*****************************************************************************\n * Constructors\n *****************************************************************************/"
  - ops:
    - instant
  - ops:
    - from_tstzset
  - ops:
    - from_tstzspan
  - ops:
    - from_tstzspanset
  - lit: /*****************************************************************************/
  - ops:
    - seq
  - ops:
    - seqset
  - ops:
    - seqsetgaps
  - lit: /*****************************************************************************/
  - fns:
    - sig: tcbuffer(tgeompoint, tfloat)
      ret: tcbuffer
      sym: Tcbuffer_constructor
- family: h3
  file: mobilitydb/sql/h3/253_th3index.in.sql
  reference: true
  begin: "\n * Constructors\n"
  end: "\n * Transformations\n"
  interp: step
  span_interp: false
  gaps_maxdist: false
  inc: camel
  pairs:
  - base: h3index
    temp: th3index
  blocks:
  - lit: "/******************************************************************************\n * Constructors\n *\n * Inherited Temporal<T> surface wired to the generic constructor symbols\n * (the value Datum carries the h3 cell, dispatch is on the base oid).\n * `th3index` has step interpolation only, so the from-span and array\n * constructors take no interpolation argument / default to `'step'`, and a\n * cell has no scalar-distance metric so `th3indexSeqSetGaps` exposes only the\n * time gap (the `tbigint` / `ttext` form, not the continuous `tcbuffer` one).\n ******************************************************************************/"
  - ops:
    - instant
    - from_tstzset
    - from_tstzspan
    - from_tstzspanset
  - ops:
    - seq
    - seqset
    - seqsetgaps
- family: json
  file: mobilitydb/sql/json/452_tjsonb.in.sql
  reference: true
  begin: "\n * Constructors\n"
  end: "\n * Conversions\n"
  interp: step
  span_interp: false
  gaps_maxdist: false
  inc: camel
  pairs:
  - base: jsonb
    temp: tjsonb
  blocks:
  - lit: "/*****************************************************************************\n * Constructors\n *****************************************************************************/"
  - ops:
    - instant
  - ops:
    - from_tstzset
  - ops:
    - from_tstzspan
  - ops:
    - from_tstzspanset
  - lit: "  \n/*****************************************************************************/"
    glue: true
