- family: tpcpatch
  file: mobilitydb/sql/pointcloud/430_tpcpatch.in.sql
  reference: true
  begin: "\n * Restrictions\n"
  end: "\n * Per-point access (SRF)"
  blocks:
  - lit: "/******************************************************************************\n * Restrictions\n ******************************************************************************/\n\n"
  - fns:
    - {sig: "atValue(tpcpatch, pcpatch)", ret: tpcpatch, sym: Temporal_at_value}
