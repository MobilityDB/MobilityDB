# The base Temporal<T> aggregate file transcribes its extent/tCount/tAnd/tOr/
# tMin/tMax/tSum/tAvg/merge/appendInstant/appendSequence surface for the alpha
# base-type quintet (tbool/tint/tbigint/tfloat/ttext) the same way every sibling
# family below already does: `fns` blocks for the skeleton-shaped transfn/
# combinefn/finalfn CREATE FUNCTIONs, `lit` blocks (byte-exact) for the CREATE
# AGGREGATE statements, banners and separators. No new `gen`/`types:` machinery:
# unlike the restriction/modification/transformation/tiling sections of
# 022_temporal.in.sql, this file's per-type groupings are irregular (extent's
# tstzspan-vs-tbox STYPE split, tAnd/tOr's tbool-only scope, tMin/tMax/tSum/tAvg's
# per-type kernel symbols), so literal transcription is the faithful mirror.
