  whole_file: true
  blocks:
  - lit: "/**\n * @file\n * @brief Aggregate functions for the pgPointCloud temporal types\n */\n\n"
  - fns:
    - {sig: "extentTransition(tpcbox, tpcbox)", ret: "tpcbox", sym: "Tpcbox_extent_transfn", strict: false}
    - {sig: "tpcbox_extent_combinefn(tpcbox, tpcbox)", ret: "tpcbox", sym: "Tpcbox_extent_combinefn", strict: false}
  - lit: "\n"
  - fns:
    - {sig: "extentTransition(tpcbox, tpcpoint)", ret: "tpcbox", sym: "Tpc_extent_transfn", strict: false}
  - lit: "\n"
  - fns:
    - {sig: "extentTransition(tpcbox, tpcpatch)", ret: "tpcbox", sym: "Tpc_extent_transfn", strict: false}
  - lit: "\nCREATE AGGREGATE extent(tpcbox) (\n  SFUNC = extentTransition,\n  STYPE = tpcbox,\n  COMBINEFUNC = tpcbox_extent_combinefn,\n  PARALLEL = safe\n);\n\nCREATE AGGREGATE extent(tpcpoint) (\n  SFUNC = extentTransition,\n  STYPE = tpcbox,\n  COMBINEFUNC = tpcbox_extent_combinefn,\n  PARALLEL = safe\n);\n\nCREATE AGGREGATE extent(tpcpatch) (\n  SFUNC = extentTransition,\n  STYPE = tpcbox,\n  COMBINEFUNC = tpcbox_extent_combinefn,\n  PARALLEL = safe\n);\n\n/*****************************************************************************\n * Temporal count and window count\n *****************************************************************************/\n\n"
  - fns:
    - {sig: "tCountTransition(internal, tpcpoint)", ret: "internal", sym: "Temporal_tcount_transfn", strict: false}
    - {sig: "tCountTransition(internal, tpcpatch)", ret: "internal", sym: "Temporal_tcount_transfn", strict: false}
  - lit: "\n"
  - fns:
    - {sig: "tCountFinal(internal, tpcpoint)", ret: "tint", sym: "Temporal_tagg_finalfn", strict: false}
  - lit: "CREATE AGGREGATE tCount(tpcpoint) (\n  SFUNC = tCountTransition,\n  STYPE = internal,\n  COMBINEFUNC = tcount_combinefn,\n  FINALFUNC = tCountFinal,\n  FINALFUNC_EXTRA,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = SAFE\n);"
  - lit: "\n\n"
  - fns:
    - {sig: "tCountFinal(internal, tpcpatch)", ret: "tint", sym: "Temporal_tagg_finalfn", strict: false}
  - lit: "CREATE AGGREGATE tCount(tpcpatch) (\n  SFUNC = tCountTransition,\n  STYPE = internal,\n  COMBINEFUNC = tcount_combinefn,\n  FINALFUNC = tCountFinal,\n  FINALFUNC_EXTRA,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = SAFE\n);"
  - lit: "\n\n"
  - fns:
    - {sig: "tnpointsTransition(internal, tpcpatch)", ret: "internal", sym: "Tpcpatch_tnpoints_transfn", strict: false, pre: "-- tnpoints(tpcpatch) — running temporal sum of per-instant pcpatch\n-- npoints. Distinct from tcount(tpcpatch), which counts the number\n-- of patches (always 1 per instant). For drone LiDAR this is \"how\n-- many points were in the cloud at time t\".\n"}
  - lit: "\n"
  - fns:
    - {sig: "tnpointsFinal(internal, tpcpatch)", ret: "tint", sym: "Temporal_tagg_finalfn", strict: false}
  - lit: "CREATE AGGREGATE tnpoints(tpcpatch) (\n  SFUNC = tnpointsTransition,\n  STYPE = internal,\n  COMBINEFUNC = tcount_combinefn,\n  FINALFUNC = tnpointsFinal,\n  FINALFUNC_EXTRA,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = SAFE\n);"
  - lit: "\n\n"
  - fns:
    - {sig: "tdensityTransition(internal, tpcpatch)", ret: "internal", sym: "Tpcpatch_tdensity_transfn", strict: false, pre: "-- tdensity(tpcpatch) — running temporal sum of per-instant density\n-- (npoints / xy-bbox-area). 1-point or co-linear patches yield\n-- +Infinity for that instant; filter with isfinite() if needed.\n"}
  - lit: "\n"
  - fns:
    - {sig: "tdensityFinal(internal, tpcpatch)", ret: "tfloat", sym: "Temporal_tagg_finalfn", strict: false}
  - lit: "CREATE AGGREGATE tdensity(tpcpatch) (\n  SFUNC = tdensityTransition,\n  STYPE = internal,\n  COMBINEFUNC = tcount_combinefn,\n  FINALFUNC = tdensityFinal,\n  FINALFUNC_EXTRA,\n  SERIALFUNC = taggstate_serialize,\n  DESERIALFUNC = taggstate_deserialize,\n  PARALLEL = SAFE\n);"
  - lit: "\n\n"
