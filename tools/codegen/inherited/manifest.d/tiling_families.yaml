    - {sig: "spaceBoxes(tpose, xsize float, ysize float,\n    sorigin geometry DEFAULT 'Point(0 0 0)', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "stbox[]", body: "    SELECT @extschema@.spaceBoxes($1, $2, $3, $2, $4, $5, $6)"}
  - lit: "\n"
  - fns:
    - {sig: "timeBoxes(tpose, interval,\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "stbox[]", body: "    SELECT @extschema@.timeBoxes(\n      $1::@extschema@.tgeompoint, $2, $3, $4, $5)"}
  - lit: "\n"
  - fns:
    - {sig: "spaceTimeBoxes(tpose, xsize float, ysize float,\n    zsize float, interval, sorigin geometry DEFAULT 'Point(0 0 0)',\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "stbox[]", body: "    SELECT @extschema@.spaceTimeBoxes(\n      $1::@extschema@.tgeompoint, $2, $3, $4, $5, $6, $7, $8, $9)"}
    - {sig: "spaceTimeBoxes(tpose, xsize float, interval,\n    sorigin geometry DEFAULT 'Point(0 0 0)',\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "stbox[]", body: "    SELECT @extschema@.spaceTimeBoxes($1, $2, $2, $2, $3, $4, $5, $6, $7)"}
    - {sig: "spaceTimeBoxes(tpose, xsize float, ysize float, interval,\n    sorigin geometry DEFAULT 'Point(0 0 0)',\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "stbox[]", body: "    SELECT @extschema@.spaceTimeBoxes($1, $2, $3, $2, $4, $5, $6, $7, $8)"}
  - lit: "\n/******************************************************************************\n * Split functions\n ******************************************************************************/\n\nCREATE TYPE point_tpose AS (\n  point geometry,\n  tpose tpose\n);\n\n"
  - fns:
    - {sig: "spaceSplit(tpose, xsize float, ysize float, zsize float,\n    sorigin geometry DEFAULT 'Point(0 0 0)', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "SETOF point_tpose", body: "    SELECT r.point, @extschema@.atTime($1, @extschema@.getTime(r.tpoint))\n    FROM @extschema@.spaceSplit(\n      $1::@extschema@.tgeompoint, $2, $3, $4, $5, $6, $7) AS r"}
    - {sig: "spaceSplit(tpose, size float,\n    sorigin geometry DEFAULT 'Point(0 0 0)', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "SETOF point_tpose", body: "    SELECT @extschema@.spaceSplit($1, $2, $2, $2, $3, $4, $5)"}
