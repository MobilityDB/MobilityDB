  - lit: "\nCREATE TYPE point_time_tpose AS (\n  point geometry,\n  time timestamptz,\n  tpose tpose\n);\n\n"
  - fns:
    - {sig: "spaceTimeSplit(tpose, xsize float, ysize float,\n    zsize float, interval, sorigin geometry DEFAULT 'Point(0 0 0)',\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "SETOF point_time_tpose", body: "    SELECT r.point, r.time, @extschema@.atTime($1, @extschema@.getTime(r.tpoint))\n    FROM @extschema@.spaceTimeSplit(\n      $1::@extschema@.tgeompoint, $2, $3, $4, $5, $6, $7, $8, $9) AS r"}
    - {sig: "spaceTimeSplit(tpose, size float, interval,\n    sorigin geometry DEFAULT 'Point(0 0 0)',\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "SETOF point_time_tpose", body: "    SELECT @extschema@.spaceTimeSplit($1, $2, $2, $2, $3, $4, $5, $6, $7)"}
    - {sig: "spaceTimeSplit(tpose, xsize float, ysize float, interval,\n    sorigin geometry DEFAULT 'Point(0 0 0)',\n    torigin timestamptz DEFAULT '2000-01-03', bitmatrix boolean DEFAULT TRUE,\n    borderInc boolean DEFAULT TRUE)", ret: "SETOF point_time_tpose", body: "    SELECT @extschema@.spaceTimeSplit($1, $2, $3, $2, $4, $5, $6, $7, $8)"}
  - lit: "\n/*****************************************************************************/"
