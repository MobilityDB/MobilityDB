
# B-tree comparison sub-family (SQL, per-family region-in-file). The six comparison
# functions lt/le/eq/ne/ge/gt + cmp (backing Temporal_lt/.../_cmp), the six B-tree
# operators `< <= = <> >= >` and the `<temp>_btree_ops` USING btree opclass. Built
# from ONE skeleton (templates/comparisons.sql.tmpl) for the uniform CREATE FUNCTION
# set; the operators/opclass/banner/dividers carry per-family whitespace + per-op
# selectivity drift so they are reproduced BYTE-EXACT as `lit` blocks (as the
# constructor surface does for its headers + family-extras). `--validate` extracts
# the committed hand block by banner header (begin) + B-tree/hash-tail divider (end)
# anchors so the deployed .in.sql is untouched while the template is proven. The
# tpcpoint/tpcpatch families (B-tree interleaved with hash, no divider, reordered
# functions) and the base set/span/spanset/tbox/temporal families (grouped multi-
# basetype functions, Span_*/Tbox_* symbols) do not token-swap the shared skeleton
# and are classified out by omission from the data below, never by a code skip.
comparison_families:
# The base temporal file spells the comparison RETURNS boolean and cmp integer
# (the derived families spell boolean/integer), selected by `ops: base`; its five base
# types cluster type-major with per-type operator/opclass lits whose RESTRICT
# selectivity varies (temporal_sel for tbool/ttext, tnumber_sel for the numbers).
- family: temporal
  file: mobilitydb/sql/temporal/022_temporal.in.sql
  reference: true
  ops: base
  begin: "\n * Comparison functions and B-tree indexing\n"
  end: CREATE FUNCTION hash(
  blocks:
  - lit: "/******************************************************************************\n * Comparison functions and B-tree indexing\n ******************************************************************************/\n\n"
  - funcs: tbool
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = tbool, RIGHTARG = tbool,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tbool, RIGHTARG = tbool,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = tbool, RIGHTARG = tbool,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = eqsel, JOIN = eqjoinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = tbool, RIGHTARG = tbool,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = neqsel, JOIN = neqjoinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tbool, RIGHTARG = tbool,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tbool, RIGHTARG = tbool,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\n\nCREATE OPERATOR CLASS tbool_btree_ops\n  DEFAULT FOR TYPE tbool USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tbool, tbool);\n\n/*****************************************************************************/\n\n"
  - funcs: tint
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = tint, RIGHTARG = tint,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tint, RIGHTARG = tint,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = tint, RIGHTARG = tint,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = eqsel, JOIN = eqjoinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = tint, RIGHTARG = tint,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = neqsel, JOIN = neqjoinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tint, RIGHTARG = tint,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tint, RIGHTARG = tint,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\n\nCREATE OPERATOR CLASS tint_btree_ops\n  DEFAULT FOR TYPE tint USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tint, tint);\n\n/*****************************************************************************/\n\n"
  - funcs: tbigint
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = eqsel, JOIN = eqjoinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = neqsel, JOIN = neqjoinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tbigint, RIGHTARG = tbigint,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\n\nCREATE OPERATOR CLASS tbigint_btree_ops\n  DEFAULT FOR TYPE tbigint USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tbigint, tbigint);\n\n/*****************************************************************************/\n\n"
  - funcs: tfloat
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = eqsel, JOIN = eqjoinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = neqsel, JOIN = neqjoinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = tfloat, RIGHTARG = tfloat,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = tnumber_sel, JOIN = tnumber_joinsel\n);\n\nCREATE OPERATOR CLASS tfloat_btree_ops\n  DEFAULT FOR TYPE tfloat USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(tfloat, tfloat);\n\n/******************************************************************************/\n\n"
  - funcs: ttext
  - lit: "\nCREATE OPERATOR < (\n  LEFTARG = ttext, RIGHTARG = ttext,\n  PROCEDURE = lt,\n  COMMUTATOR = >, NEGATOR = >=,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\nCREATE OPERATOR <= (\n  LEFTARG = ttext, RIGHTARG = ttext,\n  PROCEDURE = le,\n  COMMUTATOR = >=, NEGATOR = >,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\nCREATE OPERATOR = (\n  LEFTARG = ttext, RIGHTARG = ttext,\n  PROCEDURE = eq,\n  COMMUTATOR = =, NEGATOR = <>,\n  RESTRICT = eqsel, JOIN = eqjoinsel\n);\nCREATE OPERATOR <> (\n  LEFTARG = ttext, RIGHTARG = ttext,\n  PROCEDURE = ne,\n  COMMUTATOR = <>, NEGATOR = =,\n  RESTRICT = neqsel, JOIN = neqjoinsel\n);\nCREATE OPERATOR >= (\n  LEFTARG = ttext, RIGHTARG = ttext,\n  PROCEDURE = ge,\n  COMMUTATOR = <=, NEGATOR = <,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\nCREATE OPERATOR > (\n  LEFTARG = ttext, RIGHTARG = ttext,\n  PROCEDURE = gt,\n  COMMUTATOR = <, NEGATOR = <=,\n  RESTRICT = temporal_sel, JOIN = temporal_joinsel\n);\n\nCREATE OPERATOR CLASS ttext_btree_ops\n  DEFAULT FOR TYPE ttext USING btree AS\n    OPERATOR  1  <,\n    OPERATOR  2  <=,\n    OPERATOR  3  =,\n    OPERATOR  4  >=,\n    OPERATOR  5  >,\n    FUNCTION  1  cmp(ttext, ttext);\n\n"
