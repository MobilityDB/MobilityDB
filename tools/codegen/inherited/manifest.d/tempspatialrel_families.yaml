
# ---------------------------------------------------------------------------
# Temporal spatial relationships (SQL, whole-file). Every Temporal<T>'s
# tXxx(base?, base?) -> tbool surface is generated here from one (predicate x
# direction) matrix per family; `impl` (default `native`) picks how:
#  - native (cbuffer, tgeo, tpoint) - the family implements the relationship
#    as its own C kernel per (predicate, direction), declared with
#    AS 'MODULE_PATHNAME','<Symbol>'. Each family lists its ordered directions
#    (left/right argument type; `geometry`/`geography` tokenize to `geo`, every
#    temporal geo/point flavour to `tgeo`, in the C symbol
#    T<rel>_<left>_<right>) and its predicate set.
#  - cast (the cell indexes, pose, rgeo) - the family has no relationship
#    kernel of its own; per the cast-only spatial-uniformization rule (geo is
#    the one place the relationship logic lives — memory
#    north-star-spatial-cast-only-no-duplication), it converts each of its own
#    operands via `convert` and re-delegates to the target's tContains..tDwithin.
#    See generate.py's render_tempspatialrels for the full mechanism (both impls
#    share the predicate/direction matrix; only the per-cell CREATE FUNCTION
#    body differs).
#    ⭐ The cast target follows the value's geometry: a family whose values are
#    AREAS reaches tgeometry, a family whose values are POINTS reaches
#    tgeompoint. The distinction is load-bearing rather than cosmetic — a
#    tgeompoint carries linear interpolation and a tgeometry cannot, since two
#    consecutive geometries need not even share a type, so reaching past a
#    point's own target would refuse every linear value of the family.
#    ⭐ A family also declares the matrix of ITS target, not a fixed six by
#    three: a moving point neither contains nor covers a geometry, and two
#    moving points do not touch, so the point-like families below declare the
#    same cells the tpoint entry declares.
tempspatialrel_families:
  - family:  cbuffer
    impl:    native
    file:    mobilitydb/sql/cbuffer/214_tcbuffer_tempspatialrels.in.sql
    brief:   "temporal circular buffers"
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: cbuffer,  r: tcbuffer}
      - {l: tcbuffer, r: cbuffer}
      - {l: geometry, r: tcbuffer}
      - {l: tcbuffer, r: geometry}
      - {l: tcbuffer, r: tcbuffer}

  # tgeo is the base of the delegation chain: h3/quadbin/pose/rgeo's SQL
  # cast-wrappers (templates/tempspatialrels.sql.tmpl) all convert their operand
  # to tgeometry and call these same tContains..tDwithin functions. Its predicate
  # matrix is not uniform across directions (tContains/tCovers have no geodetic
  # direction; tDisjoint/tIntersects add a tgeography/tgeography direction that
  # aliases the temporal (in)equality operators; tDwithin's t-vs-geo direction is
  # not strict), so each of those three predicates overrides the family-wide
  # `directions` default that tCovers/tContains/tTouches reuse unchanged.
  - family:  tgeo
    impl:    native
    file:    mobilitydb/sql/geo/072_tgeo_tempspatialrels.in.sql
    brief:   "temporal geometries/geographies"
    directions:
      - {l: geometry,  r: tgeometry}
      - {l: tgeometry, r: geometry}
      - {l: tgeometry, r: tgeometry}
    predicates:
      - tContains
      - tCovers
      - name: tDisjoint
        directions:
          - {l: geometry,  r: tgeometry}
          - {l: tgeometry, r: geometry}
          - {l: tgeometry, r: tgeometry,
             comment: "Alias for temporal not equals, that is, geo_tne or #<>"}
          - {l: tgeography, r: tgeography}
      - name: tIntersects
        directions:
          - {l: geometry,  r: tgeometry}
          - {l: tgeometry, r: geometry}
          - {l: tgeometry, r: tgeometry,
             comment: "Alias for temporal equals, that is, tgeo_teq or #="}
          - {l: tgeography, r: tgeography}
      - tTouches
      - name: tDwithin
        directions:
          - {l: geometry,  r: tgeometry}
          - {l: tgeometry, r: geometry, strict: false,
             comment: "The function is not strict"}
          - {l: tgeometry, r: tgeometry}

  # tpoint (tgeompoint/tgeogpoint) shares the tgeo native C symbols (a point
  # temporalizes the same tgeo_* kernel — see _NATIVE_TSR_SUPERCLASS), but its
  # predicate matrix is narrower than tgeo's: tContains/tCovers expose only the
  # geo-vs-t direction (a point containing/covering is degenerate the other way),
  # tTouches has no t-vs-t or geodetic direction, and tDwithin's t-vs-geo
  # direction is strict here (unlike tgeo's). Every predicate overrides the
  # (absent) family default explicitly.
  - family:  tpoint
    impl:    native
    file:    mobilitydb/sql/geo/072_tpoint_tempspatialrels.in.sql
    brief:   "temporal geometries/geographies"
    predicates:
      - name: tContains
        directions:
          - {l: geometry, r: tgeompoint}
      - name: tCovers
        directions:
          - {l: geometry, r: tgeompoint}
      - name: tDisjoint
        directions:
          - {l: geometry,   r: tgeompoint}
          - {l: tgeompoint, r: geometry}
          - {l: tgeompoint, r: tgeompoint,
             comment: "Alias for temporal not equals, that is, tgeo_tne or #<>"}
          - {l: tgeogpoint, r: tgeogpoint}
      - name: tIntersects
        directions:
          - {l: geometry,   r: tgeompoint}
          - {l: tgeompoint, r: geometry}
          - {l: tgeompoint, r: tgeompoint,
             comment: "Alias for temporal equals, that is, tgeo_teq or #="}
          - {l: tgeogpoint, r: tgeogpoint}
      - name: tTouches
        directions:
          - {l: geometry,   r: tgeompoint}
          - {l: tgeompoint, r: geometry}
      - name: tDwithin
        directions:
          - {l: geometry,   r: tgeompoint}
          - {l: tgeompoint, r: geometry}
          - {l: tgeompoint, r: tgeompoint}

  # ---- cast: delegate to tgeo's tContains..tDwithin above via a cast
  # expression (cast-only spatial uniformization; no family below has
  # spatial-relationship logic of its own). Every direction is `geometry`
  # (raw, the delegation target) x the family's own type (converted, both
  # ways) plus the own-type x own-type direction. `doc` omitted falls back to
  # the shared cell-index prose (tempspatialrels.doc.tmpl) below. ----
  - family:  tquadbin
    impl:    cast
    file:    mobilitydb/sql/quadbin/364_tquadbin_tempspatialrels.in.sql
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: geometry, r: tquadbin}
      - {l: tquadbin, r: geometry}
      - {l: tquadbin, r: tquadbin}
    convert: "@extschema@.cellToBoundary(@N@)::@extschema@.tgeometry"

  - family:  th3index
    impl:    cast
    file:    mobilitydb/sql/h3/264_th3index_tempspatialrels.in.sql
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: geometry,  r: th3index}
      - {l: th3index,  r: geometry}
      - {l: th3index,  r: th3index}
    convert: "@extschema@.cellToBoundary(@N@)::@extschema@.tgeometry"

  # tpose/trgeometry are not cell indexes, so `convert` chains a direct cast
  # (or, for tpose, the tgeompoint cast chain) instead of a boundary function,
  # and each supplies its own file doc block rather than the cell-index prose.
  - family:  tpose
    impl:    cast
    file:    mobilitydb/sql/pose/114_tpose_tempspatialrels.in.sql
    predicates:
      - name: tContains
        directions:
          - {l: geometry, r: tpose}
      - name: tCovers
        directions:
          - {l: geometry, r: tpose}
      - name: tDisjoint
        directions:
          - {l: geometry, r: tpose}
          - {l: tpose, r: geometry}
          - {l: tpose, r: tpose}
      - name: tIntersects
        directions:
          - {l: geometry, r: tpose}
          - {l: tpose, r: geometry}
          - {l: tpose, r: tpose}
      - name: tTouches
        directions:
          - {l: geometry, r: tpose}
          - {l: tpose, r: geometry}
      - name: tDwithin
        directions:
          - {l: geometry, r: tpose}
          - {l: tpose, r: geometry}
          - {l: tpose, r: tpose}
    convert: "@N@::@extschema@.tgeompoint"
    doc: |-
      /**
       * @file
       * @brief Temporal spatial relationships for temporal poses
       */

  # A tpcpoint carries the Z its schema declares, and tContains, tCovers and
  # tTouches are planar DE-9IM relationships that refuse a Z dimension, so the
  # family declares the three its values can answer rather than the six a
  # planar family declares.
  - family:  tpcpoint
    impl:    cast
    file:    mobilitydb/sql/pointcloud/444_tpcpoint_tempspatialrels.in.sql
    predicates:
      - name: tContains
        directions:
          - {l: geometry, r: tpcpoint}
      - name: tCovers
        directions:
          - {l: geometry, r: tpcpoint}
      - name: tDisjoint
        directions:
          - {l: geometry, r: tpcpoint}
          - {l: tpcpoint, r: geometry}
          - {l: tpcpoint, r: tpcpoint}
      - name: tIntersects
        directions:
          - {l: geometry, r: tpcpoint}
          - {l: tpcpoint, r: geometry}
          - {l: tpcpoint, r: tpcpoint}
      - name: tTouches
        directions:
          - {l: geometry, r: tpcpoint}
          - {l: tpcpoint, r: geometry}
      - name: tDwithin
        directions:
          - {l: geometry, r: tpcpoint}
          - {l: tpcpoint, r: geometry}
          - {l: tpcpoint, r: tpcpoint}
    convert: "@N@::@extschema@.tgeompoint"
    doc: |-
      /**
       * @file
       * @brief Temporal spatial relationships for temporal pgpointcloud points
       */

  # A tpcpatch reaches the geometry engine as the multipoint of the positions
  # its points occupy, so the temporal geometry is its cast target and it
  # declares the matrix that target declares: every predicate in every
  # direction, an area-valued family keeping what a point-valued one narrows.
  # A schema carrying a Z dimension meets the engine's refusal of a Z value in
  # a planar relationship.
  - family:  tpcpatch
    impl:    cast
    file:    mobilitydb/sql/pointcloud/448_tpcpatch_tempspatialrels.in.sql
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: geometry, r: tpcpatch}
      - {l: tpcpatch, r: geometry}
      - {l: tpcpatch, r: tpcpatch}
    convert: "@N@::@extschema@.tgeometry"
    doc: |-
      /**
       * @file
       * @brief Temporal spatial relationships for temporal pgpointcloud patches
       */

  - family:  tposechain
    impl:    cast
    file:    mobilitydb/sql/posechain/564_tposechain_tempspatialrels.in.sql
    predicates:
      - name: tContains
        directions:
          - {l: geometry, r: tposechain}
      - name: tCovers
        directions:
          - {l: geometry, r: tposechain}
      - name: tDisjoint
        directions:
          - {l: geometry, r: tposechain}
          - {l: tposechain, r: geometry}
          - {l: tposechain, r: tposechain}
      - name: tIntersects
        directions:
          - {l: geometry, r: tposechain}
          - {l: tposechain, r: geometry}
          - {l: tposechain, r: tposechain}
      - name: tTouches
        directions:
          - {l: geometry, r: tposechain}
          - {l: tposechain, r: geometry}
      - name: tDwithin
        directions:
          - {l: geometry, r: tposechain}
          - {l: tposechain, r: geometry}
          - {l: tposechain, r: tposechain}
    convert: "@N@::@extschema@.tpose::@extschema@.tgeompoint"
    doc: |-
      /**
       * @file
       * @brief Temporal spatial relationships for temporal pose chains
       */

  - family:  trgeometry
    impl:    cast
    file:    mobilitydb/sql/rgeo/172_trgeo_tempspatialrels.in.sql
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: geometry,   r: trgeometry}
      - {l: trgeometry, r: geometry}
      - {l: trgeometry, r: trgeometry}
    convert: "@N@::@extschema@.tgeometry"
    doc: |-
      /**
       * @file
       * @brief Temporal spatial relationships for temporal rigid geometries
       */

  # tnpoint is point-like, not a cell index, so `convert` chains the same
  # tgeompoint cast chain as tpose (its own cast target is tgeompoint, not
  # tgeometry directly) rather than a boundary function.
  - family:  tnpoint
    impl:    cast
    file:    mobilitydb/sql/npoint/322_tnpoint_tempspatialrels.in.sql
    predicates:
      - name: tContains
        directions:
          - {l: geometry, r: tnpoint}
      - name: tCovers
        directions:
          - {l: geometry, r: tnpoint}
      - name: tDisjoint
        directions:
          - {l: geometry, r: tnpoint}
          - {l: tnpoint, r: geometry}
          - {l: tnpoint, r: tnpoint}
      - name: tIntersects
        directions:
          - {l: geometry, r: tnpoint}
          - {l: tnpoint, r: geometry}
          - {l: tnpoint, r: tnpoint}
      - name: tTouches
        directions:
          - {l: geometry, r: tnpoint}
          - {l: tnpoint, r: geometry}
      - name: tDwithin
        directions:
          - {l: geometry, r: tnpoint}
          - {l: tnpoint, r: geometry}
          - {l: tnpoint, r: tnpoint}
    convert: "@N@::@extschema@.tgeompoint"
    doc: |-
      /**
       * @file
       * @brief Temporal spatial relationships for temporal network points
       */
