
# ---------------------------------------------------------------------------
# Box-type axis (C boxops generator). The bounding-box topological operator
# wrappers (overlaps/contains/contained/same/adjacent) are per BOX TYPE, not
# per family: one stbox implementation serves every tspatial family, one tbox
# serves the tnumbers, tstzspan the temporal-only types, tpcbox the pointcloud.
# The generator emits the region between the GENERATED-BOXOPS markers in `file`.
# `reference: true` = self-regen must reproduce the committed region byte-for-byte.
boxtypes:
  - box:       stbox
    tside:     tspatial
    boxc:      STBox
    getarg:    PG_GETARG_STBOX_P
    dispbox:   boxop_tspatial_stbox
    disptt:    boxop_tspatial_tspatial
    ingroup:   mobilitydb_geo_bbox_topo
    boxdesc:   spatiotemporal box
    boxdescpl: spatiotemporal boxes
    valdesc:   spatiotemporal value
    file:      mobilitydb/src/geo/tgeo_boxops.c
    reference: true
    # position wrappers (templates/posops.c.tmpl, operations in boxposops.yaml)
    posaxes:   [x, y, z, t]
    posgroup:  mobilitydb_geo_bbox_pos
    posfile:   mobilitydb/src/geo/tspatial_posops.c
    posreference: true
    # nearest approach distance wrappers (templates/nadpairs.c.tmpl): one per
    # pair [left, right, kernel], the kernel naming the order of its arguments,
    # a side marked `free` released after the call; `nadearth` adds the earth
    # model argument and the procedure of the operator; `sep` writes a row of
    # asterisks. Each family of `nadfamilies` is a region of its own file.
    nadgroup:  mobilitydb_geo_dist
    nadfile:   mobilitydb/src/geo/tgeo_distance.c
    nadearth:  true
    nadsides:
      geo:  {c: GSERIALIZED, var: gs, getarg: PG_GETARG_GSERIALIZED_P, desc: geometry, free: true}
      tgeo: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal geo, free: true}
    nadpairs:
      - [geo, stbox, nad_stbox_geo]
      - [stbox, geo, nad_stbox_geo]
      - [stbox, stbox, nad_stbox_stbox]
      - [stbox, tgeo, nad_tgeo_stbox]
      - [tgeo, stbox, nad_tgeo_stbox]
    nadfamilies:
      - family:   tcbuffer
        nadgroup: mobilitydb_cbuffer_dist
        nadfile:  mobilitydb/src/cbuffer/tcbuffer_distance.c
        nadsides:
          cbuffer:  {c: Cbuffer, var: cb, getarg: PG_GETARG_CBUFFER_P, desc: circular buffer}
          geo:      {c: GSERIALIZED, var: gs, getarg: PG_GETARG_GSERIALIZED_P, desc: geometry, free: true}
          tcbuffer: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal circular buffer, descpl: temporal circular buffers, free: true}
        nadpairs:
          - [cbuffer, stbox, nad_cbuffer_stbox]
          - [stbox, cbuffer, nad_cbuffer_stbox]
          - sep
          - [tcbuffer, stbox, nad_tcbuffer_stbox]
          - [stbox, tcbuffer, nad_tcbuffer_stbox]
          - sep
          - [geo, tcbuffer, nad_tcbuffer_geo]
          - [tcbuffer, geo, nad_tcbuffer_geo]
          - sep
          - [cbuffer, tcbuffer, nad_tcbuffer_cbuffer]
          - [tcbuffer, cbuffer, nad_tcbuffer_cbuffer]
          - sep
          - [tcbuffer, tcbuffer, nad_tcbuffer_tcbuffer]
      - family:   tpose
        nadgroup: mobilitydb_pose_dist
        nadfile:  mobilitydb/src/pose/tpose_distance.c
        nadsides:
          pose:  {c: Pose, var: pose, getarg: PG_GETARG_POSE_P, desc: pose}
          geo:   {c: GSERIALIZED, var: gs, getarg: PG_GETARG_GSERIALIZED_P, desc: geometry, free: true}
          tpose: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal pose, descpl: temporal poses, free: true}
        nadpairs:
          - [pose, stbox, distance_pose_stbox]
          - [stbox, pose, distance_pose_stbox]
          - sep
          - [geo, tpose, nad_tpose_geo]
          - [tpose, geo, nad_tpose_geo]
          - sep
          - [tpose, stbox, nad_tpose_stbox]
          - [stbox, tpose, nad_tpose_stbox]
          - sep
          - [pose, tpose, nad_tpose_pose]
          - [tpose, pose, nad_tpose_pose]
          - sep
          - [tpose, tpose, nad_tpose_tpose]
      - family:   tposechain
        nadgroup: mobilitydb_posechain_dist
        nadfile:  mobilitydb/src/pose/tposechain_distance.c
        nadsides:
          posechain:  {c: PoseChain, var: pc, getarg: PG_GETARG_POSECHAIN_P, desc: pose chain}
          geo:        {c: GSERIALIZED, var: gs, getarg: PG_GETARG_GSERIALIZED_P, desc: geometry, free: true}
          tposechain: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal pose chain, descpl: temporal pose chains, free: true}
        nadpairs:
          - [posechain, stbox, distance_posechain_stbox]
          - [stbox, posechain, distance_posechain_stbox]
          - sep
          - [geo, tposechain, nad_tposechain_geo]
          - [tposechain, geo, nad_tposechain_geo]
          - sep
          - [tposechain, stbox, nad_tposechain_stbox]
          - [stbox, tposechain, nad_tposechain_stbox]
          - sep
          - [posechain, tposechain, nad_tposechain_posechain]
          - [tposechain, posechain, nad_tposechain_posechain]
          - sep
          - [tposechain, tposechain, nad_tposechain_tposechain]
      - family:   tnpoint
        nadgroup: mobilitydb_npoint_dist
        nadfile:  mobilitydb/src/npoint/tnpoint_distance.c
        nadsides:
          npoint:  {c: Npoint, var: np, getarg: PG_GETARG_NPOINT_P, desc: network point}
          geo:     {c: GSERIALIZED, var: gs, getarg: PG_GETARG_GSERIALIZED_P, desc: geometry, free: true}
          tnpoint: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal network point, descpl: temporal network points, free: true}
        nadpairs:
          - [geo, tnpoint, nad_tnpoint_geo]
          - [tnpoint, geo, nad_tnpoint_geo]
          - [stbox, tnpoint, nad_tnpoint_stbox]
          - [tnpoint, stbox, nad_tnpoint_stbox]
          - [npoint, tnpoint, nad_tnpoint_npoint]
          - [tnpoint, npoint, nad_tnpoint_npoint]
          - [tnpoint, tnpoint, nad_tnpoint_tnpoint]
      - family:    trgeometry
        nadgroup:  mobilitydb_rgeo_dist
        nadfile:   mobilitydb/src/rgeo/trgeo_distance.c
        nadfcinfo: true
        nadsides:
          geo:        {c: GSERIALIZED, var: gs, getarg: PG_GETARG_GSERIALIZED_P, desc: geometry, free: true}
          tpoint:     {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal point, free: true}
          trgeometry: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal rigid geometry, descpl: temporal rigid geometries, free: true}
        nadpairs:
          - [trgeometry, geo, nad_trgeometry_geo]
          - [geo, trgeometry, nad_trgeometry_geo]
          - [trgeometry, stbox, nad_trgeometry_stbox]
          - [stbox, trgeometry, nad_trgeometry_stbox]
          - [trgeometry, tpoint, nad_trgeometry_tpoint]
          - [tpoint, trgeometry, nad_trgeometry_tpoint]
          - [trgeometry, trgeometry, nad_trgeometry_trgeometry]

  - box:       tpcbox
    tside:     tpointcloud
    boxc:      TPCBox
    getarg:    PG_GETARG_TPCBOX_P
    dispbox:   boxop_tpointcloud_tpcbox
    disptt:    boxop_tpointcloud_tpointcloud
    ingroup:   mobilitydb_pointcloud_temp
    boxdesc:   tpcbox
    boxdescpl: tpcboxes
    valdesc:   temporal pointcloud value
    file:      mobilitydb/src/pointcloud/tpc_boxops.c
    reference: true
    # position wrappers (templates/posops.c.tmpl, operations in boxposops.yaml)
    posaxes:   [x, y, z, t]
    posgroup:  mobilitydb_pointcloud_box_pos
    posreference: true
    # nearest approach distance wrappers (templates/nadpairs.c.tmpl)
    nadgroup:  mobilitydb_pointcloud_temp
    nadfile:   mobilitydb/src/pointcloud/tpc_boxops.c
    nadsides:
      tpointcloud: {c: Temporal, var: temp, getarg: PG_GETARG_TEMPORAL_P, desc: temporal point cloud, descpl: temporal point clouds, free: true}
    nadpairs:
      - [tpcbox, tpcbox, nad_tpcbox_tpcbox]
      - [tpointcloud, tpcbox, nad_tpointcloud_tpcbox]
      - [tpcbox, tpointcloud, nad_tpointcloud_tpcbox]
      - [tpointcloud, tpointcloud, nad_tpointcloud_tpointcloud]

  # tstzspan: the box IS a span<timestamptz>, so the primitives are the generic
  # span operators (overlaps_span_span, ...) via prim: span. Serves every
  # temporal-only type (the time-span bounding box).
  - box:       tstzspan
    tside:     temporal
    prim:      span
    boxc:      Span
    getarg:    PG_GETARG_SPAN_P
    dispbox:   boxop_temporal_tstzspan
    disptt:    boxop_temporal_temporal
    ingroup:   mobilitydb_temporal_bbox_topo
    boxdesc:   timestamptz span
    boxdescpl: timestamptz spans
    valdesc:   temporal value
    file:      mobilitydb/src/temporal/temporal_boxops.c
    reference: true
    # position wrappers: a span names its one dimension x, so the time operations call
    # the x kernels (before -> left_span_span); a wrapper with a box operand backs the
    # SQL function of every class over a timestamptz span (spanBefore ... tpcboxBefore)
    sqlclass:  span
    posaxes:   [t]
    posprimaxes: {t: x}
    possqlclasses: [span, tbox, stbox, tpcbox]
    posgroup:  mobilitydb_temporal_bbox_pos
    posfile:   mobilitydb/src/temporal/temporal_posops.c
    posreference: true

  # tbox: a COMPOSITE box (value span × time). Its own directions dispatch on the
  # tbox primitives (overlaps_tbox_tbox, ...); the `valspan` sub-block adds the
  # value-dimension directions (numspan_tnumber, tnumber_numspan) which dispatch on
  # the generic span primitives (overlaps_span_span, ...) via prim: span — the
  # span<T> value dimension of the tnumber. Shares temporal_boxops.c with tstzspan.
  - box:       tbox
    tside:     tnumber
    prim:      tbox
    boxc:      TBox
    getarg:    PG_GETARG_TBOX_P
    dispbox:   boxop_tnumber_tbox
    disptt:    boxop_tnumber_tnumber
    ingroup:   mobilitydb_temporal_bbox_topo
    boxdesc:   temporal box
    boxdescpl: temporal boxes
    valdesc:   temporal number
    file:      mobilitydb/src/temporal/temporal_boxops.c
    reference: true
    # position wrappers: the value axis on the value span (valspan) and the tbox, the
    # time axis on the tbox
    posaxes:   [x, t]
    posgroup:  mobilitydb_temporal_bbox_pos
    posfile:   mobilitydb/src/temporal/temporal_posops.c
    posreference: true
    # nearest approach distance wrappers (templates/nadops.c.tmpl): the box's
    # directions and, per number type of the value span, its span directions
    boxtype:   T_TBOX
    nadgroup:  mobilitydb_temporal_dist
    nadfile:   mobilitydb/src/temporal/tnumber_distance.c
    valspan:
      box:       numspan
      prim:      span
      boxc:      Span
      getarg:    PG_GETARG_SPAN_P
      dispbox:   boxop_tnumber_numspan
      boxdesc:   number span
      boxdescpl: number spans
      posaxes:   [x]
      nadtypes:
        - {span: intspan, spandesc: integer span, temp: tint, tempdesc: temporal integer}
        - {span: bigintspan, spandesc: big integer span, temp: tbigint, tempdesc: temporal big integer}
        - {span: floatspan, spandesc: float span, temp: tfloat, tempdesc: temporal float}
