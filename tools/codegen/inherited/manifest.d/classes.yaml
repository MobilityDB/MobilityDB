
# Temporal class membership, derived from the catalog class predicates.
#
# generate.py --classes re-reads each predicate body and fails when this
# block disagrees, so adding a type to a class in MEOS cannot land without
# the generated surface following it.
classes:
  set:
    predicate: set_type
    members: [dateset, floatset, intset, bigintset, textset, tstzset, geomset, geogset, npointset, poseset, posechainset, cbufferset, jsonbset, h3indexset, quadbinset, s2cellset, pcpointset, pcpatchset]
  numset:
    predicate: numset_type
    members: [dateset, floatset, intset, bigintset]
  timeset:
    predicate: timeset_type
    members: [dateset, tstzset]
  geoset:
    predicate: geoset_type
    members: [geomset, geogset]
  spatialset:
    predicate: spatialset_type
    members: [geomset, geogset, npointset, poseset, posechainset, cbufferset, h3indexset, quadbinset, s2cellset, pcpointset, pcpatchset]
  alphanumset:
    predicate: alphanumset_type
    members: [dateset, floatset, intset, bigintset, textset, tstzset, jsonbset]
  span:
    predicate: span_type
    members: [datespan, floatspan, intspan, bigintspan, tstzspan]
  spanset:
    predicate: spanset_type
    members: [datespanset, floatspanset, intspanset, bigintspanset, tstzspanset]
  temporal:
    predicate: temporal_type
    members: [tbool, tdouble2, tdouble3, tdouble4, tfloat, tint, ttext, tgeompoint, tgeogpoint, tnpoint, tpose, tposechain, tcbuffer, tgeometry, tgeography, trgeometry, tjsonb, tbigint, th3index, tquadbin, ts2cell, tpcpoint, tpcpatch]
  talpha:
    predicate: talpha_type
    members: [tbool, tdouble2, tdouble3, tdouble4, ttext, tjsonb]
  tnumber:
    predicate: tnumber_type
    members: [tfloat, tint, tbigint]
  torder:
    predicate: torder_type
    members: [tint, tbigint, tfloat, ttext]
  tspatial:
    predicate: tspatial_type
    members: [tgeompoint, tgeogpoint, tnpoint, tpose, tposechain, tcbuffer, tgeometry, tgeography, trgeometry, th3index, tquadbin, ts2cell, tpcpoint, tpcpatch]
  tgeo:
    predicate: tgeo_type
    members: [tgeometry, tgeography]
  tgeo_all:
    predicate: tgeo_type_all
    members: [tgeompoint, tgeogpoint, tgeometry, tgeography]
  tpoint:
    predicate: tpoint_type
    members: [tgeompoint, tgeogpoint]
  tcellindex:
    predicate: tcellindex_type
    members: [th3index, tquadbin, ts2cell]
  tpointcloud:
    predicate: tpointcloud_temptype
    members: [tpcpoint, tpcpatch]
