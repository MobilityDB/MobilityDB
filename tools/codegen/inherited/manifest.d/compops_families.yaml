

# The multi-pair compops families: temporal (5 base types sharing one generic
# base/temporal C symbol per op) and tgeo/tpoint (2 base types — geometry/
# geography — sharing one generic geo/tgeo C symbol per op). Every other family's
# compops surface reaches the SAME engine (generate.py render_compops_body) through
# its one-pair `subtypes:` entry (manifest.d/subtypes.yaml `files: [compops, ...]`)
# instead of needing its own entry here — see the mechanism doc comment above
# render_compops_body in generate.py.
#
# Each `pairs:` entry names only its `temp` type. `base` is NOT declared here: it
# is derived by generate.py (catalog_temptype_basetype()) from meos_catalog.c's
# own `MEOS_RELTYPE_CATALOG[...].temptype_basetype` field — the exact table the
# MEOS entry point for these functions reads at runtime
# (temptype_basetype(), read by tcomp_temporal_base() in
# meos/src/temporal/temporal_compops.c). A hand-written `base:` key here could
# name a base type other than the temp type's own (e.g. `temp: tfloat` paired
# with `base: integer`), which the generator would happily render as
# `tGt(tfloat, integer)` while the C entry point still derives float8 from the
# temp type alone — an int32 Datum silently misread as an IEEE double. Deriving
# `base` from `temp` makes that mismatch unrepresentable.
compops_families:
- family: temporal
  file: mobilitydb/sql/temporal/030_temporal_compops.in.sql
  brief: "temporal types"
  note: |-
    In this file we need both definitions of the functions with 2 and 3
    parameters to be able to define the operators. This is not the case for
    the temporal relationships while a single definition of the functions with
    3 parameters is enough
  basesym: base
  tempsym: temporal
  support:
    sig: "tnumber_supportfn(internal)"
    ret: internal
    sym: Tnumber_supportfn
  pairs:
  - temp: tbool
    rest: temporal_sel
    join: temporal_joinsel
  - temp: tint
    rest: tnumber_sel
    join: tnumber_joinsel
    eqsupport: tnumber_supportfn
  - temp: tbigint
    rest: tnumber_sel
    join: tnumber_joinsel
    eqsupport: tnumber_supportfn
  - temp: tfloat
    rest: tnumber_sel
    join: tnumber_joinsel
    eqsupport: tnumber_supportfn
  - temp: ttext
    rest: temporal_sel
    join: temporal_joinsel

- family: tgeo
  file: mobilitydb/sql/geo/054_tgeo_compops.in.sql
  brief: "temporal geometries/geographies"
  basesym: geo
  tempsym: tgeo
  support:
    sig: "tspatial_supportfn(internal)"
    ret: internal
    sym: Tspatial_supportfn
  pairs:
  - temp: tgeometry
    rest: tspatial_sel
    join: tspatial_joinsel
    eqsupport: tspatial_supportfn
  - temp: tgeography
    rest: tspatial_sel
    join: tspatial_joinsel
    eqsupport: tspatial_supportfn

- family: tpoint
  file: mobilitydb/sql/geo/054_tpoint_compops.in.sql
  brief: "temporal geometry/geography points"
  basesym: geo
  tempsym: tgeo
  # tpoint references tspatial_supportfn (declared by 054_tgeo_compops, loaded
  # first in extension script order); it does not redeclare it, so no `support:`.
  pairs:
  - temp: tgeompoint
    rest: tspatial_sel
    join: tspatial_joinsel
    eqsupport: tspatial_supportfn
  - temp: tgeogpoint
    rest: tspatial_sel
    join: tspatial_joinsel
    eqsupport: tspatial_supportfn
