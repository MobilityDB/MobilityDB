
# Temporal<T> subclasses. `files` lists the inherited behaviours the subtype has
# (a discrete cell-index has no continuous distance / tempspatialrels / spatialfuncs;
# those flags are how the family-reference "surface minus exceptions" is encoded).
subtypes:
  # ---- POC: the new type driving this generator ----
  - temp:  tquadbin
    base:  quadbin
    brief: "temporal QUADBIN cells"
    bin:   350
    category: tspatial
    # A cell-index inherits the scalar base::stbox cast like every spatial type,
    # backed by the quadbin_to_stbox / quadbin_{timestamptz,tstzspan}_to_stbox
    # exports (meos/src/quadbin/tquadbin_boxops.c).
    scalar_stbox_cast: true
    stboxes: false
    # quadbin is planar (Web Mercator), so its stbox bounds the whole cell and the
    # ever intersects/dwithin relationships get spatial index support: they are
    # emitted as C wrappers with SUPPORT tspatial_supportfn (tquadbin_spatialrels.c)
    # rather than SQL cast-wrappers. (h3 is geodetic and stays SQL — a geodetic bbox
    # vs a planar query box would error, so it does not set this flag.)
    index_support: true
    # compops/posops/topops are generic. spatialrels delegates to the geo spatial
    # relationships via the cell→boundary tgeometry conversion
    # (quadbin_cell_to_boundary), the cell-index
    # analogue of th3index 290. GiST/SP-GiST are split (322/323), the canonical
    # cell-index layout (th3index 272/273), not the combined cbuffer `indexes` form.
    # tempspatialrels (364) is generated separately, from the `impl: cast` entry
    # in manifest.d/tempspatialrel_families.yaml.
    files: [compops, posops, topops, spatialrels, gist, spgist]

  # ---- h3: convert the hand-written inherited surface to generated (mirror tquadbin) ----
  - temp:  th3index
    base:  h3index
    # The h3 family directory is `h3`, not the base type name `h3index`.
    fam:   h3
    brief: "temporal H3 cells"
    bin:   250
    category: tspatial
    # A cell-index inherits the scalar base::stbox cast — same as tquadbin —
    # backed by the h3index_to_stbox / h3index_{timestamptz,tstzspan}_to_stbox
    # exports (meos/src/h3/th3index_boxops.c).
    scalar_stbox_cast: true
    stboxes: false
    # tempspatialrels (264) is generated separately, from the `impl: cast` entry
    # in manifest.d/tempspatialrel_families.yaml.
    files: [compops, posops, topops, spatialrels, gist, spgist]

  # ---- s2: the third cell index, geodetic like h3 ----
  - temp:  ts2cell
    base:  s2cell
    brief: "temporal S2 cells"
    bin:   600
    category: tspatial
    # A cell-index inherits the scalar base::stbox cast — same as tquadbin and
    # th3index — backed by the s2cell_to_stbox /
    # s2cell_{timestamptz,tstzspan}_to_stbox exports
    # (meos/src/s2cell/ts2cell_boxops.c).
    scalar_stbox_cast: true
    stboxes: false
    # index_support is NOT set: an S2 cell is a region of the sphere, so its
    # stbox is geodetic and a geodetic bbox against a planar query box errors.
    # h3 is geodetic for the same reason and likewise stays on the SQL form;
    # only the Web-Mercator tquadbin sets it.
    # spatialrels delegates to the geo spatial relationships through the
    # cell -> boundary conversion, the th3index form: geodetic families take
    # the SQL cast-wrapper, only the planar tquadbin takes the C wrapper with
    # SUPPORT tspatial_supportfn. GiST/SP-GiST are split, the canonical
    # cell-index layout (th3index 272/273), not the combined cbuffer
    # `indexes` form, whose template declares a KNN ordering operator this
    # family has no distance function to back.
    files: [compops, posops, topops, spatialrels, gist, spgist]

  # ---- reference families (validate self-regeneration == committed; not new) ----
  - temp:  tcbuffer
    base:  cbuffer
    brief: "temporal circular buffers"
    bin:   200
    category: tspatial
    reference: true
    files: [compops, posops, topops, indexes]

  # tjsonb's compops surface (base jsonb, eq/ne only, tspatial_supportfn/_sel) is
  # byte-identical in shape to this template's single-pair output, so it converges
  # here from the compops_families items/lit axis rather than staying a second
  # hand-transcribed mechanism for the same behaviour. Not tspatial (no `category`;
  # the field is unused by the generator, so no value fits).
  - temp:  tjsonb
    base:  jsonb
    fam:   json
    brief: "temporal JSONB"
    bin:   454
    reference: true
    files: [compops]

  # ---- converted families: the combined `indexes` opclass file is now generated ----
  # These reproduce the cbuffer reference byte-for-byte (npoint's non-canonical index
  # doc-comment header is normalised to the shared form). Their other inherited files
  # are still hand-maintained and will be migrated incrementally.
  - temp:  tnpoint
    base:  npoint
    brief: "temporal network points"
    bin:   300
    category: tspatial
    # npoint's scalar base::stbox conversions are npoint-specific (Npoint_to_stbox
    # + the extra nsegment/timestamptz/tstzspan variants), so they live in the base
    # file 300_npoint (Conversion between network and space), not the templated
    # cbuffer block; and tnpoint has no trajectory-tiling stboxes functions.
    scalar_stbox_cast: false
    stboxes: false
    # A temporal network point delegates its ever/always spatial relationships
    # (320) to the temporal geometry point its route position resolves to
    # (tnpoint_to_tgeompoint, mirroring tpose, not a cell-boundary function):
    # tnpoint has no boundary polygon, only a route-relative position, so that
    # projection is the cast target its geometry names. It carries linear
    # interpolation, which is the interpolation a sequence carries by default,
    # and answers from the same kernel. No index_support: the tnpoint/geometry
    # cross relationships have no bbox-backed SUPPORT function, so every wrapper
    # stays a plain SQL cast-composition with zero new C symbols. The temporal
    # relationships (322) are generated separately, from the `impl: cast` entry
    # in manifest.d/tempspatialrel_families.yaml (same convert).
    convert: "@N@::@extschema@.tgeompoint"
    # A network point holds a POSITION, so the temporal geometry point is the
    # cast target its geometry names, and the family declares the matrix that
    # target declares: a moving point neither contains nor covers a geometry,
    # and two moving points do not touch.
    point_target: true
    # npoint's 300-band already has distance (312) and aggfuncs (314) sitting on
    # the default compressed spatialrels/tempspatialrels offsets (bin+12/+14), so
    # this family aligns to the tgeo-canonical offsets instead (spatialrels+20,
    # tempspatialrels+22), the same choice rgeo already made for its own
    # compressed-band collision.
    positions:
      spatialrels:     20
    doc:
      spatialrels: |-
        /*
         * Ever/always spatial relationships for temporal network points.
         *
         * A temporal network point ({TEMP}) is defined over the road/rail
         * network's position space (route identifier + fractional position
         * along the route), not over free geographical space. Each function
         * converts its network-point operand(s) to a temporal geometry point
         * via the standard tnpoint::tgeompoint cast (the point resolved along
         * its route) and delegates to the temporal geometry point ever/always
         * spatial relationship, so a sequence keeps the interpolation it
         * carries.
         *
         * Two temporal network points whose routes belong to different
         * networks, or to different connected components of the same
         * network, cannot be related through network distance; the free-space
         * relationship computed here is still well defined and is the
         * documented behaviour for that case.
         */
    files: [compops, posops, topops, spatialrels, indexes]

  - temp:  tpose
    base:  pose
    brief: "temporal poses"
    bin:   100
    category: tspatial
    # tpose is 3-D-capable, so its position operators include the front/back (Z)
    # direction on top of the shared left/right/below/above/before/after set.
    front_back: true
    # A temporal pose delegates its spatial relationships (114) to tgeometry via
    # the tgeompoint cast chain, from the `impl: cast` entry in
    # manifest.d/tempspatialrel_families.yaml (not a cell-boundary function, and
    # not a cell index, so that entry overrides the conversion expression and the
    # file doc block). The ever/always spatial relationships are a hybrid (the
    # ever intersects/dwithin are native C with index support), so
    # 112_tpose_spatialrels stays hand-written.
    files: [compops, topops, posops, indexes]

  - temp:  tposechain
    base:  posechain
    brief: "temporal pose chains"
    bin:   550
    category: tspatial
    # A pose chain is 3-D-capable exactly as a pose is, so its position
    # operators carry the front/back (Z) direction as well.
    front_back: true
    # A pose chain has no distance function, so the family deploys neither the
    # ever/always nor the temporal spatial relationships, which every one of
    # them needs. The index opclasses wait on the same answer: the ordering
    # operator of a spatial opclass is the nearest approach distance.
    files: [compops, topops, posops]

  - temp:  trgeometry
    # The base-value comparison is against a `geometry` (the resolved geometry at an
    # instant); the C wrapper stem is `geo`, not `geometry`, so basesym overrides it.
    base:  geometry
    basesym: geo
    fam:   rgeo
    stem:  trgeo
    brief: "temporal rigid geometries"
    bin:   150
    category: tspatial
    # trgeometry is 3-D-capable, so its position operators include the front/back
    # (Z) direction on top of the shared set (same as tpose).
    front_back: true
    # rgeo is the fully box-extraction-split family: its topops file holds ONLY the
    # topological operators, while the stbox casts / stboxes / expandSpace preamble
    # lives in the separate 160_trgeo_boxops extraction file. Drop that preamble.
    box_extraction: false
    # rgeo delegates its temporal spatial relationships (172) to tgeometry via the
    # single tgeometry(trgeometry) cast (2D-only, so no geography branch), from the
    # `impl: cast` entry in manifest.d/tempspatialrel_families.yaml (not a cell
    # index, so that entry overrides the conversion expression and the file doc
    # block). The ever/always ones are native C wrappers (170_trgeo_spatialrels)
    # that stay hand-written.
    # rgeo follows the tgeo-aligned layout, where the position files sit at their
    # tgeo offsets (topops +11 -> 161, posops +12 -> 162, the combined index file
    # at the gist offset +23 -> 173) rather than the tight scheme's +8 / +9 / +16.
    positions:
      topops:          11
      posops:          12
      indexes:         23
    files: [compops, topops, posops, indexes]

  # ---- pointcloud: two temporal types sharing one 50-number band ----
  # The band runs 400 pcset, 410 tpcbox, 420 tpcpoint, 430 tpcpatch, 435+ the
  # operator files shared by both types, so the default compops offset (bin + 4)
  # would land on 404 — ahead of the types whose operators it declares, which
  # CREATE EXTENSION rejects. Each type overrides the offset to sit after 430
  # and before 435, and carries its own entry because the generator emits one
  # file per subtype. `fam` is needed because the directory is named after the
  # family, not after the base type.
  - temp:  tpcpoint
    base:  pcpoint
    fam:   pointcloud
    brief: "temporal pgpointcloud points"
    bin:   400
    category: tspatial
    # A point cloud point holds a POSITION, so the temporal geometry point its
    # points resolve to is the cast target its geometry names, and the family
    # declares the matrix that target declares. A schema carrying a Z dimension
    # meets the engine's own refusal of a Z value in a planar relationship, the
    # way a mixed SRID does; a schema without one answers every direction.
    convert: "@N@::@extschema@.tgeompoint"
    point_target: true
    positions:
      compops: 33
      spatialrels: 43
    doc:
      spatialrels: |-
        /**
         * @file
         * @brief Ever/always spatial relationships for temporal pgpointcloud
         *   points
         *
         * Each function converts its point cloud operand to the temporal
         * geometry point its positions resolve to, through the standard
         * tpcpoint::tgeompoint cast, and delegates to the temporal geometry
         * point ever/always spatial relationship.
         */
    files: [compops, spatialrels]

  - temp:  tpcpatch
    base:  pcpatch
    fam:   pointcloud
    brief: "temporal pgpointcloud patches"
    bin:   400
    category: tspatial
    # A patch is a cluster of points, so its geometry is the multipoint of the
    # positions its points occupy and the temporal geometry is the cast target
    # its geometry names. The family declares the matrix that target declares,
    # every predicate in every direction; a schema carrying a Z dimension meets
    # the engine's refusal of a Z value in a planar relationship.
    convert: "@N@::@extschema@.tgeometry"
    # `eIntersects(tpcpatch, geometry)` is emitted as a C wrapper over
    # `Eintersects_tpcpatch_geo`, whose kernel walks the points of each instant
    # and short-circuits on the first hit instead of materializing a multipoint.
    native_ever_intersects: true
    positions:
      compops: 34
      # The band's last free slot: 447 is the point distance file and 450 opens
      # the next band, so the ever/always file sits above the temporal one it
      # does not depend on.
      spatialrels: 49
    doc:
      spatialrels: |-
        /**
         * @file
         * @brief Ever/always spatial relationships for temporal pgpointcloud
         *   patches
         *
         * Each function converts its patch operand to the temporal geometry of
         * the multipoints its patches occupy, through the standard
         * tpcpatch::tgeometry cast, and delegates to the temporal geometry
         * ever/always spatial relationship.
         */
    files: [compops, spatialrels]
