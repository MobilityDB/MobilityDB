          - {l: tgeometry, r: geometry}
          - {l: tgeometry, r: tgeometry}
          - {l: geography,  r: tgeography, gap: true, spheroid: true, ever_only: true}
          - {l: tgeography, r: geography, spheroid: true, ever_only: true}
