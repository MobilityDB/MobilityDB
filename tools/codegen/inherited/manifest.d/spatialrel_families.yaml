
# ---------------------------------------------------------------------------
# Spatial-relationship axis (C spatialrels generator, PG side). The ever/always
# PG wrapper surface (E<Rel>/A<Rel>_<dir> + @sqlfn) is 100% mechanical from
# (predicate, quantifier, direction): each wrapper just dispatches to the MEOS
# ea_<rel>_<dir> kernel with EVER/ALWAYS. The generator emits the region between
# the GENERATED-SPATIALRELS markers in `file`, per predicate, leaving the
# hand-written native kernels (in meos/src) and the irregular tail (touches
# geo/tpoint directions, dwithin_tgeo_tgeo, the array *Pairs surface) untouched.
# `reference: true` = self-regen must reproduce the committed region byte-for-byte.
# Each predicate carries its section banner + the tokens used to derive the
# wrapper name (Rel), the SQL name (sqlfn base) and the @brief verb (verb3).
spatialrel_families:
  - family:    geo_ea_contains_covers
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Ever/always contains"
        briefs:
          geo_tgeo:  "a geometry {word} contains a temporal geometry"
          tgeo_geo:  "a temporal geometry {word} contains a geometry"
          tgeo_tgeo: "a temporal geometry {word} contains another one"
      - rel: covers
        Rel: Covers
        banner: "Ever covers"
        briefs:
          geo_tgeo:  "a geometry {word} covers a temporal geometry"
          tgeo_geo:  "a temporal geometry {word} covers a geometry"
          tgeo_tgeo: "a temporal geometry {word} covers another one"

  - family:    geo_ea_disjoint_intersects
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    predicates:
      - rel: disjoint
        Rel: Disjoint
        banner: "Ever disjoint (for both geometry and geography)"
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geometry are {word} disjoint"
          tgeo_geo:  "a temporal geometry and a geometry/geography are {word} disjoint"
          tgeo_tgeo: "two temporal geometries are {word} disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Ever intersects (for both geometry and geography)"
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geometry {word} intersect"
          tgeo_geo:  "a temporal geometry and a geometry/geography {word} intersect"
          tgeo_tgeo: "two temporal geometries {word} intersect"

  # touches of the temporal geos: the geometry directions of a temporal geometry
  # and of a temporal point call the file's static dispatchers EA_touches_geo_tgeo
  # and EA_touches_tgeo_geo, which take the quantifier and a flag choosing the
  # point or the geometry kernel (`flags`); two temporal geometries take the
  # family dispatcher over ea_touches_tgeo_tgeo.
  - family:    geo_ea_touches
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    predicates:
      - rel: touches
        Rel: Touches
        banner: "Ever/always touches\n * The function does not accept geography since it is based on the PostGIS\n * ST_Boundary function"
        directions: [geo_tgeo, geo_tpoint, tgeo_geo, tpoint_geo, tgeo_tgeo]
        disp:
          geo_tgeo:   EA_touches_geo_tgeo
          geo_tpoint: EA_touches_geo_tgeo
          tgeo_geo:   EA_touches_tgeo_geo
          tpoint_geo: EA_touches_tgeo_geo
        flags:
          geo_tgeo:   TGEO
          geo_tpoint: TPOINT
          tgeo_geo:   TGEO
          tpoint_geo: TPOINT
        briefs:
          geo_tgeo:   "a geometry and a temporal geometry {word} touch"
          geo_tpoint: "a geometry and a temporal point {word} touch"
          tgeo_geo:   "a temporal geometry and a geometry {word} touch"
          tpoint_geo: "a temporal point and a geometry {word} touch"
          tgeo_tgeo:  "two temporal geometries {word} touch"

  # dwithin of the temporal geos (dwithin: true selects render_dwithin): each
  # direction has a local static dispatcher calling the public e/a functions by
  # name, and reads the earth model from argument 3 when the geography overload
  # states it (`spheroid: 3`), the spheroid otherwise.
  - family:    geo_ea_dwithin
    file:      mobilitydb/src/geo/tgeo_spatialrels.c
    reference: true
    dwithin:   true
    ingroup:   mobilitydb_geo_rel_ever
    banner:    "Ever/always dwithin (for both geometry and geography)\n * The function only accepts points and not arbitrary geometries/geographies"
    order:     [geo_tgeo, tgeo_geo, tgeo_tgeo]
    directions:
      geo_tgeo:
        noun:     "a geometry/geography and a temporal geometry"
        kernel:   geo_tgeo
        kargs:    "gs, temp, dist, spheroid"
        spheroid: 3
        args:
          - {type: "GSERIALIZED *", var: gs,   pos: 0}
          - {type: "Temporal *",    var: temp, pos: 1}
      tgeo_geo:
        noun:     "a temporal geometry and a geometry/geography"
        kernel:   tgeo_geo
        kargs:    "temp, gs, dist, spheroid"
        spheroid: 3
        args:
          - {type: "Temporal *",    var: temp, pos: 0}
          - {type: "GSERIALIZED *", var: gs,   pos: 1}
      tgeo_tgeo:
        noun:     "two temporal geometries"
        kernel:   tgeo_tgeo
        kargs:    "temp1, temp2, dist, spheroid"
        spheroid: 3
        args:
          - {type: "Temporal *", var: temp1, pos: 0}
          - {type: "Temporal *", var: temp2, pos: 1}

  # tcbuffer carries the fuller 5-direction shape (it adds the base-value cbuffer
  # directions on top of geo/temporal), its own @ingroup, and its own dispatcher
  # map. The base-value briefs are corrected here: the hand-written wrappers reused
  # the "a geometry" wording for the (cbuffer, tcbuffer) / (tcbuffer, cbuffer)
  # directions — the argument is a circular buffer, not a geometry.
  - family:    cbuffer_ea_contains_covers
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    ingroup:   mobilitydb_cbuffer_rel_ever
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    disp:
      geo_tcbuffer:      EA_spatialrel_geo_tspatial
      tcbuffer_geo:      EA_spatialrel_tspatial_geo
      cbuffer_tcbuffer:  EA_spatialrel_cbuffer_tcbuffer
      tcbuffer_cbuffer:  EA_spatialrel_tcbuffer_cbuffer
      tcbuffer_tcbuffer: EA_spatialrel_tspatial_tspatial
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Ever/always contains"
        briefs:
          geo_tcbuffer:      "a geometry {word} contains a temporal circular buffer"
          tcbuffer_geo:      "a temporal circular buffer {word} contains a geometry"
          cbuffer_tcbuffer:  "a circular buffer {word} contains a temporal circular buffer"
          tcbuffer_cbuffer:  "a temporal circular buffer {word} contains a circular buffer"
          tcbuffer_tcbuffer: "a temporal circular buffer {word} contains another one"
      - rel: covers
        Rel: Covers
        banner: "Ever/always covers"
        briefs:
          geo_tcbuffer:      "a geometry {word} covers a temporal circular buffer"
          tcbuffer_geo:      "a temporal circular buffer {word} covers a geometry"
          cbuffer_tcbuffer:  "a circular buffer {word} covers a temporal circular buffer"
          tcbuffer_cbuffer:  "a temporal circular buffer {word} covers a circular buffer"
          tcbuffer_tcbuffer: "a temporal circular buffer {word} covers another one"

  - family:    cbuffer_ea_disjoint_intersects
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    ingroup:   mobilitydb_cbuffer_rel_ever
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    disp:
      geo_tcbuffer:      EA_spatialrel_geo_tspatial
      tcbuffer_geo:      EA_spatialrel_tspatial_geo
      cbuffer_tcbuffer:  EA_spatialrel_cbuffer_tcbuffer
      tcbuffer_cbuffer:  EA_spatialrel_tcbuffer_cbuffer
      tcbuffer_tcbuffer: EA_spatialrel_tspatial_tspatial
    predicates:
      - rel: disjoint
        Rel: Disjoint
        banner: "Ever/always disjoint"
        briefs:
          geo_tcbuffer:      "a geometry and a temporal circular buffer are {word} disjoint"
          tcbuffer_geo:      "a temporal circular buffer and a geometry are {word} disjoint"
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer are {word} disjoint"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer are {word} disjoint"
          tcbuffer_tcbuffer: "two temporal circular buffers are {word} disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Ever/always intersects"
        briefs:
          geo_tcbuffer:      "a geometry and a temporal circular buffer {word} intersect"
          tcbuffer_geo:      "a temporal circular buffer and a geometry {word} intersect"
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer {word} intersect"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer {word} intersect"
          tcbuffer_tcbuffer: "two temporal circular buffers {word} intersect"

  - family:    cbuffer_ea_touches
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    ingroup:   mobilitydb_cbuffer_rel_ever
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    disp:
      geo_tcbuffer:      EA_spatialrel_geo_tspatial
      tcbuffer_geo:      EA_spatialrel_tspatial_geo
      cbuffer_tcbuffer:  EA_spatialrel_cbuffer_tcbuffer
      tcbuffer_cbuffer:  EA_spatialrel_tcbuffer_cbuffer
      tcbuffer_tcbuffer: EA_spatialrel_tspatial_tspatial
    predicates:
      - rel: touches
        Rel: Touches
        banner: "Ever/always touches"
        briefs:
          geo_tcbuffer:      "a geometry and a temporal circular buffer {word} touch"
          tcbuffer_geo:      "a temporal circular buffer and a geometry {word} touch"
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer {word} touch"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer {word} touch"
          tcbuffer_tcbuffer: "two temporal circular buffers {word} touch"

  # dwithin uses a distinct shape (a per-direction static dispatcher that reads
  # the operands + the distance and calls the e/a kernel directly, with two thin
  # public wrappers), so `dwithin: true` selects render_dwithin. Each direction
  # lists its two arguments (declared/freed in position order), the MEOS kernel
  # suffix and the kernel call arguments (temporal operand first).
  - family:    cbuffer_ea_dwithin
    file:      mobilitydb/src/cbuffer/tcbuffer_spatialrels.c
    reference: true
    dwithin:   true
    ingroup:   mobilitydb_cbuffer_rel_ever
    banner:    "Ever/always dwithin\n * The function only accepts points and not arbitrary geometries"
    order:     [geo_tcbuffer, tcbuffer_geo, cbuffer_tcbuffer, tcbuffer_cbuffer, tcbuffer_tcbuffer]
    directions:
      geo_tcbuffer:
        noun:   "a geometry and a temporal circular buffer"
        kernel: tcbuffer_geo
        kargs:  "temp, gs, dist"
        args:
          - {type: "GSERIALIZED *", var: gs,   pos: 0}
          - {type: "Temporal *",    var: temp, pos: 1}
      tcbuffer_geo:
        noun:   "a temporal circular buffer and a geometry"
        kernel: tcbuffer_geo
        kargs:  "temp, gs, dist"
        args:
          - {type: "Temporal *",    var: temp, pos: 0}
          - {type: "GSERIALIZED *", var: gs,   pos: 1}
      cbuffer_tcbuffer:
        noun:   "a circular buffer and a temporal circular buffer"
        kernel: tcbuffer_cbuffer
        kargs:  "temp, cb, dist"
        args:
          - {type: "Cbuffer *",  var: cb,   pos: 0}
          - {type: "Temporal *", var: temp, pos: 1}
      tcbuffer_cbuffer:
        noun:   "a temporal circular buffer and a circular buffer"
        kernel: tcbuffer_cbuffer
        kargs:  "temp, cb, dist"
        args:
          - {type: "Temporal *", var: temp, pos: 0}
          - {type: "Cbuffer *",  var: cb,   pos: 1}
      tcbuffer_tcbuffer:
        noun:   "two temporal circular buffers"
        kernel: tcbuffer_tcbuffer
        kargs:  "temp1, temp2, dist"
        args:
          - {type: "Temporal *", var: temp1, pos: 0}
          - {type: "Temporal *", var: temp2, pos: 1}

  # rgeo (temporal rigid geometry) has the reduced three-direction shape (geo⊗T,
  # T⊗geo, T⊗T; no base-value directions) and abbreviates its kernel type token
  # trgeometry -> trgeo, so it uses kernel_dir. It shares the geo ever/always doc
  # group.
  - family:    rgeo_ea_contains_covers
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    ingroup:   mobilitydb_geo_rel_ever
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    disp:
      geo_trgeometry:        EA_spatialrel_geo_tspatial
      trgeometry_geo:        EA_spatialrel_tspatial_geo
      trgeometry_trgeometry: EA_spatialrel_tspatial_tspatial
    kernel_dir:
      geo_trgeometry:        geo_trgeo
      trgeometry_geo:        trgeo_geo
      trgeometry_trgeometry: trgeo_trgeo
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Ever/always contains"
        briefs:
          geo_trgeometry:        "a geometry {word} contains a temporal rigid geometry"
          trgeometry_geo:        "a temporal rigid geometry {word} contains a geometry"
          trgeometry_trgeometry: "a temporal rigid geometry {word} contains another one"
      - rel: covers
        Rel: Covers
        banner: "Ever/always covers"
        briefs:
          geo_trgeometry:        "a geometry {word} covers a temporal rigid geometry"
          trgeometry_geo:        "a temporal rigid geometry {word} covers a geometry"
          trgeometry_trgeometry: "a temporal rigid geometry {word} covers another one"

  - family:    rgeo_ea_disjoint_intersects
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    ingroup:   mobilitydb_geo_rel_ever
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    disp:
      geo_trgeometry:        EA_spatialrel_geo_tspatial
      trgeometry_geo:        EA_spatialrel_tspatial_geo
      trgeometry_trgeometry: EA_spatialrel_tspatial_tspatial
    kernel_dir:
      geo_trgeometry:        geo_trgeo
      trgeometry_geo:        trgeo_geo
      trgeometry_trgeometry: trgeo_trgeo
    predicates:
      - rel: disjoint
        Rel: Disjoint
        banner: "Ever disjoint (for both geometry and geography)"
        briefs:
          geo_trgeometry:        "a geometry and a temporal rigid geometry are {word} disjoint"
          trgeometry_geo:        "a temporal rigid geometry and a geometry are {word} disjoint"
          trgeometry_trgeometry: "two temporal rigid geometries are {word} disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Ever intersects (for both geometry and geography)"
        briefs:
          geo_trgeometry:        "a geometry and a temporal rigid geometry {word} intersect"
          trgeometry_geo:        "a temporal rigid geometry and a geometry {word} intersect"
          trgeometry_trgeometry: "two temporal rigid geometries {word} intersect"

  - family:    rgeo_ea_touches
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    ingroup:   mobilitydb_geo_rel_ever
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    disp:
      geo_trgeometry:        EA_spatialrel_geo_tspatial
      trgeometry_geo:        EA_spatialrel_tspatial_geo
      trgeometry_trgeometry: EA_spatialrel_tspatial_tspatial
    kernel_dir:
      geo_trgeometry:        geo_trgeo
      trgeometry_geo:        trgeo_geo
      trgeometry_trgeometry: trgeo_trgeo
    predicates:
      - rel: touches
        Rel: Touches
        banner: "Ever/always touches"
        briefs:
          geo_trgeometry:        "a geometry and a temporal rigid geometry {word} touch"
          trgeometry_geo:        "a temporal rigid geometry and a geometry {word} touch"
          trgeometry_trgeometry: "two temporal rigid geometries {word} touch"

  # rgeo dwithin is a HYBRID (dwithin: true selects render_dwithin): the two mixed
  # directions reuse the family-wide EA_dwithin_* dispatchers with the single fixed
  # kernel ea_dwithin_trgeo_geo (the dispatcher fixes the argument order), so they
  # are `shape: shared` and emit only the two wrappers; the T⊗T direction keeps a
  # local static dispatcher that calls ea_dwithin_trgeo_trgeo(temp1, temp2, dist,
  # ever) — a single kernel taking `ever` as its last argument (ever_arg: true).
  - family:    rgeo_ea_dwithin
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    dwithin:   true
    ingroup:   mobilitydb_geo_rel_ever
    banner:    "Ever/always dwithin (for both geometry and geography)\n * The function only accepts points and not arbitrary geometries/geographies"
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    directions:
      geo_trgeometry:
        shape:  shared
        noun:   "a geometry and a temporal rigid geometry"
        disp:   EA_dwithin_geo_tspatial
        kernel: ea_dwithin_trgeo_geo
      trgeometry_geo:
        shape:  shared
        noun:   "a temporal rigid geometry and a geometry"
        disp:   EA_dwithin_tspatial_geo
        kernel: ea_dwithin_trgeo_geo
      trgeometry_trgeometry:
        noun:     "two temporal rigid geometries"
        ever_arg: true
        kernel:   trgeo_trgeo
        kargs:    "temp1, temp2, dist, ever"
        args:
          - {type: "Temporal *", var: temp1, pos: 0}
          - {type: "Temporal *", var: temp2, pos: 1}

  # The temporal relationships of the temporal geos (`temporal: true`): per
  # predicate one T<Rel>_<dir> wrapper per direction, answering a temporal
  # boolean through the file's Tspatialrel_* dispatchers over the MEOS
  # t<rel>_<dir> kernel. tDwithin reads its distance and earth model in a body
  # of its own, outside the region.
  - family:    geo_t_rels
    file:      mobilitydb/src/geo/tspatial_tempspatialrels.c
    reference: true
    temporal:  true
    ingroup:   mobilitydb_geo_rel_temp
    disp:
      geo_tgeo:  Tspatialrel_geo_tspatial
      tgeo_geo:  Tspatialrel_tspatial_geo
      tgeo_tgeo: Tspatialrel_tspatial_tspatial
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Temporal contains"
        briefs:
          geo_tgeo:  "a geometry contains a temporal geo"
          tgeo_geo:  "a temporal geo contains a geometry"
          tgeo_tgeo: "a temporal geo contains another one"
      - rel: covers
        Rel: Covers
        banner: "Temporal covers"
        briefs:
          geo_tgeo:  "a geometry covers a temporal geo"
          tgeo_geo:  "a temporal geo covers a geometry"
          tgeo_tgeo: "a temporal geo covers another one"
      - rel: disjoint
        Rel: Disjoint
        banner: "Temporal disjoint"
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geo are disjoint"
          tgeo_geo:  "a temporal geo and a geometry/geography are disjoint"
          tgeo_tgeo: "two temporal geos are disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Temporal intersects\n * Available for temporal geographies"
        briefs:
          geo_tgeo:  "a geometry/geography and a temporal geo intersect"
          tgeo_geo:  "a temporal geo and a geometry/geography intersect"
          tgeo_tgeo: "two temporal geos intersect"
      - rel: touches
        Rel: Touches
        banner: "Temporal touches"
        briefs:
          geo_tgeo:  "a geometry and a temporal geo touch"
          tgeo_geo:  "a temporal geo and a geometry touch"
          tgeo_tgeo: "two temporal geos touch"

  # The temporal relationships of the temporal circular buffers, in the
  # 5-direction shape of the family: the base-value directions take the file's
  # own Tspatialrel_cbuffer_tcbuffer and Tspatialrel_tcbuffer_cbuffer, the
  # others the dispatchers of the temporal geos. tDwithin stays outside the
  # region, its base-value directions reading the distance in bodies of their own.
  - family:    cbuffer_t_rels
    file:      mobilitydb/src/cbuffer/tcbuffer_tempspatialrels.c
    reference: true
    temporal:  true
    ingroup:   mobilitydb_cbuffer_rel_temp
    order:     [cbuffer_tcbuffer, tcbuffer_cbuffer, geo_tcbuffer, tcbuffer_geo, tcbuffer_tcbuffer]
    disp:
      cbuffer_tcbuffer:  Tspatialrel_cbuffer_tcbuffer
      tcbuffer_cbuffer:  Tspatialrel_tcbuffer_cbuffer
      geo_tcbuffer:      Tspatialrel_geo_tspatial
      tcbuffer_geo:      Tspatialrel_tspatial_geo
      tcbuffer_tcbuffer: Tspatialrel_tspatial_tspatial
    predicates:
      - rel: contains
        Rel: Contains
        banner: "Temporal contains"
        briefs:
          cbuffer_tcbuffer:  "a circular buffer contains a temporal circular buffer"
          tcbuffer_cbuffer:  "a temporal circular buffer contains a circular buffer"
          geo_tcbuffer:      "a geometry contains a temporal circular buffer"
          tcbuffer_geo:      "a temporal circular buffer contains a geometry"
          tcbuffer_tcbuffer: "a temporal circular buffer contains another one"
      - rel: covers
        Rel: Covers
        banner: "Temporal covers"
        briefs:
          cbuffer_tcbuffer:  "a circular buffer covers a temporal circular buffer"
          tcbuffer_cbuffer:  "a temporal circular buffer covers a circular buffer"
          geo_tcbuffer:      "a geometry covers a temporal circular buffer"
          tcbuffer_geo:      "a temporal circular buffer covers a geometry"
          tcbuffer_tcbuffer: "a temporal circular buffer covers another one"
      - rel: disjoint
        Rel: Disjoint
        banner: "Temporal disjoint"
        briefs:
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer are disjoint"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer are disjoint"
          geo_tcbuffer:      "a geometry and a temporal circular buffer are disjoint"
          tcbuffer_geo:      "a temporal circular buffer and a geometry are disjoint"
          tcbuffer_tcbuffer: "two temporal circular buffers are disjoint"
      - rel: intersects
        Rel: Intersects
        banner: "Temporal intersects"
        briefs:
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer intersect"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer intersect"
          geo_tcbuffer:      "a geometry and a temporal circular buffer intersect"
          tcbuffer_geo:      "a temporal circular buffer and a geometry intersect"
          tcbuffer_tcbuffer: "two temporal circular buffers intersect"
      - rel: touches
        Rel: Touches
        banner: "Temporal touches"
        briefs:
          cbuffer_tcbuffer:  "a circular buffer and a temporal circular buffer touch"
          tcbuffer_cbuffer:  "a temporal circular buffer and a circular buffer touch"
          geo_tcbuffer:      "a geometry and a temporal circular buffer touch"
          tcbuffer_geo:      "a temporal circular buffer and a geometry touch"
          tcbuffer_tcbuffer: "two temporal circular buffers touch"
      - rel: dwithin
        Rel: Dwithin
        banner: "Temporal dwithin"
        directions: [geo_tcbuffer, tcbuffer_geo, tcbuffer_tcbuffer]
        disp:
          geo_tcbuffer:      Tdwithin_geo_tspatial
          tcbuffer_geo:      Tdwithin_tspatial_geo
          tcbuffer_tcbuffer: Tdwithin_tspatial_tspatial
        briefs:
          geo_tcbuffer:      "a geometry and a temporal circular buffer are within a distance"
          tcbuffer_geo:      "a temporal circular buffer and a geometry are within a distance"
          tcbuffer_tcbuffer: "two temporal circular buffers are within a distance"

  # The temporal dwithin of the temporal rigid geometries, whose three directions
  # take the Tdwithin_* dispatchers of the temporal geos.
  - family:    rgeo_t_dwithin
    file:      mobilitydb/src/rgeo/trgeo_spatialrels.c
    reference: true
    temporal:  true
    ingroup:   mobilitydb_geo_rel_temp
    order:     [geo_trgeometry, trgeometry_geo, trgeometry_trgeometry]
    disp:
      geo_trgeometry:        Tdwithin_geo_tspatial
      trgeometry_geo:        Tdwithin_tspatial_geo
      trgeometry_trgeometry: Tdwithin_tspatial_tspatial
    predicates:
      - rel: dwithin
        Rel: Dwithin
        banner: "Temporal dwithin"
        briefs:
          geo_trgeometry:        "a geometry and a temporal rigid geometry are within a distance"
          trgeometry_geo:        "a temporal rigid geometry and a geometry are within a distance"
          trgeometry_trgeometry: "two temporal rigid geometries are within a distance"

# ---------------------------------------------------------------------------
# The SQL of the ever/always relationships of a family answering them with C
# kernels of its own (generate.py's render_native_spatialrels, templates/
# spatialrels_native.sql.tmpl): `impl: native` and the whole `.in.sql` file. Per
# predicate, its ever cells then its always cells, one per direction, over the
# symbol E<Rel>/A<Rel>_<left>_<right>; a predicate overrides the family's
# `directions`, `support` (the quantifiers whose cells carry the support function
# of the index) or `symbol` (a type's token in the symbol). A family casting to
# its target takes the cast template through subtypes.yaml instead.
  - family:  tgeo
    impl:    native
    file:    mobilitydb/sql/geo/070_tgeo_spatialrels.in.sql
    brief:   "temporal geometries/geographies"
    details: "Index support is enabled for every relationship but disjoint."
    directions:
      - {l: geometry,  r: tgeometry}
      - {l: tgeometry, r: geometry}
      - {l: tgeometry, r: tgeometry}
    predicates:
      - Contains
      - Covers
      - name: Disjoint
        support: []
        directions:
          - {l: geometry,  r: tgeometry}
          - {l: tgeometry, r: geometry}
          - {l: tgeometry, r: tgeometry}
          - {l: geography,  r: tgeography, gap: true}
          - {l: tgeography, r: geography}
          - {l: tgeography, r: tgeography}
      - name: Intersects
        directions:
