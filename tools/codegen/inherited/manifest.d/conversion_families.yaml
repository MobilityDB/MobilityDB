- family: rgeo
  file: mobilitydb/sql/rgeo/150_trgeo.in.sql
  reference: true
  begin: "\n * Conversion functions\n"
  end: "\n * Accessor Functions\n"
  blocks:
  - lit: "/******************************************************************************\n * Conversion functions\n ******************************************************************************/\n\n"
  - fns:
    - {sig: "tpose(trgeometry)", ret: tpose, sym: Trgeometry_to_tpose}
    - {sig: "tgeompoint(trgeometry)", ret: tgeompoint, sym: Trgeometry_to_tgeompoint}
    - {sig: "tgeometry(trgeometry)", ret: tgeometry, sym: Trgeometry_to_tgeometry}
  - lit: "\nCREATE CAST (trgeometry AS tpose) WITH FUNCTION tpose(trgeometry);\nCREATE CAST (trgeometry AS tgeompoint) WITH FUNCTION tgeompoint(trgeometry);\nCREATE CAST (trgeometry AS tgeometry) WITH FUNCTION tgeometry(trgeometry);\n\n"
  - fns:
    - {sig: "stbox(trgeometry)", ret: stbox, sym: Tspatial_to_stbox}
  - lit: "\nCREATE CAST (trgeometry AS stbox) WITH FUNCTION stbox(trgeometry);\n\nCREATE FUNCTION expandSpace(trgeometry, float)\n  RETURNS stbox\n  AS 'SELECT @extschema@.expandSpace($1::stbox, $2)'\n  LANGUAGE SQL IMMUTABLE STRICT PARALLEL SAFE;\n\n"
  - fns:
    - {sig: "geometry(trgeometry)", ret: geometry, sym: Trgeometry_to_geom}
  - lit: "\nCREATE CAST (trgeometry AS geometry) WITH FUNCTION geometry(trgeometry);\n\n"
- family: h3
  file: mobilitydb/sql/h3/253_th3index.in.sql
  reference: true
  begin: "\n * Conversions\n"
  end: "\n * Constructors\n"
  blocks:
  - lit: "/******************************************************************************\n * Conversions\n *\n * The int64 payload is shared, but th3index sequences carry a geodetic\n * STBox bbox while tbigint sequences carry a TBox; a binary coercion\n * would leave the wrong bbox shape in place and the wrong temptype byte\n * inside the Temporal header. The cast therefore goes through a real\n * function that lifts an identity Datum function so the result is\n * rebuilt at the correct shape. The cast is declared `AS ASSIGNMENT`\n * so the user must spell out `::th3index` or `::tbigint` — mistakes\n * surface as a clear binder error rather than silently reinterpreting\n * an arbitrary int64 trajectory as a stream of H3 cells.\n ******************************************************************************/\n\n"
  - fns:
    - {sig: "th3index(tbigint)", ret: th3index, sym: Tbigint_to_th3index}
    - {sig: "tbigint(th3index)", ret: tbigint, sym: Th3index_to_tbigint}
  - lit: "\nCREATE CAST (tbigint AS th3index) WITH FUNCTION th3index(tbigint) AS ASSIGNMENT;\nCREATE CAST (th3index AS tbigint) WITH FUNCTION tbigint(th3index) AS ASSIGNMENT;\n\n"
