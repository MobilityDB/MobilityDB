  - lit: "/*****************************************************************************\n * Conversions\n *****************************************************************************/\n\n"
  - fns:
    - {sig: "tgeompoint(tcbuffer)", ret: tgeompoint, sym: Tcbuffer_to_tgeompoint}
    - {sig: "tfloat(tcbuffer)", ret: tfloat, sym: Tcbuffer_to_tfloat}
  - lit: "\n"
  - fns:
    - {sig: "tcbuffer(tgeompoint)", ret: tcbuffer, sym: Tgeometry_to_tcbuffer}
    - {sig: "tcbuffer(tgeometry)", ret: tcbuffer, sym: Tgeometry_to_tcbuffer}
  - lit: "\nCREATE CAST (tcbuffer AS tgeompoint) WITH FUNCTION tgeompoint(tcbuffer);\nCREATE CAST (tcbuffer AS tfloat) WITH FUNCTION tfloat(tcbuffer);\nCREATE CAST (tgeompoint AS tcbuffer) WITH FUNCTION tcbuffer(tgeompoint);\nCREATE CAST (tgeometry AS tcbuffer) WITH FUNCTION tcbuffer(tgeometry);\n\n"
