
# ---------------------------------------------------------------------------
# Native temporal spatial relationships (SQL, whole-file). A native family
# implements the temporal relationships (tXxx -> tbool) as C functions declared
# with AS 'MODULE_PATHNAME','<Symbol>' rather than SQL cast-wrappers. Each family
# lists its ordered directions (left/right argument type; `geometry` tokenizes to
# `geo` in the C symbol T<rel>_<left>_<right>) and its predicate set; the whole
# file is generated from templates/tempspatialrels_native.sql.tmpl.
native_tempspatialrel_families:
  - family:  cbuffer
    file:    mobilitydb/sql/cbuffer/214_tcbuffer_tempspatialrels.in.sql
    brief:   "temporal circular buffers"
    predicates: [tContains, tCovers, tDisjoint, tIntersects, tTouches, tDwithin]
    directions:
      - {l: cbuffer,  r: tcbuffer}
      - {l: tcbuffer, r: cbuffer}
      - {l: geometry, r: tcbuffer}
      - {l: tcbuffer, r: geometry}
      - {l: tcbuffer, r: tcbuffer}
