- family: pose
  file: mobilitydb/sql/pose/102_tpose.in.sql
  reference: true
  begin: "\n   * Input/output from (E)WKT, (E)WKB, HexEWKB, and MFJSON representation\n"
  end: "\n * Constructors\n"
  temps:
  - temp: tpose
    maxdd: true
  syms:
    FromText: Tspatial_from_ewkt
    FromEWKT: Tspatial_from_ewkt
    asText: Tspatial_as_text
    asEWKT: Tspatial_as_ewkt
    asEWKB: Tspatial_as_ewkb
    asHexEWKB: Tspatial_as_hexewkb
  arrsyms:
    asText: Spatialarr_as_text
    asEWKT: Spatialarr_as_ewkt
  blocks:
  - lit: "/*****************************************************************************\n   * Input/output from (E)WKT, (E)WKB, HexEWKB, and MFJSON representation\n   *****************************************************************************/"
  - ops:
    - FromText
    - FromEWKT
    - FromMFJSON
  - lit: "CREATE FUNCTION tposeFromGeoPose(text)\n  RETURNS tpose\n  AS 'MODULE_PATHNAME', 'Tpose_from_geopose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\n-- conformance:      0 = Basic-Quaternion (default), 1 = Basic-YPR, 2 = Advanced\n-- maxdecimaldigits: significant digits to keep; -1 = lossless\nCREATE FUNCTION asGeoPose(tpose, conformance integer DEFAULT 0,\n    maxdecimaldigits integer DEFAULT -1)\n  RETURNS text\n  AS 'MODULE_PATHNAME', 'Tpose_as_geopose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\n-- A stream written as one document: the header that opens it and every\n-- element it carries.\nCREATE FUNCTION asGeoPoseStream(tpose, maxdecimaldigits integer DEFAULT -1)\n  RETURNS text\n  AS 'MODULE_PATHNAME', 'Tpose_as_geopose_stream'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\nCREATE FUNCTION applyPose(geometry, tpose)\n  RETURNS tgeompoint\n  AS 'MODULE_PATHNAME', 'Tpose_apply_geo'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\n-- A frame that moves carries what it names through the whole of its\n-- movement, and a body that moves is carried into the frame it is read in.\nCREATE FUNCTION applyPose(pose, tpose)\n  RETURNS tpose\n  AS 'MODULE_PATHNAME', 'Pose_apply_tpose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\nCREATE FUNCTION applyPose(tpose, pose)\n  RETURNS tpose\n  AS 'MODULE_PATHNAME', 'Tpose_apply_pose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\nCREATE FUNCTION applyPose(tpose, tpose)\n  RETURNS tpose\n  AS 'MODULE_PATHNAME', 'Tpose_apply_tpose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\nCREATE FUNCTION poseInverse(tpose)\n  RETURNS tpose\n  AS 'MODULE_PATHNAME', 'Tpose_inverse'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;"
  - ops:
    - FromBinary
    - FromEWKB
    - FromHexEWKB
  - lit: /*****************************************************************************/
  - ops:
    - asText
    - asEWKT
    - asMFJSON
    - asBinary
    - asEWKB
    - asHexWKB
    - asHexEWKB
- family: posechain
  file: mobilitydb/sql/posechain/552_tposechain.in.sql
  reference: true
  begin: "\n   * Input/output from (E)WKT, (E)WKB, HexEWKB, and MFJSON representation\n"
  end: "\n * Constructors\n"
  temps:
  - temp: tposechain
    maxdd: true
  syms:
    FromText: Tspatial_from_ewkt
    FromEWKT: Tspatial_from_ewkt
    asText: Tspatial_as_text
    asEWKT: Tspatial_as_ewkt
    asEWKB: Tspatial_as_ewkb
    asHexEWKB: Tspatial_as_hexewkb
  arrsyms:
    asText: Spatialarr_as_text
    asEWKT: Spatialarr_as_ewkt
  blocks:
  - lit: "/*****************************************************************************\n   * Input/output from (E)WKT, (E)WKB, HexEWKB, and MFJSON representation\n   *****************************************************************************/"
  - ops:
    - FromText
    - FromEWKT
    - FromMFJSON
  - lit: "CREATE FUNCTION tposechainFromGeoPose(text)\n  RETURNS tposechain\n  AS 'MODULE_PATHNAME', 'Tposechain_from_geopose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\n-- A Composite Chain document carries one valid time, so it is written\n-- from a single instant, and its frame chain holds at least two frames.\n-- maxdecimaldigits: significant digits to keep; -1 = lossless\nCREATE FUNCTION asGeoPose(tposechain, maxdecimaldigits integer DEFAULT -1)\n  RETURNS text\n  AS 'MODULE_PATHNAME', 'Tposechain_as_geopose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\n\n-- A Composite Graph document is a set of pose chains sharing their outermost\n-- frame, so it is written from chains read at one and the same instant, and\n-- its frame list holds at least two frames.\nCREATE FUNCTION asGeoPose(tposechain[], maxdecimaldigits integer DEFAULT -1)\n  RETURNS text\n  AS 'MODULE_PATHNAME', 'Tposechainarr_as_geopose'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;"
  - ops:
    - FromBinary
    - FromEWKB
    - FromHexEWKB
  - lit: /*****************************************************************************/
  - ops:
    - asText
    - asEWKT
    - asMFJSON
    - asBinary
    - asEWKB
    - asHexWKB
    - asHexEWKB
- family: pointcloud
  file: mobilitydb/sql/pointcloud/420_tpcpoint.in.sql
  reference: true
  begin: "\n * WKB / HexWKB helpers\n"
  end: "\n * Ergonomic pcpoint constructors\n"
  temps:
  - temp: tpcpoint
    mfjson_maxdd: true
  syms:
    asText: Temporal_as_text
  arrsyms:
    asText: Temporalarr_as_text
  blocks:
  - lit: "/******************************************************************************\n * WKB / HexWKB helpers\n ******************************************************************************/"
  - ops:
    - - FromBinary
      - FromHexWKB
      - asBinary
      - asHexWKB
      - lit: '-- asMFJSON is output-only: the JSON form summarises a tpcpoint by

          -- (coordinates, datetimes) without carrying the schema (pcid + dim

          -- layout) needed to reconstruct the value, so a parse-back path is

          -- intentionally not exposed. Use asBinary / tpcpointFromBinary or

          -- asHexWKB / tpcpointFromHexWKB for round-trip.'
      - asMFJSON
    - - lit: '-- asText takes no maxdecimaldigits argument: a pcpoint prints as the hex-WKB

          -- of its serialized form, which has no decimal places to round. This mirrors

          -- th3index, the other spatial temporal type whose base value has no

          -- coordinate text form.'
      - asText
  - lit: CREATE CAST (tpcpoint AS text) WITH FUNCTION asText(tpcpoint);
- family: pointcloud_patch
  file: mobilitydb/sql/pointcloud/430_tpcpatch.in.sql
  reference: true
  begin: "\n * WKB / HexWKB helpers\n"
  end: "\n * Ergonomic pcpatch constructor\n"
  temps:
  - temp: tpcpatch
    mfjson_maxdd: true
  syms:
    asText: Temporal_as_text
  arrsyms:
    asText: Temporalarr_as_text
  blocks:
  - lit: "/******************************************************************************\n * WKB / HexWKB helpers\n ******************************************************************************/"
  - ops:
    - - FromBinary
      - FromHexWKB
      - asBinary
      - asHexWKB
      - lit: '-- asMFJSON is output-only: the JSON form summarises a tpcpatch by

          -- (pcid, npoints, bounds) per instant without carrying the per-point

          -- payload, so a parse-back path is intentionally not exposed. Use

          -- asBinary / tpcpatchFromBinary or asHexWKB / tpcpatchFromHexWKB for

          -- round-trip.'
      - asMFJSON
    - - lit: '-- asText takes no maxdecimaldigits argument: a pcpatch prints as the hex-WKB

          -- of its serialized form, which has no decimal places to round. This mirrors

          -- th3index, the other spatial temporal type whose base value has no

          -- coordinate text form.'
      - asText
  - lit: CREATE CAST (tpcpatch AS text) WITH FUNCTION asText(tpcpatch);
- family: tpoint
  file: mobilitydb/sql/geo/053_tpoint_inout.in.sql
  reference: true
  whole_file: true
  begin: "\n * Input\n"
  temps:
  - temp: tgeompoint
    maxdd: true
  - temp: tgeogpoint
    maxdd: true
  syms:
    FromText: Tpoint_from_ewkt
    FromEWKT: Tpoint_from_ewkt
    asText: Tspatial_as_text
    asEWKT: Tspatial_as_ewkt
    asEWKB: Tspatial_as_ewkb
    asHexEWKB: Tspatial_as_hexewkb
  arrsyms:
    asText: Spatialarr_as_text
    asEWKT: Spatialarr_as_ewkt
  blocks:
  - lit: "/*****************************************************************************\n * Input\n *****************************************************************************/"
  - ops:
    - FromText
    - FromEWKT
    - FromMFJSON
    - FromBinary
    - FromEWKB
    - FromHexEWKB
  - lit: "/*****************************************************************************\n * Output\n *****************************************************************************/"
  - ops:
    - asText
  - lit: "CREATE FUNCTION asText(geometry[], maxdecimaldigits integer DEFAULT 15)\n  RETURNS text[]\n  AS 'MODULE_PATHNAME', 'Spatialarr_as_text'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\nCREATE FUNCTION asText(geography[], maxdecimaldigits integer DEFAULT 15)\n  RETURNS text[]\n  AS 'MODULE_PATHNAME', 'Spatialarr_as_text'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;"
  - ops:
    - asEWKT
  - lit: "-- Single base geometry/geography EWKT. In the PostgreSQL extension this rewrites\n-- to PostGIS ST_AsEWKT; the standalone MEOS library and the generated bindings\n-- back the same asEWKT(geometry) surface with the geo_as_ewkt() kernel. Together\n-- with transform(geometry, integer) this lets one portable generator/suite use\n-- MobilityDB names (asEWKT, transform) instead of PostGIS-only ST_AsEWKT/ST_Transform.\nCREATE FUNCTION asEWKT(geometry, maxdecimaldigits integer DEFAULT 15)\n  RETURNS text\n  AS 'SELECT @extschema@.ST_AsEWKT($1, $2)'\n  LANGUAGE SQL IMMUTABLE STRICT PARALLEL SAFE;\nCREATE FUNCTION asEWKT(geography, maxdecimaldigits integer DEFAULT 15)\n  RETURNS text\n  AS 'SELECT @extschema@.ST_AsEWKT($1, $2)'\n  LANGUAGE SQL IMMUTABLE STRICT PARALLEL SAFE;\n\nCREATE FUNCTION asEWKT(geometry[], maxdecimaldigits integer DEFAULT 15)\n  RETURNS text[]\n  AS 'MODULE_PATHNAME', 'Spatialarr_as_ewkt'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;\nCREATE FUNCTION asEWKT(geography[], maxdecimaldigits integer DEFAULT 15)\n  RETURNS text[]\n  AS 'MODULE_PATHNAME', 'Spatialarr_as_ewkt'\n  LANGUAGE C IMMUTABLE STRICT PARALLEL SAFE;"
  - ops:
    - asMFJSON
    - asBinary
    - asEWKB
  - ops:
    - - lit: "-- asHexWKB: base hex-WKB (variant 0, no SRID) \u2014 portable RFC #861 name,\n-- byte-for-byte identical to MobilityDuck asHexWKB and MobilitySpark asHexWKB."
      - asHexWKB
    - - lit: "-- asHexEWKB: extended hex-WKB (WKB_EXTENDED flag, includes SRID) \u2014\n-- mirrors asEWKB() and is consistent with MobilityDuck asHexEWKB."
      - asHexEWKB
  - lit: /*****************************************************************************/
