name: Test MEOS compilation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/meos.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'tools/codegen/gen_smoketest/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages
  pull_request:
    paths:
      - '.github/workflows/meos.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'tools/codegen/gen_smoketest/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev \
            libgdal-dev \
            libh3-dev \
            libxml2-dev \
            zlib1g-dev

      - name: Build
        run: |
          mkdir build
          cd build
          # ALL enables every optional family, so a family added later is
          # covered here without editing this workflow: the list in
          # CMakeLists.txt decides, not this line. The families carrying an
          # external dependency take it from the packages installed above,
          # H3 from libh3, RASTER from GDAL, POINTCLOUD from libxml2 + zlib.
          cmake -DCMAKE_BUILD_TYPE=Debug -DMEOS=on -DALL=on ..
          make -j $(nproc)
          sudo make install

      - name: Compile and run 01_hello_world.c
        run: |
          cd meos/examples
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o 01_hello_world 01_hello_world.c -L/usr/local/lib -lmeos
          ./01_hello_world

      - name: Compile and run meos/test
        run: |
          cd meos/test
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          # SIBLING-FROM bool_test (same compile+run idiom)
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o allocator_test allocator_test.c -L/usr/local/lib -lmeos
          ./allocator_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o bool_test bool_test.c -L/usr/local/lib -lmeos
          ./bool_test
          # The tcbuffer test program is generated from the installed headers
          # (gen_smoketest.py introspects meos_cbuffer.h) so it tracks the current
          # API. Regenerate and compile it here; the CBUFFER family is built and
          # installed above.
          python3 ../../tools/codegen/gen_smoketest/gen_smoketest.py tcbuffer
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tcbuffer_smoketest tcbuffer_smoketest.c -L/usr/local/lib -lmeos -lm
          ./tcbuffer_smoketest
          # The tgeometry test program is generated from the installed headers
          # (gen_smoketest.py introspects meos_geo.h) so it tracks the current
          # API. Regenerate and compile it here; the geo type is built and
          # installed above.
          python3 ../../tools/codegen/gen_smoketest/gen_smoketest.py tgeometry
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tgeometry_smoketest tgeometry_smoketest.c -L/usr/local/lib -lmeos -lm
          ./tgeometry_smoketest
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o json_test json_test.c -L/usr/local/lib -lmeos
          ./json_test
          # The tjsonb test program is generated from the installed headers
          # (gen_smoketest.py introspects meos_json.h) so it tracks the current
          # API. Regenerate and compile it here; the JSON family is built and
          # installed above.
          python3 ../../tools/codegen/gen_smoketest/gen_smoketest.py tjsonb
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tjsonb_smoketest tjsonb_smoketest.c -L/usr/local/lib -lmeos -lm
          ./tjsonb_smoketest
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o error_test error_test.c -L/usr/local/lib -lmeos
          ./error_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o merge_test merge_test.c -L/usr/local/lib -lmeos
          ./merge_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o geo_test geo_test.c -L/usr/local/lib -lmeos
          ./geo_test
          # The raster input and output functions are the only way a caller
          # outside PostgreSQL reaches a Raster, so they are exercised here
          # rather than through the PostgreSQL suite. The RASTER family is
          # built and installed above.
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o raster_test raster_test.c -L/usr/local/lib -lmeos
          ./raster_test
          # What a program with no pgPointCloud catalog can do with a point
          # cloud value, and what it cannot, is a property only a program
          # outside PostgreSQL can check: the PostgreSQL suite always has the
          # catalog. The POINTCLOUD family is built and installed above.
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tpointcloud_test tpointcloud_test.c -L/usr/local/lib -lmeos
          ./tpointcloud_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o geopose_test geopose_test.c -L/usr/local/lib -lmeos
          ./geopose_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o numeric_test numeric_test.c -L/usr/local/lib -lmeos
          ./numeric_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o setspan_test setspan_test.c -L/usr/local/lib -lmeos
          ./setspan_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbox_test tbox_test.c -L/usr/local/lib -lmeos
          ./tbox_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o temporal_test temporal_test.c -L/usr/local/lib -lmeos
          ./temporal_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o text_test text_test.c -L/usr/local/lib -lmeos
          ./text_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o time_test time_test.c -L/usr/local/lib -lmeos
          ./time_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o typeof_test typeof_test.c -L/usr/local/lib -lmeos
          ./typeof_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o parse_test parse_test.c -L/usr/local/lib -lmeos
          ./parse_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o trgeo_test trgeo_test.c -L/usr/local/lib -lmeos -lm
          ./trgeo_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o rtree_mest_test rtree_mest_test.c -L/usr/local/lib -lmeos -lm
          ./rtree_mest_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o rtree_knn_test rtree_knn_test.c -L/usr/local/lib -lmeos -lm
          ./rtree_knn_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o rtree_load_test rtree_load_test.c -L/usr/local/lib -lmeos -lm
          ./rtree_load_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o sptree_load_test sptree_load_test.c -L/usr/local/lib -lmeos -lm
          ./sptree_load_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o index_position_test index_position_test.c -L/usr/local/lib -lmeos -lm
          ./index_position_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o rtree_join_test rtree_join_test.c -L/usr/local/lib -lmeos -lm
          ./rtree_join_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o sptree_join_test sptree_join_test.c -L/usr/local/lib -lmeos -lm
          ./sptree_join_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o setset_pairs_test setset_pairs_test.c -L/usr/local/lib -lmeos -lm
          ./setset_pairs_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o rtree_span_test rtree_span_test.c -L/usr/local/lib -lmeos -lm
          ./rtree_span_test
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o sptree_test sptree_test.c -L/usr/local/lib -lmeos -lm
          ./sptree_test

  threaded:
    name: Thread-safety (TSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev

      # Build MEOS with ThreadSanitizer instrumentation. The shared
      # module is linked with -fsanitize=thread so every load of the
      # MEOS_TLS-qualified globals is checked for races.
      - name: Build MEOS with TSan
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DMEOS=on \
            -DCMAKE_C_FLAGS="-fsanitize=thread" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            ..
          make -j $(nproc)
          sudo make install

      - name: Build threaded_test under TSan
        run: |
          cd meos/test
          gcc -Wall -g -O1 -fsanitize=thread \
            -I/usr/local/include -pthread \
            -o threaded_test threaded_test.c \
            -L/usr/local/lib -lmeos

      # Halt-on-error so the job fails on the first reported race.
      - name: Run threaded_test under TSan
        run: |
          cd meos/test
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          export TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1"
          ./threaded_test 8 5000

  static:
    name: Self-contained static library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev

      # Install into a local prefix rather than /usr/local, so the link test
      # below cannot silently resolve against a system-installed libmeos.
      - name: Build the static library
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DMEOS=on -DCBUFFER=on -DJSON=on \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build -j $(nproc)
          cmake --install build

      - name: Check that the archive, and only the archive, is installed
        run: |
          test -f prefix/lib/libmeos.a || { echo "libmeos.a was not installed"; exit 1; }
          if ls prefix/lib/libmeos.so* prefix/lib/libmeos.dylib 2>/dev/null | grep -q .; then
            echo "a shared libmeos was installed by a BUILD_SHARED_LIBS=OFF build"
            exit 1
          fi

      # The invariant this job exists to protect: a downstream module that links
      # the archive must be self-contained. A consumer that ships one loadable
      # file (a DuckDB extension, a Python wheel) has nowhere to put a sidecar
      # libmeos, so any residual dependency on one makes the artifact unloadable
      # on every machine except the one that built it.
      - name: Link a shared module against the archive and run it
        run: |
          cat > module.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <meos.h>
          int mod_entry(void);
          int mod_entry(void)
          {
            meos_initialize();
            Temporal *temp = tint_in("[1@2000-01-01, 3@2000-01-03]");
            if (! temp) { printf("parse failed\n"); return 1; }
            char *str = tint_out(temp);
            printf("%s\n", str);
            free(str); free(temp);
            meos_finalize();
            return 0;
          }
          EOF
          cat > loader.c <<'EOF'
          #include <stdio.h>
          #include <dlfcn.h>
          int main(int argc, char **argv)
          {
            void *handle = dlopen(argv[1], RTLD_NOW);
            if (! handle) { printf("dlopen failed: %s\n", dlerror()); return 1; }
            int (*entry)(void) = dlsym(handle, "mod_entry");
            if (! entry) { printf("dlsym failed: %s\n", dlerror()); return 1; }
            return entry();
          }
          EOF
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          gcc -shared -fPIC -Wall -Werror -o module.so module.c \
            $(pkg-config --cflags meos) $(pkg-config --static --libs meos)
          gcc -o loader loader.c -ldl
          if readelf -d module.so | grep libmeos; then
            echo "the module still depends on a shared libmeos"
            exit 1
          fi
          ./loader ./module.so
