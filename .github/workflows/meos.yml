name: Test MEOS compilation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/meos.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'tools/codegen/gen_smoketest/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages
  pull_request:
    paths:
      - '.github/workflows/meos.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'tools/codegen/gen_smoketest/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev \
            libgdal-dev \
            libh3-dev \
            libxml2-dev \
            zlib1g-dev

      - name: Build
        run: |
          mkdir build
          cd build
          # ALL enables every optional family, so a family added later is
          # covered here without editing this workflow: the list in
          # CMakeLists.txt decides, not this line. The families carrying an
          # external dependency take it from the packages installed above,
          # H3 from libh3, RASTER from GDAL, POINTCLOUD from libxml2 + zlib.
          cmake -DCMAKE_BUILD_TYPE=Debug -DMEOS=on -DALL=on ..
          make -j $(nproc)
          sudo make install

      - name: Compile and run 01_hello_world.c
        run: |
          cd meos/examples
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o 01_hello_world 01_hello_world.c -L/usr/local/lib -lmeos
          ./01_hello_world

      - name: Compile and run meos/test
        run: |
          cd meos/test
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          # Every *_test.c program under meos/test is a check of the installed
          # library, and one that is compiled nowhere is a check nobody makes: it
          # keeps calling whatever it called when it was written while the
          # surface moves under it. The programs are the ones git tracks here,
          # so a test runs the day it lands with no edit to this step, and a
          # generated smoke suite that shares the suffix is never picked up.
          # Each program is named before it runs, so a failure names it, and
          # the count carries a floor, so a deleted test reddens the step
          # instead of shrinking it in silence.
          found=0
          for f in $(git ls-files -- '*_test.c'); do
            t="${f%.c}"
            echo "./$t"
            gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o "$t" "$f" -L/usr/local/lib -lmeos -lm
            "./$t"
            found=$((found + 1))
          done
          echo "$found meos/test program(s) ran"
          if [ "$found" -lt "${MEOS_TEST_FLOOR:-61}" ]; then
            echo "::error::$found meos/test program(s), below the floor of ${MEOS_TEST_FLOOR:-61}"
            exit 1
          fi
          # The programs below read the tables the PostgreSQL suite loads, in
          # the CSV form tools/gen_test_csv.py writes from the same archives,
          # so the two suites answer their queries over one set of fixtures
          python3 ../../tools/gen_test_csv.py
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_geometry_read tbl_geometry_read.c -L/usr/local/lib -lmeos -lm
          ./tbl_geometry_read
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_value_value tbl_value_value.c -L/usr/local/lib -lmeos -lm
          ./tbl_value_value
          # The program reads the fixture it is given and takes the type from
          # its name, so the loop covers every temporal table the archives
          # carry, including the ones a family adds later
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_temporal tbl_temporal.c -L/usr/local/lib -lmeos -lm
          for f in csv/tbl_t*.csv; do ./tbl_temporal "$f" > /dev/null; done
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_temporal_value tbl_temporal_value.c -L/usr/local/lib -lmeos -lm
          ./tbl_temporal_value
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_temporal_temporal tbl_temporal_temporal.c -L/usr/local/lib -lmeos -lm
          ./tbl_temporal_temporal
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_tpoint tbl_tpoint.c -L/usr/local/lib -lmeos -lm
          ./tbl_tpoint
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_tpoint_geo tbl_tpoint_geo.c -L/usr/local/lib -lmeos -lm
          ./tbl_tpoint_geo
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_tpoint_tpoint tbl_tpoint_tpoint.c -L/usr/local/lib -lmeos -lm
          ./tbl_tpoint_tpoint
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_tgeo_tgeo tbl_tgeo_tgeo.c -L/usr/local/lib -lmeos -lm
          ./tbl_tgeo_tgeo
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_tcbuffer_geometry tbl_tcbuffer_geometry.c -L/usr/local/lib -lmeos -lm
          ./tbl_tcbuffer_geometry
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o tbl_tcbuffer_tcbuffer tbl_tcbuffer_tcbuffer.c -L/usr/local/lib -lmeos -lm
          ./tbl_tcbuffer_tcbuffer
          # The DE-9IM harness reaches the engine through the public geom_relate,
          # so it builds against the installed library like every program here
          gcc -Wall -Werror=implicit-function-declaration -g -I/usr/local/include -o relate_diff relate_diff.c -L/usr/local/lib -lmeos -lm
          ./relate_diff < relate_corpus.txt
          ./relate_diff < relate_corpus_types.txt

  threaded:
    name: Thread-safety (TSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev

      # Build MEOS with ThreadSanitizer instrumentation. The shared
      # module is linked with -fsanitize=thread so every load of the
      # MEOS_TLS-qualified globals is checked for races.
      - name: Build MEOS with TSan
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DMEOS=on \
            -DCMAKE_C_FLAGS="-fsanitize=thread" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            ..
          make -j $(nproc)
          sudo make install

      - name: Build threaded_test under TSan
        run: |
          cd meos/test
          gcc -Wall -g -O1 -fsanitize=thread \
            -I/usr/local/include -pthread \
            -o threaded_test threaded_test.c \
            -L/usr/local/lib -lmeos

      # Halt-on-error so the job fails on the first reported race.
      - name: Run threaded_test under TSan
        run: |
          cd meos/test
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          export TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1"
          ./threaded_test 8 5000

  static:
    name: Self-contained static library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev \
            libgdal-dev \
            libh3-dev \
            libxml2-dev \
            zlib1g-dev \
            autoconf automake libtool

      # Install into a local prefix rather than /usr/local, so the link test
      # below cannot silently resolve against a system-installed libmeos.
      - name: Build the static library
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DMEOS=on -DALL=on \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build -j $(nproc)
          cmake --install build

      - name: Check that the archive, and only the archive, is installed
        run: |
          test -f prefix/lib/libmeos.a || { echo "libmeos.a was not installed"; exit 1; }
          if ls prefix/lib/libmeos.so* prefix/lib/libmeos.dylib 2>/dev/null | grep -q .; then
            echo "a shared libmeos was installed by a BUILD_SHARED_LIBS=OFF build"
            exit 1
          fi

      # The invariant this job exists to protect: a downstream module that links
      # the archive must be self-contained. A consumer that ships one loadable
      # file (a DuckDB extension, a Python wheel) has nowhere to put a sidecar
      # libmeos, so any residual dependency on one makes the artifact unloadable
      # on every machine except the one that built it.
      - name: Link a shared module against the archive and run it
        run: |
          cat > module.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <meos.h>
          int mod_entry(void);
          int mod_entry(void)
          {
            meos_initialize();
            Temporal *temp = tint_in("[1@2000-01-01, 3@2000-01-03]");
            if (! temp) { printf("parse failed\n"); return 1; }
            char *str = tint_out(temp);
            printf("%s\n", str);
            free(str); free(temp);
            meos_finalize();
            return 0;
          }
          EOF
          cat > loader.c <<'EOF'
          #include <stdio.h>
          #include <dlfcn.h>
          int main(int argc, char **argv)
          {
            void *handle = dlopen(argv[1], RTLD_NOW);
            if (! handle) { printf("dlopen failed: %s\n", dlerror()); return 1; }
            int (*entry)(void) = dlsym(handle, "mod_entry");
            if (! entry) { printf("dlsym failed: %s\n", dlerror()); return 1; }
            return entry();
          }
          EOF
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          gcc -shared -fPIC -Wall -Werror -o module.so module.c \
            $(pkg-config --cflags meos) $(pkg-config --static --libs meos)
          gcc -o loader loader.c -ldl
          if readelf -d module.so | grep libmeos; then
            echo "the module still depends on a shared libmeos"
            exit 1
          fi
          ./loader ./module.so
