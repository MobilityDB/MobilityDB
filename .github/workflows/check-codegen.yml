name: Check codegen

# Verifies that the SQL and C emitted by the inherited-behaviour generator
# (tools/codegen/inherited) are in sync with its templates + manifest, so a
# hand edit to an emitted file or region — or a template change that was not
# re-emitted — cannot land unnoticed. The generator is deterministic, so
# regenerating and diffing is enough.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-codegen.yml'
      - 'tools/codegen/inherited/**'
      - 'mobilitydb/sql/**'
      - 'meos/src/temporal/temporal_rtree.c'
      - 'meos/src/temporal/temporal_sptree.c'
  pull_request:
    paths:
      - '.github/workflows/check-codegen.yml'
      - 'tools/codegen/inherited/**'
      - 'mobilitydb/sql/**'
      - 'meos/src/temporal/temporal_rtree.c'
      - 'meos/src/temporal/temporal_sptree.c'

permissions:
  contents: read

jobs:
  check-codegen:
    name: Inherited SQL generator is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate the inherited SQL
        run: python3 tools/codegen/inherited/generate.py

      - name: Fail if the emitted SQL or C is out of date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Emitted SQL or C is out of date. Run" \
                 "'python3 tools/codegen/inherited/generate.py' and commit the result."
            exit 1
          fi

      - name: Validate the reference family reproduces from the template
        run: python3 tools/codegen/inherited/generate.py --validate

      - name: Every SQL file is generator-governed or listed as an exception
        run: python3 tools/codegen/inherited/generate.py --coverage

      - name: Class membership matches the catalog predicates
        run: python3 tools/codegen/inherited/generate.py --classes
