name: Cppcheck

# Runs cppcheck with the build's real -I include paths (via
# compile_commands.json) and publishes the findings to GitHub's Code
# Scanning UI as inline PR annotations. This replaces Codacy's cppcheck,
# which can't be given the build's include paths and therefore drowns
# the finding list with `missingInclude` / `missingIncludeSystem`
# warnings on every #include of a project header.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cppcheck.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'meos/src/**'
      - 'meos/include/**'
      - 'mobilitydb/src/**'
      - 'mobilitydb/pg_include/**'
  pull_request:
    paths:
      - '.github/workflows/cppcheck.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'meos/src/**'
      - 'meos/include/**'
      - 'mobilitydb/src/**'
      - 'mobilitydb/pg_include/**'

# SARIF upload needs write access to Code Scanning alerts.
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  cppcheck:
    name: Cppcheck (with project include paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so that the step scoping the findings to the
          # lines a pull request changes finds the merge base with its base
          # branch.
          fetch-depth: 0

      - uses: ./.github/actions/apt-resilient

      - name: Add the PostgreSQL APT repository
        # Provides libh3-dev and the postgresql-server-dev package that the
        # vendored pgPointCloud build below needs for pg_config.
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt/ \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'

      - name: Install build dependencies and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cppcheck \
            libproj-dev \
            libgdal-dev \
            libjson-c-dev \
            libh3-dev \
            postgresql-server-dev-17 \
            autoconf automake libtool libxml2-dev zlib1g-dev
          cppcheck --version

      - name: Locate libh3 on disk and pin its paths
        # The pgdg libh3-dev package layout differs between releases; find the
        # header and library at runtime and pin -DH3_INCLUDE_DIR / -DH3_LIBRARY.
        run: |
          H3_INC=$(dpkg -L libh3-dev | grep -E 'h3api\.h$' | head -1)
          H3_LIB=$(dpkg -L libh3-dev libh3-1 2>/dev/null | grep -E 'libh3\.so$' | head -1)
          if [ -z "$H3_INC" ] || [ -z "$H3_LIB" ]; then
            find /usr -name 'h3api.h' 2>/dev/null
            find /usr -name 'libh3*' 2>/dev/null
            echo "::error::could not locate libh3 headers/library"
            exit 1
          fi
          echo "H3_INCLUDE_DIR=$(dirname "$H3_INC")" >> $GITHUB_ENV
          echo "H3_LIBRARY=$H3_LIB" >> $GITHUB_ENV

      - name: Configure (generate compile_commands.json)
        run: |
          mkdir build
          cd build
          # Enable every optional feature so all of their sources land in
          # compile_commands.json and get analysed. A plain -DMEOS=on build
          # excludes them, so cppcheck would otherwise never see that code.
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DMEOS=on \
                -DALL=on \
                -DH3_INCLUDE_DIR="$H3_INCLUDE_DIR" -DH3_LIBRARY="$H3_LIBRARY" ..

      - name: Run cppcheck (XML output - universally supported)
        # --project uses the same -I paths CMake records for the real
        # build, which is what makes the missingInclude noise vanish.
        # XML is preferred over --output-format=sarif because SARIF
        # support in cppcheck only landed in 2.13+; we convert XML to
        # SARIF ourselves in the next step so the job works regardless
        # of the runner's cppcheck version.
        run: |
          set -x
          cppcheck --version
          cppcheck \
            --project=build/compile_commands.json \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress='*:*/postgres/*' \
            --suppress='*:postgres/*' \
            --suppress='*:*/postgis/*' \
            --suppress='*:postgis/*' \
            --suppress='*:*/pgtypes/*' \
            --suppress='*:pgtypes/*' \
            --suppress='*:*/pointcloud-pg/*' \
            --suppress='*:pointcloud-pg/*' \
            --suppress='missingIncludeSystem' \
            --suppress='unmatchedSuppression' \
            --library=cppcheck-mobilitydb.cfg \
            --xml --xml-version=2 \
            -j "$(nproc)" \
            2> cppcheck.xml || true
          echo "--- cppcheck.xml (first 40 lines) ---"
          head -40 cppcheck.xml || true
          test -s cppcheck.xml

      - name: Convert cppcheck XML to SARIF
        run: |
          python3 <<'PYEOF' > cppcheck.sarif
          import sys, json, xml.etree.ElementTree as ET

          # Map cppcheck severities to SARIF level (note: cppcheck
          # uses "error"/"warning"/"style"/"performance"/"portability"
          # /"information"; SARIF has "error"/"warning"/"note"/"none").
          SEV = {
              "error":       "error",
              "warning":     "warning",
              "portability": "warning",
              "performance": "warning",
              "style":       "note",
              "information": "note",
          }

          root = ET.parse("cppcheck.xml").getroot()
          results = []
          rules   = {}

          # <errors><error id=... severity=... msg=...><location .../></error>
          for err in root.iter("error"):
              rid   = err.get("id") or "cppcheck"
              sev   = SEV.get(err.get("severity") or "", "warning")
              msg   = err.get("msg") or err.get("verbose") or rid
              rules[rid] = {
                  "id":   rid,
                  "name": rid,
                  "shortDescription": {"text": err.get("msg") or rid},
                  "defaultConfiguration": {"level": sev},
              }
              for loc in err.findall("location"):
                  # SARIF requires startLine/startColumn >= 1. cppcheck
                  # sometimes emits 0 (no-column-info sentinel); clamp.
                  start_line = max(1, int(loc.get("line") or 1))
                  start_col  = max(1, int(loc.get("column") or 1))
                  results.append({
                      "ruleId":  rid,
                      "level":   sev,
                      "message": {"text": msg},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": loc.get("file") or "unknown",
                              },
                              "region": {
                                  "startLine":   start_line,
                                  "startColumn": start_col,
                              },
                          },
                      }],
                  })

          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name":    "Cppcheck",
                          "version": "reported by cppcheck --version",
                          "informationUri": "https://cppcheck.sourceforge.io/",
                          "rules":   list(rules.values()),
                      },
                  },
                  "results": results,
              }],
          }
          json.dump(sarif, sys.stdout, indent=2)
          PYEOF
          echo "--- cppcheck.sarif (summary) ---"
          python3 -c "
          import json
          d = json.load(open('cppcheck.sarif'))
          res = d['runs'][0]['results']
          print(f'SARIF runs: {len(d[\"runs\"])}, results: {len(res)}')
          counts = {}
          for r in res:
              counts[r['level']] = counts.get(r['level'], 0) + 1
          for k, v in sorted(counts.items()):
              print(f'  {k}: {v}')
          "

      - name: Fail on critical-pattern findings
        # Cppcheck's per-pattern severity is fixed in its built-in
        # classification; we can't promote individual rules to "error"
        # via CLI flags. Instead, post-process cppcheck.xml: if any of
        # the patterns listed below appears in MEOS/MobilityDB code
        # (non-vendored), fail the job. This catches the bug classes
        # that PR #816 fixed (CastIntegerToAddressAtReturn, null
        # dereferences, uninit reads, mistaken `||` vs `&&`, etc.) at
        # the moment they're introduced rather than after they've
        # accumulated on master.
        run: |
          python3 <<'PYEOF'
          import sys, xml.etree.ElementTree as ET

          # Patterns we want to block on. Restricted to the high-precision
          # bug classes — cppcheck's flow-analysis-derived patterns
          # (knownConditionTrueFalse, redundantAssignment) have a high
          # false-positive rate on MEOS code and would block on legacy
          # patterns rather than introduced bugs.
          CRITICAL = {
              "CastIntegerToAddressAtReturn",
              "incorrectLogicOperator",
              "nullPointer",
              "nullPointerRedundantCheck",
              "uninitvar",
              "duplicateExpression",
              "resourceLeak",
              "returnDanglingLifetime",
          }

          # Vendored upstream — already excluded from cppcheck via the
          # --suppress flags, but defence-in-depth here in case a path
          # slips the suppress glob. Cppcheck sometimes reports paths
          # by basename (especially flex/bison-generated files), so we
          # also match a list of vendored basenames.
          VENDORED = ("postgres/", "postgis/", "pgtypes/", "h3-pg/", "pointcloud-pg/")
          VENDORED_BASENAMES = (
              # liblwgeom flex/bison-generated parsers
              "lwin_wkt_lex.c", "lwin_wkt_lex.l",
              "lwin_wkt_parse.c", "lwin_wkt_parse.y",
          )

          root = ET.parse("cppcheck.xml").getroot()
          violations = []
          for err in root.iter("error"):
              rid = err.get("id", "")
              if rid not in CRITICAL:
                  continue
              for loc in err.iter("location"):
                  path = loc.get("file", "")
                  # Strip leading absolute-path stem if any
                  norm = path.lstrip("/").replace("\\", "/")
                  for prefix in ("home/runner/work/MobilityDB/MobilityDB/",
                                 "github/workspace/"):
                      if norm.startswith(prefix):
                          norm = norm[len(prefix):]
                          break
                  if norm.startswith(VENDORED):
                      continue
                  # Also check basename in case cppcheck stripped path
                  # (happens for flex/bison-generated postgis files).
                  if norm.split("/")[-1] in VENDORED_BASENAMES:
                      continue
                  violations.append((
                      rid, norm, loc.get("line", "?"),
                      err.get("msg", "")[:140]))

          if violations:
              print(f"::error::cppcheck found {len(violations)} critical-pattern violations:")
              for rid, path, line, msg in violations:
                  print(f"::error file={path},line={line}::{rid}: {msg}")
              sys.exit(1)
          print(f"cppcheck: no critical-pattern violations in MEOS/MobilityDB code.")
          PYEOF

      - name: Fail on findings in the lines the pull request changes
        # Every finding of the enabled classes whose location lies in a line
        # the pull request adds or changes fails the job, vendored code
        # excluded as in the previous step. The lines are those of the diff
        # between the analysed merge commit and its merge base with the
        # pull request's own base branch, so that a pull request to a stable
        # branch is scoped against that branch. A push has no base to scope
        # against and is held to the critical patterns alone.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          echo "Lines changed since $MERGE_BASE, the merge base with $BASE_REF"
          git diff -U0 --no-color --no-ext-diff --diff-filter=ACMR \
            "$MERGE_BASE" HEAD > changed.diff
          python3 <<'PYEOF'
          import os, re, sys, xml.etree.ElementTree as ET

          # The classes the job enables, and "error", which cppcheck always
          # reports; "information" describes the run, not the code.
          SEVERITIES = {"error", "warning", "style", "performance", "portability"}
          VENDORED = ("postgres/", "postgis/", "pgtypes/", "h3-pg/", "pointcloud-pg/")
          VENDORED_BASENAMES = (
              "lwin_wkt_lex.c", "lwin_wkt_lex.l",
              "lwin_wkt_parse.c", "lwin_wkt_parse.y",
          )

          # File -> the (first, last) line ranges the diff adds or changes;
          # an added file is one range covering the whole file.
          HUNK = re.compile(r"^@@ -\S+ \+(\d+)(?:,(\d+))? @@")
          changed = {}
          path = None
          with open("changed.diff", encoding="utf-8", errors="replace") as f:
              for line in f:
                  if line.startswith("+++ "):
                      target = line[4:].rstrip("\n")
                      path = target[2:] if target.startswith("b/") else None
                      continue
                  m = HUNK.match(line)
                  if m and path:
                      first = int(m.group(1))
                      count = 1 if m.group(2) is None else int(m.group(2))
                      if count > 0:
                          changed.setdefault(path, []).append(
                              (first, first + count - 1))

          workspace = os.environ["GITHUB_WORKSPACE"].rstrip("/") + "/"

          def normalize(file):
              norm = file.replace("\\", "/")
              if norm.startswith(workspace):
                  norm = norm[len(workspace):]
              while norm.startswith("./"):
                  norm = norm[2:]
              return norm

          def in_changed(file, line):
              return any(a <= line <= b for a, b in changed.get(file, ()))

          root = ET.parse("cppcheck.xml").getroot()
          findings = []
          for err in root.iter("error"):
              if err.get("severity", "") not in SEVERITIES:
                  continue
              for loc in err.iter("location"):
                  file = normalize(loc.get("file", ""))
                  if not file or file.startswith(VENDORED) or \
                     file.split("/")[-1] in VENDORED_BASENAMES:
                      continue
                  line = int(loc.get("line") or 0)
                  if in_changed(file, line):
                      findings.append((err.get("id", ""), file, line,
                                       err.get("msg", "")[:200]))
                      break

          nranges = sum(len(r) for r in changed.values())
          print(f"cppcheck: {nranges} changed line ranges over "
                f"{len(changed)} files")
          if findings:
              print(f"::error::cppcheck found {len(findings)} findings in "
                    f"the lines this pull request changes:")
              for rid, file, line, msg in findings:
                  print(f"::error file={file},line={line}::{rid}: {msg}")
              sys.exit(1)
          print("cppcheck: no finding in the lines this pull request changes.")
          PYEOF

      - name: Upload SARIF to GitHub Code Scanning
        # Runs even if the previous step failed, so reviewers can see
        # the inline annotations on the PR alongside the build failure.
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck

      - name: Attach SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-sarif
          path: cppcheck.sarif
          retention-days: 30
