# Automatic generation of documentation will be copied and checked into the
# gh-pages branch.
name: Generate MobilityDB documentation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate_docs.yml'
      - '.github/actions/apt-resilient/**'
      - 'doc/**'
    branches:
      - 'master'
      - 'stable-[0-9]+.[0-9]+'

jobs:
  build:
    name: Generate documentation
    runs-on: ubuntu-latest

    steps:
      # checkout branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The job builds the manual from doc/ and runs the local apt-resilient action, which is
          # read from the checkout: both paths belong in the sparse set.
          sparse-checkout: |
            doc
            .github

      # Install dblatex
      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dblatex dbtoepub xsltproc texlive-lang-spanish

      # generate the documentation files
      - name: Generate English documentation
        run: |
          cd doc
          dblatex -s texstyle.sty -o mobilitydb-manual.pdf mobilitydb-manual.xml
          # EPUB 3, whose HTML5 content keeps the @start attribute a continued
          # list needs. The EPUB 2 content is XHTML 1.1, which has no @start,
          # so a list carrying continuation="continues" restarts its numbering.
          dbtoepub -s /usr/share/xml/docbook/stylesheet/docbook-xsl/epub3/chunk.xsl -o mobilitydb-manual.epub mobilitydb-manual.xml
          xsltproc --stringparam html.stylesheet "docbook.css" --stringparam chunker.output.encoding "UTF-8" --xinclude -o index.html /usr/share/xml/docbook/stylesheet/docbook-xsl/html/chunk.xsl mobilitydb-manual.xml

      # generate the documentation files
      - name: Generate Spanish documentation
        run: |
          cd doc
          dblatex -s texstyle.sty -o es/mobilitydb-manual.pdf es/mobilitydb-manual.xml
          # The Spanish chapters reach the figures as ../images, which an .epub
          # container has no way to express, so the packager drops every figure.
          # Build the .epub from a tree where the figures sit beside the
          # chapters, as they do for English.
          rm -rf epub-es
          mkdir epub-es
          cp es/*.xml epub-es/
          cp -r images epub-es/images
          sed -i 's|\.\./images/|images/|g' epub-es/*.xml
          dbtoepub -s /usr/share/xml/docbook/stylesheet/docbook-xsl/epub3/chunk.xsl -o es/mobilitydb-manual.epub epub-es/mobilitydb-manual.xml
          rm -rf epub-es
          xsltproc --stringparam html.stylesheet "docbook.css" --stringparam chunker.output.encoding "UTF-8" --xinclude -o es/index.html /usr/share/xml/docbook/stylesheet/docbook-xsl/html/chunk.xsl es/mobilitydb-manual.xml
          cp docbook.css es/

      # store the documentation files
      - name: Upload output directory
        uses: actions/upload-artifact@v4
        with:
          name: doc-files
          path: |
            doc/images/*
            doc/mobilitydb-manual.pdf
            doc/mobilitydb-manual.epub
            doc/docbook.css
            doc/*.html
            doc/es/mobilitydb-manual.pdf
            doc/es/mobilitydb-manual.epub
            doc/es/docbook.css
            doc/es/*.html
          retention-days: 1


  copy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    needs: build
    # Serialize gh-pages deploys across both doc workflows: each merge to
    # master triggers a doc build, and two concurrent runs pushing to the
    # shared gh-pages branch make the loser fail non-fast-forward. A common
    # concurrency group makes the deploy jobs run one at a time.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      # checkout the gh-pages branch
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      # download the doc files, most of which are generated above
      - name: Download output directory
        uses: actions/download-artifact@v4
        with:
          name: doc-files
          path: docs-temp

      # Rename the directory to branch name
      - name: Rename the directory to branch name
        run: |
          rm -rf ${{ github.ref_name }}
          mv docs-temp ${{ github.ref_name }}

      # add, commit and push to gh-pages
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Update docs'
          default_author: github_actions
