name: Check code

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/check-code.yml'
      - '.github/actions/apt-resilient/**'
      - 'datagen/**'
      - 'doc/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'tools/**'
      - 'LICENSE.txt'
    branches-ignore:
      - gh-pages

jobs:
  portable_aliases_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Portable-operator coverage (every operator classified; 0 unclassified)
        run: python3 tools/codegen/portable_aliases/generate.py --check

  int64_check:
    name: int64 vs int64_t header convention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject int64_t / uint64_t in MobilityDB public headers
        run: ./tools/scripts/check_int64_in_headers.sh

  doxygen_briefs_check:
    name: Every @brief states text, once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject an empty or repeated @brief
        run: python3 tools/scripts/check_doxygen_briefs.py

  license_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/apt-resilient

      - name: Install Requirements
        run: |
          sudo apt install -y licensecheck
      - name: Run License Check
        run: ./tools/scripts/test_license.sh

  csqlfn_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check @csqlfn derivation links
        run: python3 tools/scripts/check_csqlfn.py --gaps
      - name: Check every wrapper a @csqlfn tag backs is named
        run: python3 tools/scripts/check_csqlfn.py --complete
      - name: Check every wrapper a @csqlfn tag names is one the SQL reaches
        run: python3 tools/scripts/check_csqlfn.py --targets
      - name: Check a SQL signature is answered by one return type
        run: python3 tools/scripts/check_csqlfn.py --returns

  spatialrel_orthogonality_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check spatial-relationship (geo x tgeo) grid completeness
        run: python3 tools/scripts/check_spatialrel_orthogonality.py

  btree_gist_operator_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject <-> operators that btree_gist owns
        run: python3 tools/scripts/check_btree_gist_operators.py

  opclass_member_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Report a bounding-box operator no index of its type answers
        run: python3 tools/scripts/check_opclass_members.py

  meos_only_files_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check that MEOS-only code is selected by file, not by #if MEOS
        run: python3 tools/scripts/check_meos_only_files.py

  error_sentinels_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check that every error sentinel is the maximum of the return type
        run: python3 tools/scripts/check_error_sentinels.py

  fixture_dates_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject a test or manual value dated on the PostgreSQL epoch year
        run: python3 tools/scripts/check_fixture_dates.py

  liblwgeom_geos_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check that no new call reaches GEOS through the vendored library
        run: python3 tools/scripts/check_liblwgeom_geos.py

  dispatch_default_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check that a dispatch on a type rejects a type it does not handle
        run: python3 tools/scripts/check_dispatch_default.py

  binding_io_ownership_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject types MEOS parses that MobilityDB does not declare
        run: python3 tools/scripts/check_binding_io_ownership.py

  templatetypes_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check that the templatetypes table documents the type catalog
        run: python3 tools/scripts/check_templatetypes_doc.py

  geopose_conformance_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate the GeoPose documents against the OGC schemas
        run: python3 tools/scripts/check_geopose_conformance.py

  sqlfn_names_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check that every @sqlfn tag names a surface the extension builds
        run: python3 tools/scripts/check_sqlfn_names.py
