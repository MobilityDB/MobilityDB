name: MEOS smoke tests (valgrind)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/meos-smoke.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'pgtypes/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages
  push:
    paths:
      - '.github/workflows/meos-smoke.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'pgtypes/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages

jobs:
  smoke:
    name: Smoke + valgrind
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev \
            libgdal-dev \
            libh3-dev \
            libxml2-dev \
            zlib1g-dev \
            valgrind

      - name: Build and install MEOS
        run: |
          mkdir build
          cd build
          # ALL enables every optional family, as in meos.yml, so a family added
          # later is smoke-tested here without editing this workflow: the list in
          # CMakeLists.txt decides. A family left out installs no public header,
          # and the suite generated from that header is then skipped in silence
          cmake -DCMAKE_BUILD_TYPE=Debug -DMEOS=on -DALL=on ..
          make -j $(nproc)
          sudo make install
          sudo ldconfig

      - name: Regenerate smoke suites and run under valgrind
        run: |
          export MEOS_INCLUDE_DIR=/usr/local/include
          export MEOS_BUILD_DIR=/usr/local/lib
          ./meos/test/run_smoketests.sh

      # Building an index from a whole entry set releases the nodes the index
      # holds, which the assertions cannot see and only a leak check reports.
      # A test of that kind is named meos/test/*_load_test.c and is DISCOVERED
      # here rather than listed, so adding one needs no edit to this workflow --
      # the rule the build step above already states for families, and the one
      # run_smoketests.sh follows for its smoke/*.json sidecars. Naming them
      # meant a test dropped into meos/test/ got no leak check and nothing said
      # so. A glob matching nothing is a step that checks nothing, so the count
      # carries a floor rather than passing quietly.
      - name: Run the leak-checked tests under valgrind
        run: |
          cd meos/test
          found=0
          for src in *_load_test.c; do
            [ -e "$src" ] || continue
            t="${src%.c}"
            echo "[valgrind] $t"
            gcc -Wall -Werror=implicit-function-declaration -g \
              -I/usr/local/include -o $t $src -L/usr/local/lib -lmeos -lm
            valgrind --leak-check=full --errors-for-leak-kinds=definite \
              --error-exitcode=1 ./$t
            found=$((found + 1))
          done
          echo "$found leak-checked test(s) ran"
          if [ "$found" -lt "${MEOS_VALGRIND_FLOOR:-3}" ]; then
            echo "::error::$found leak-checked test(s), below the floor of ${MEOS_VALGRIND_FLOOR:-3}"
            exit 1
          fi

      - name: Upload valgrind logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: meos/test/build/*.err
