name: MEOS smoke tests (valgrind)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/meos-smoke.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'pgtypes/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages
  push:
    paths:
      - '.github/workflows/meos-smoke.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'pgtypes/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages

jobs:
  smoke:
    name: Smoke + valgrind
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/apt-resilient

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libproj-dev \
            libjson-c-dev \
            libgdal-dev \
            libh3-dev \
            libxml2-dev \
            zlib1g-dev \
            valgrind

      - name: Build and install MEOS
        run: |
          mkdir build
          cd build
          # ALL enables every optional family, as in meos.yml, so a family added
          # later is smoke-tested here without editing this workflow: the list in
          # CMakeLists.txt decides. A family left out installs no public header,
          # and the suite generated from that header is then skipped in silence
          cmake -DCMAKE_BUILD_TYPE=Debug -DMEOS=on -DALL=on ..
          make -j $(nproc)
          sudo make install
          sudo ldconfig

      - name: Regenerate smoke suites and run under valgrind
        run: |
          export MEOS_INCLUDE_DIR=/usr/local/include
          export MEOS_BUILD_DIR=/usr/local/lib
          ./meos/test/run_smoketests.sh

      # Building an index from a whole entry set releases the nodes the index
      # holds, which the assertions cannot see and only a leak check reports
      - name: Run the index builds under valgrind
        run: |
          cd meos/test
          for t in rtree_load_test sptree_load_test; do
            gcc -Wall -Werror=implicit-function-declaration -g \
              -I/usr/local/include -o $t $t.c -L/usr/local/lib -lmeos -lm
            valgrind --leak-check=full --errors-for-leak-kinds=definite \
              --error-exitcode=1 ./$t
          done

      - name: Upload valgrind logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: meos/test/build/*.err
