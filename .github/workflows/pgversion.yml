name: Main Build

# Test for supported PostgreSQL/PostGIS versions.
# Supported PG range is 16 to 19 (see mobilitydb/CMakeLists.txt
# PG_MIN_MAJOR_VERSION / PG_MAX_MAJOR_VERSION); the matrix below covers it.
# 4 (PostgreSQL) * 1 (PostGIS) * 1 (Linux) + 1 (coverage) = 5 jobs are triggered.
# Allow manual trigger

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pgversion.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages
  pull_request:
    paths:
      - '.github/workflows/pgversion.yml'
      - '.github/actions/apt-resilient/**'
      - 'cmake/**'
      - 'meos/**'
      - 'mobilitydb/**'
      - 'pgtypes/**'
      - 'postgis/**'
      - 'CMakeLists.txt'
    branches-ignore:
      - gh-pages

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
        fail-fast: false
        matrix:
          psql: [16, 17, 18, 19]
          postgis: [3]
          os: ["ubuntu-24.04"]
          coverage: [0]
          include:
            - psql: 17
              postgis: 3
              os: "ubuntu-24.04"
              coverage: 1

    steps:
      - uses: actions/checkout@v4

      - name: Remove existing PostgreSQL installations [prefer apt.postgresql.org ]
        run: |
          sudo service postgresql stop || true
          sudo apt-get --purge remove postgresql* -y || true
          sudo rm -rf /var/lib/postgresql/ || true
          sudo rm -rf /etc/postgresql/ || true
          sudo rm -rf /var/log/postgresql/ || true
          echo "Removed existing PostgreSQL installation"

      - name: Set postgresql port as a default
        run: |
          PGP=5432
          echo "PGPORT=${PGP}" >> $GITHUB_ENV        

      - uses: ./.github/actions/apt-resilient

      - name: Add PostgreSQL APT repository
        run: |
          sudo apt-get install curl ca-certificates gnupg
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ \
            $(lsb_release -cs)-pgdg main ${{ matrix.psql }}" > /etc/apt/sources.list.d/pgdg.list'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos++-dev \
            libproj-dev \
            libgdal-dev \
            libjson-c-dev \
            postgresql-${{ matrix.psql }} \
            postgresql-${{ matrix.psql }}-postgis-${{ matrix.postgis }} \
            postgresql-server-dev-${{ matrix.psql }}
          ls /usr/lib/postgresql/${{ matrix.psql }}/lib/
          xzcat --version

      - name: Install coverall dependencies
        if: matrix.coverage == '1'
        run: |
          # postgresql-N-pointcloud so the coverage build can compile
          # -DPOINTCLOUD=ON; without it, meos/src/pointcloud/* (the
          # consumer of pgPointCloud's libpc.a) plus the cross-cutting
          # #if POINTCLOUD blocks in temporal/* are stripped at preprocess
          # time and never get instrumented. The runtime regression tests
          # also need the 'pointcloud' PG extension available (CREATE
          # EXTENSION pointcloud, pulled in before mobilitydb), provided by
          # postgresql-${VER}-pointcloud for the supported PG versions.
          sudo apt-get -y install lcov libh3-dev \
            postgresql-${{ matrix.psql }}-pointcloud \
            postgresql-${{ matrix.psql }}-h3

      - name: Locate libh3 on disk and pin its paths
        if: matrix.coverage == '1'
        # The pgdg libh3-dev package layout differs between releases. Find the
        # header and library at runtime and pin -DH3_INCLUDE_DIR / -DH3_LIBRARY
        # explicitly so CMake's find_path / find_library defaults cannot miss it.
        run: |
          H3_INC=$(dpkg -L libh3-dev | grep -E 'h3api\.h$' | head -1)
          H3_LIB=$(dpkg -L libh3-dev libh3-1 2>/dev/null | grep -E 'libh3\.so$' | head -1)
          if [ -z "$H3_INC" ] || [ -z "$H3_LIB" ]; then
            find /usr -name 'h3api.h' 2>/dev/null
            find /usr -name 'libh3*' 2>/dev/null
            echo "::error::could not locate libh3 headers/library"
            exit 1
          fi
          echo "H3_INCLUDE_DIR=$(dirname "$H3_INC")" >> $GITHUB_ENV
          echo "H3_LIBRARY=$H3_LIB" >> $GITHUB_ENV

      - name: Install pgPointCloud build dependencies
        if: matrix.coverage == '1'
        # meos/src/pointcloud/CMakeLists.txt builds the vendored pgPointCloud
        # static libpc.a as a by-product of the CMake build; it needs the
        # autotools plus libxml2/zlib development files.
        run: |
          sudo apt-get -y install autoconf automake libtool \
            libxml2-dev zlib1g-dev

      - name: Configure for gcc
        run: |
          export PATH=/usr/lib/postgresql/${{ matrix.psql }}/bin:$PATH
          mkdir build
          cd build
          # The coverage build takes ALL, which enables every family from the
          # list in CMakeLists.txt, so a family added later is exercised by the
          # suite without editing this workflow. Its dependencies are installed
          # and located above, on this build only: H3 needs libh3, POINTCLOUD
          # pgPointCloud's libpc.a, RASTER PostGIS raster. The libh3 paths stay
          # pinned because the pgdg package layout differs between releases.
          # The same build checks the assertions (CASSERT=ON), so that the
          # preconditions the internal functions trust are verified over the
          # whole surface. It is the only job that both compiles every family
          # and runs the regression suite; the others keep a release build,
          # where the assertions are compiled out.
          #
          # The version builds take the families that need no package of their
          # own, and cover PostgreSQL 16 to 19. They cannot take ALL until
          # apt.postgresql.org carries h3 and pointcloud for every version in
          # the matrix, which it does for 16 to 18 but not yet for 19, and
          # MobilityDB requires those extensions when their family is on.
          cmake -DCMAKE_BUILD_TYPE=Release -DWITH_COVERAGE=${{ matrix.coverage }} \
            ${{ matrix.coverage == '1' && format('-DALL=ON -DCASSERT=ON -DH3_INCLUDE_DIR={0} -DH3_LIBRARY={1}', env.H3_INCLUDE_DIR, env.H3_LIBRARY) || '-DCBUFFER=ON -DNPOINT=ON -DPOSE=ON -DRGEO=ON -DQUADBIN=ON' }} \
            ..

      - name: Build
        run: |
          cd build
          make -j 4
          sudo make install

      - name: test install
        run: |
          sudo service postgresql start
          sudo -u postgres createdb -p ${PGPORT}  ___mobdb___test___
          sudo -u postgres psql -p ${PGPORT}  -d ___mobdb___test___ -c "CREATE EXTENSION mobilitydb CASCADE; SELECT postgis_full_version(); SELECT mobilitydbFullVersion();"

      - name: Test coexistence with btree_gist
        # btree_gist defines <-> distance operators on base types (integer,
        # bigint, float8, date, timestamptz), so mobilitydb leaves those base
        # types to btree_gist. Both extensions must therefore load together in
        # either order without an "operator <-> already exists" clash.
        run: |
          sudo -u postgres createdb -p ${PGPORT} ___mobdb___btgist1___
          sudo -u postgres psql -p ${PGPORT} -v ON_ERROR_STOP=1 -d ___mobdb___btgist1___ \
            -c "CREATE EXTENSION btree_gist;" -c "CREATE EXTENSION mobilitydb CASCADE;"
          sudo -u postgres createdb -p ${PGPORT} ___mobdb___btgist2___
          sudo -u postgres psql -p ${PGPORT} -v ON_ERROR_STOP=1 -d ___mobdb___btgist2___ \
            -c "CREATE EXTENSION mobilitydb CASCADE;" -c "CREATE EXTENSION btree_gist;"

      - name: Check the btree_gist distance types the lint assumes
        # tools/scripts/check_btree_gist_operators.py carries the list of types
        # btree_gist defines <-> on, so that it can reject a colliding operator
        # without a server. Read the list back from the installed extension: a
        # btree_gist that gains a type is reported here, rather than turning a
        # previously safe MobilityDB operator into a silent clash.
        run: |
          sudo -u postgres psql -p ${PGPORT} -X -A -t -d ___mobdb___btgist1___ \
            -c "SELECT DISTINCT format_type(o.oprleft, NULL)
                FROM pg_operator o
                JOIN pg_depend d ON d.objid = o.oid AND d.deptype = 'e'
                JOIN pg_extension e ON e.oid = d.refobjid
                WHERE o.oprname = '<->' AND e.extname = 'btree_gist'
                ORDER BY 1;" > /tmp/btree_gist_types.actual
          python3 - <<'PY'
          import re, sys
          src = open('tools/scripts/check_btree_gist_operators.py').read()
          block = re.search(r'BTREE_GIST_DISTANCE_TYPES = \{(.*?)\}', src, re.S).group(1)
          expected = set(re.findall(r"'([^']+)'", block))
          alias = {'bigint': 'int8', 'double precision': 'float8', 'integer': 'int4',
                   'real': 'float4', 'smallint': 'int2',
                   'time without time zone': 'time',
                   'timestamp with time zone': 'timestamptz',
                   'timestamp without time zone': 'timestamp'}
          actual = set()
          for line in open('/tmp/btree_gist_types.actual'):
              name = line.strip()
              if name:
                  actual.add(alias.get(name, name))
          if actual != expected:
              print('btree_gist <-> types differ from the lint list')
              print('  only in btree_gist: %s' % sorted(actual - expected))
              print('  only in the lint:   %s' % sorted(expected - actual))
              print('Update BTREE_GIST_DISTANCE_TYPES in')
              print('tools/scripts/check_btree_gist_operators.py to match.')
              sys.exit(1)
          print('btree_gist <-> types match the lint list (%d types)' % len(actual))
          PY

      - name: Test
        run: |
          cd build
          make test

      - name: Generate coverage
        if: matrix.coverage == '1'
        run: |
          cd build
          # Excluding MEOS-specific and other miscellaneous files
          lcov --capture --directory . --include "*/meos/*" --include "*/mobilitydb/*" --exclude "*/pgtypes/*" --exclude "*/postgis/*" --exclude "*/clipper2/*" --exclude "*/geo_constructors.c" --exclude "*/tpoint_datagen.c" --output-file=lcov.info

      # The coverage report is uploaded to the external coveralls.io service.
      # A transient server error there (a 5xx / timeout) is retried with backoff
      # so a temporary outage self-heals and the report is not lost. The earlier
      # attempts are non-fatal; the final attempt is fatal, so a persistent
      # failure still fails the build instead of being silently bypassed.
      - name: Coveralls (attempt 1)
        id: coveralls_attempt_1
        if: matrix.coverage == '1'
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./build/lcov.info"

      - name: Wait before Coveralls retry 1
        if: matrix.coverage == '1' && steps.coveralls_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Coveralls (attempt 2)
        id: coveralls_attempt_2
        if: matrix.coverage == '1' && steps.coveralls_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./build/lcov.info"

      - name: Wait before Coveralls retry 2
        if: matrix.coverage == '1' && steps.coveralls_attempt_1.outcome == 'failure' && steps.coveralls_attempt_2.outcome == 'failure'
        run: sleep 45

      - name: Coveralls (final attempt)
        if: matrix.coverage == '1' && steps.coveralls_attempt_1.outcome == 'failure' && steps.coveralls_attempt_2.outcome == 'failure'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./build/lcov.info"
